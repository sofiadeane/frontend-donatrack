 y transiciones); contraste de tinta sobre papel y sobre colores de bloque por encima de 4,5:1; tomate oscuro para texto chico. Pendiente de medir con herramienta formal.", "paraExtender": "Donante: 'Mis donaciones' como libro personal con historial de estados, misiones e insignias como sección de logros del diario, notificaciones como crónica. Entidad: necesidades como avisos clasificados con barra de cobertura y 'Confirmar recepción' como titular del día. Formularios (registro humana/jurídica/entidad, registrar donación): usar el patrón de form.reg del dashboard con estados de error y ayuda en serif. Falta resolver: tablas largas con paginación, edición de fila, estados de carga y error en la landing, versión impresa, pantallas Donantes/Entidades/Rankings completas y un sistema de ayuda de la paleta."}, "notas": "# La Gaceta, notas\n\n- Landing con 6 páginas (hash o ?vista=portada|registro|galeria|mapa|clasificados|privacidad; extras: estado=, paso=, cat=).\n- Dashboard con 7 pantallas (?vista=inicio|donantes|entidades|donaciones|asignaciones|camiones|rankings; extras: sub=inventario|registrar|normalizacion, abrir=DT-0401, f=dep, paleta=1).\n- Decisiones: el recorrido se lee como libro (DT-0412); la cinta de circulación reemplaza a las tarjetas KPI; las acciones nunca marcan éxito inmediato si dependen de otro actor.\n- Datos agregados por mí a la demo: DT-0416/0418/0419 en inventario, DT-0380/0372/0385 en galería, entidades por aprobar, ejemplos de normalización y la propuesta de DT-0401. Todo rotulado como demostración.\n- Pendiente: nombres de paradas de Ruta Sur, texto legal real de Privacidad, pantallas Donantes/Entidades/Rankings completas.\n"}, {"n": 2, "nombre": "Encastre", "resumen": "Suave · landing de bloques y dashboard de bolsillo en un mismo sistema.", "landing": "<!doctype html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>DonaTrack · Encastre (landing)<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap\" rel=\"stylesheet\">\n<style>\n/* ===== ENCASTRE · sistema compartido (landing + dashboard) ===== */\n/* Paleta Tierra */\n:root{\n  --bone:#DFD0BB;--oro:#E5BD77;--siena:#CC7952;--oxido:#943D2C;--tundora:#474344;\n  --crema:#F2EADB;--crema2:#E8DCC6;--papel:#FBF7EE;--ink:#474344;--ink2:#6A6465;--linea:#DCCDB4;\n  --sol:#F2DFB4;--durazno:#CC7952;--naranja:#E5BD77;--rosa:#E3B4A4;--lila:#DFD0BB;--azul:#D5D1D2;--menta:#E5BD77;--gris:#CFC7C0;\n  --sol-d:#6B4A00;--durazno-d:#FFFFFF;--rosa-d:#6B2517;--lila-d:#5A4A33;--azul-d:#474344;--menta-d:#4A3600;--gris-d:#474344;\n  --r-xl:40px;--r:28px;--r-m:22px;--pill:999px;\n  --fh:'Baloo 2','Arial Rounded MT Bold','Nunito','Avenir Next Rounded',system-ui,sans-serif;\n  --fb:'Nunito','Avenir Next','Segoe UI',system-ui,sans-serif;\n  --flota:0 10px 30px rgba(71,67,68,.22);\n  --gutter:24px;\n}\n*{box-sizing:border-box;margin:0}\nhtml{scroll-behavior:smooth}\nbody{font-family:var(--fb);background:var(--crema);color:var(--ink);line-height:1.5;font-size:16px;-webkit-font-smoothing:antialiased;overflow-x:hidden}\nbutton,input,select{font-family:inherit;font-size:inherit;color:inherit}\na{color:inherit;text-decoration:none}\n:focus-visible{outline:3px solid var(--foco,var(--ink));outline-offset:3px;border-radius:16px}\n.oscuro{--foco:#fff}\nsvg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}\nh1,h2,h3,h4{font-family:var(--fh);font-weight:800;line-height:1.08;letter-spacing:-.5px}\n.small{font-size:13px;font-weight:700;color:var(--ink2)}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}\n/* bloques */\n.bloque{border-radius:var(--r);padding:26px;position:relative}\n.c-sol{background:var(--sol)}.c-dur{background:var(--durazno)}.c-nar{background:var(--naranja)}.c-ros{background:var(--rosa)}.c-lil{background:var(--lila)}.c-azu{background:var(--azul)}.c-men{background:var(--menta)}.c-pap{background:var(--papel)}.c-cre{background:var(--crema2)}\n.c-ink{background:var(--ink);color:#fff}\n.c-ink .small{color:#E6DDD0}\n.cifra{font-family:var(--fh);font-weight:800;line-height:1;letter-spacing:-1px;font-size:56px}\n.ic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.7);color:var(--ink);display:grid;place-items:center;flex:none}\n.ic.ink{background:var(--ink);color:#fff}\n/* botones y chips */\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:var(--pill);font-weight:800;font-size:15px;border:0;cursor:pointer;background:var(--ink);color:#fff;line-height:1.2;transition:transform .2s,opacity .2s}\n.btn:hover{transform:translateY(-1px)}\n.btn[disabled]{opacity:.6;cursor:progress;transform:none}\n.btn.alt{background:var(--papel);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}\n.btn.sm{padding:8px 16px;font-size:13.5px}\n.oscuro .btn:not(.dock-b){background:var(--sol);color:var(--ink)}\n.oscuro .btn.alt{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px #fff}\n.chip{border:0;font-weight:800;font-size:14px;padding:9px 18px;border-radius:var(--pill);background:var(--papel);color:var(--ink);cursor:pointer;box-shadow:inset 0 0 0 2px var(--linea)}\n.chip[aria-pressed=true],.chip[aria-selected=true]{background:var(--ink);color:#fff;box-shadow:none}\n.demo{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:var(--pill);background:rgba(255,255,255,.75);color:var(--ink2)}\n.lv{display:inline-block;font-size:12px;font-weight:900;padding:5px 13px;border-radius:var(--pill);text-transform:uppercase;letter-spacing:.4px;background:rgba(255,255,255,.78);color:var(--ink)}\n/* estados: siempre punto + texto */\n.tag{display:inline-flex;align-items:center;gap:7px;padding:5px 13px;border-radius:var(--pill);font-weight:800;font-size:13px;white-space:nowrap;background:var(--crema2)}\n.tag::before{content:\"\";width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}\n.t-dep{background:var(--sol);color:var(--sol-d)}.t-asi{background:var(--lila);color:var(--lila-d)}.t-lis{background:var(--azul);color:var(--azul-d)}.t-tra{background:var(--durazno);color:var(--durazno-d)}.t-ent{background:var(--menta);color:var(--menta-d)}.t-fal{background:var(--rosa);color:var(--rosa-d)}.t-ven{background:var(--gris);color:var(--gris-d)}\n.tag.blanco{background:#fff}\n/* capsula segmentada */\n.cap{display:flex;gap:3px;height:16px;border-radius:var(--pill);overflow:hidden;background:rgba(255,255,255,.5)}\n.cap span{display:block;border-radius:var(--pill);min-width:6px}\n.pcap{display:flex;gap:5px}.pcap i{flex:1;height:14px;border-radius:var(--pill);background:rgba(71,67,68,.14);transition:background .3s}.pcap i.ok{background:var(--salvia)}\n/* ruta de paradas */\n.ruta{list-style:none;padding:0;display:flex;flex-direction:column}\n.ruta li{display:flex;gap:12px;align-items:center;font-weight:700;font-size:14.5px;padding:6px 0;position:relative}\n.ruta li i{width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px var(--ink);flex:none;z-index:1}\n.ruta li.ok i{background:var(--salvia);box-shadow:inset 0 0 0 3px var(--ink)}\n.ruta li:not(:last-child)::after{content:\"\";position:absolute;left:8px;top:24px;bottom:-6px;width:3px;background:var(--ink);opacity:.25;border-radius:9px}\n.ruta li.ok:not(:last-child)::after{opacity:1}\n.carga{height:12px;background:rgba(255,255,255,.7);border-radius:var(--pill);overflow:hidden}.carga span{display:block;height:100%;background:var(--salvia);border-radius:var(--pill)}\n/* dock (comun a landing movil y dashboard) */\n.dock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);border-radius:var(--pill);padding:8px;display:flex;gap:4px;z-index:30;box-shadow:var(--flota);max-width:calc(100% - 20px);--foco:#fff}\n.dock>*{border:0;background:none;color:#E6DDD0;height:54px;padding:0 18px;border-radius:var(--pill);display:flex;align-items:center;gap:8px;font-weight:800;font-size:14.5px;cursor:pointer;position:relative;white-space:nowrap}\n.dock>*[aria-selected=true],.dock>*[aria-current=true]{background:var(--lila);color:var(--ink)}\n.dock .bd{position:absolute;top:5px;right:7px;min-width:20px;height:20px;border-radius:var(--pill);background:var(--naranja);color:var(--ink);font-size:11px;font-style:normal;display:grid;place-items:center;padding:0 5px}\n/* hoja */\n.velo{position:fixed;inset:0;background:rgba(71,67,68,.4);z-index:40;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}\n.velo.on{opacity:1;visibility:visible}\n.hoja{position:fixed;left:50%;bottom:0;width:min(760px,100%);background:var(--papel);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:26px 28px 34px;z-index:50;box-shadow:0 -20px 50px rgba(71,67,68,.25);transform:translate(-50%,110%);visibility:hidden;transition:transform .35s,visibility .35s;max-height:92vh;overflow:auto}\n.hoja.on{transform:translate(-50%,0);visibility:visible}\n.hoja h2{font-size:26px;margin-bottom:4px}\n.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-90px);background:var(--ink);color:#fff;font-weight:800;padding:12px 22px;border-radius:var(--pill);transition:transform .3s;z-index:80;max-width:calc(100% - 24px);text-align:center;font-size:14.5px}\n.toast.on{transform:translate(-50%,0)}\n@media(max-width:560px){.dock>*{padding:0 13px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}\n\n.c-dur,.c-dur .small,.c-nar,.c-nar .small{color:#2A2526}\n\n.wrap{max-width:1240px;margin:0 auto;padding:0 var(--gutter)}\n/* nav flotante */\n.nav{position:sticky;top:14px;z-index:20;margin:14px auto 0;max-width:1192px;background:rgba(255,252,246,.94);backdrop-filter:blur(8px);border-radius:var(--pill);padding:8px 10px 8px 18px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 24px rgba(120,90,40,.14)}\n.logo{font-family:var(--fh);font-weight:800;font-size:22px;display:flex;align-items:center;gap:9px;margin-right:auto}\n.logo b{width:32px;height:32px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center}\n.nav a.p{padding:9px 15px;border-radius:var(--pill);font-weight:800;font-size:14.5px;color:var(--ink2)}\n.nav a.p:hover,.nav a.p.on{background:var(--crema2);color:var(--ink)}\n.nav .sp{font-size:11px;font-weight:900;background:var(--sol);color:var(--sol-d);border-radius:var(--pill);padding:2px 8px;margin-left:6px}\n/* hero bento */\n.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:22px}\n.hero{grid-column:span 7;grid-row:span 2;padding:42px;display:flex;flex-direction:column;justify-content:space-between;min-height:440px}\n.hero h1{font-size:clamp(42px,5.4vw,76px);line-height:1.12;letter-spacing:-2px}\n.hero h1 em{font-style:normal;background:var(--sol);padding:0 .15em;border-radius:.3em;white-space:nowrap}\n.hero p.lead{font-size:19px;color:var(--ink2);max-width:540px;margin:18px 0 26px;font-weight:600}\n.stat{grid-column:span 5;display:flex;flex-direction:column;justify-content:space-between;min-height:206px}\n.stat .lbl{font-weight:800;display:flex;align-items:center;gap:10px}\n.s-row{grid-column:span 5;display:grid;grid-template-columns:1fr 1fr;gap:16px}\n.s-row .bloque{min-height:206px;display:flex;flex-direction:column;justify-content:space-between}\n.s-row .cifra{font-size:46px}\n.strip{grid-column:span 12;display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;padding:22px 28px}\n/* secciones */\nsection{margin-top:92px;scroll-margin-top:90px}\nh2.t{font-size:clamp(30px,3.6vw,46px);letter-spacing:-1px}\n.lead2{color:var(--ink2);font-size:18px;max-width:640px;margin-top:10px;font-weight:600}\n.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:26px}\n/* problema */\n.prob{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}\n.prob .a{grid-column:span 7;padding:38px;display:flex;flex-direction:column;gap:18px;justify-content:space-between}\n.prob .a h3{font-size:clamp(28px,3vw,40px)}\n.prob .b{grid-column:span 5;padding:38px;display:flex;flex-direction:column;gap:16px;justify-content:space-between}\n.prob .b h3{font-size:clamp(24px,2.4vw,32px)}\n.preg{display:flex;flex-wrap:wrap;gap:10px}\n.preg span{background:rgba(255,255,255,.14);border-radius:var(--pill);padding:8px 18px;font-weight:800;font-size:16px}\n/* recorrido */\n.journey{background:var(--papel);border-radius:var(--r-xl);padding:36px}\n.rail{height:14px;border-radius:var(--pill);background:var(--crema2);position:relative;overflow:hidden;margin-bottom:22px}\n.rail i{position:absolute;inset:0 auto 0 0;width:10%;background:linear-gradient(90deg,var(--sol),var(--lila),var(--azul),var(--menta));border-radius:var(--pill);transition:width .6s}\n.track{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 26px}\n.track button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-weight:800;font-size:14.5px;padding:4px;border-radius:20px}\n.track button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}\n.dot{width:66px;height:66px;border-radius:50%;background:var(--crema2);display:grid;place-items:center;font-size:26px;transition:.3s}\n.track button.on .dot{background:var(--c);box-shadow:0 0 0 6px var(--papel),0 0 0 9px var(--c)}\n.track button.done .dot{background:var(--c)}\n.detail{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}\n.detail .bloque{min-height:210px}\n.detail h3{font-size:28px;margin:12px 0 8px}\n.detail p.x{font-weight:600;font-size:17px}\n.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}\n.estados{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}\n.estados button{border:0;cursor:pointer}\n.estados button[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}\n#eDesc{font-weight:700;font-size:15px;min-height:46px}\n/* roles */\n.roles{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}\n.role{padding:30px;display:flex;flex-direction:column;gap:12px;min-height:260px}\n.role h3{font-size:26px}\n.role p{font-weight:600}\n.role ul{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}\n.role li{background:rgba(255,255,255,.7);border-radius:var(--pill);padding:6px 14px;font-weight:800;font-size:14px}\n.r1{grid-column:span 4}.r2{grid-column:span 4}.r3{grid-column:span 4}\n.mini{background:var(--papel);border-radius:22px;padding:16px;margin-top:6px}\n.mini .lv{background:var(--rosa)}\n.mini b{display:block;font-family:var(--fh);font-size:18px;line-height:1.15;margin:8px 0 12px}\n.mini .acts{margin:0}\n/* transparencia */\n.trans{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}\n.trans .big{grid-column:span 6;padding:34px;display:flex;flex-direction:column;gap:16px;justify-content:space-between}\n.trans .cat{grid-column:span 2;display:flex;flex-direction:column;justify-content:space-between;min-height:200px}\n.trans .cat .cifra{font-size:48px}\n/* galeria */\n.chips{display:flex;flex-wrap:wrap;gap:8px}\n.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px}\n.gi{border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px;min-height:210px}\n.gi[hidden]{display:none}\n.gi h4{font-size:21px}\n.gi .ic{width:48px;height:48px}\n.gi p{font-size:14px;color:var(--ink2);font-weight:700}\n.gi .tag{align-self:flex-start;margin-top:auto}\n.gi:nth-child(3n+1){background:var(--durazno)}.gi:nth-child(3n+2){background:var(--lila)}.gi:nth-child(3n){background:var(--menta)}\n/* mapa */\n.mapblk{display:grid;grid-template-columns:1fr 1.1fr;gap:16px}\n.mapblk .bloque{min-height:310px}\n.soon{display:inline-flex;gap:8px;align-items:center;font-weight:900;padding:8px 18px;border-radius:var(--pill);background:var(--ink);color:#fff}\n/* privacidad */\n.priv{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}\n.priv .bloque{padding:34px}\n.priv h3{font-size:30px;margin:14px 0 8px}\n.priv ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}\n.priv li{display:flex;gap:12px;align-items:flex-start;font-weight:700;background:var(--papel);border-radius:20px;padding:14px 16px}\n/* cta */\n.cta{margin-top:92px;border-radius:var(--r-xl);padding:56px 48px;display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;scroll-margin-top:90px}\n.cta h2{font-size:clamp(32px,4vw,52px)}\n.cta .col{display:flex;flex-direction:column;gap:12px}\n.cta .roles-demo{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}\n.cta .roles-demo .chip{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}\nfooter{padding:36px 0 50px;color:var(--ink2);font-size:14px;font-weight:700;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}\n.dock{display:none}\n@media(max-width:980px){\n  .hero,.stat,.s-row{grid-column:span 12}\n  .hero{min-height:0;padding:30px}\n  .strip{grid-template-columns:1fr}\n  .detail,.mapblk,.cta,.priv{grid-template-columns:1fr}\n  .prob .a,.prob .b,.r1,.r2,.r3,.trans .big{grid-column:span 12}\n  .trans .cat{grid-column:span 4}\n  .gal{grid-template-columns:repeat(2,1fr)}\n  .nav a.p{display:none}\n}\n@media(max-width:700px){\n  .dock{display:flex}\n  body{padding-bottom:96px}\n  .nav .btn.alt{display:none}\n  .nav{margin:10px 12px 0}\n  .logo{font-size:20px}\n}\n@media(max-width:560px){\n  :root{--gutter:16px}\n  .track{grid-template-columns:1fr;gap:6px}\n  .track button{flex-direction:row;text-align:left}\n  .dot{width:52px;height:52px}\n  .journey{padding:20px}\n  .gal{grid-template-columns:1fr}\n  .cta{padding:34px 24px}\n  .cifra{font-size:46px}\n  .hero{padding:26px}\n  .prob .a,.prob .b,.priv .bloque,.trans .big{padding:26px}\n  .trans .cat{grid-column:span 12;min-height:0;gap:10px}\n  section{margin-top:70px}\n  .dock>*{padding:0 11px}\n  .dock>* span{display:none}\n  .dock>*[aria-current=true] span{display:inline}\n}\n<\/style>\n<\/head>\n<body>\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\" focusable=\"false\">\n<symbol id=\"box\" viewBox=\"0 0 24 24\"><path d=\"M21 8l-9-5-9 5 9 5 9-5z\"/><path d=\"M3 8v8l9 5 9-5V8M12 13v8\"/><\/symbol>\n<symbol id=\"clip\" viewBox=\"0 0 24 24\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"3\"/><path d=\"M9 4h6v3H9zM9 12h6M9 16h4\"/><\/symbol>\n<symbol id=\"link\" viewBox=\"0 0 24 24\"><path d=\"M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3A4 4 0 0011 18.7l1-1\"/><\/symbol>\n<symbol id=\"truck\" viewBox=\"0 0 24 24\"><path d=\"M2 6h12v10H2zM14 9h4l4 4v3h-8\"/><circle cx=\"7\" cy=\"18\" r=\"2\"/><circle cx=\"17\" cy=\"18\" r=\"2\"/><\/symbol>\n<symbol id=\"check\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M8 12.5l3 3 5-6\"/><\/symbol>\n<symbol id=\"heart\" viewBox=\"0 0 24 24\"><path d=\"M12 20s-8-5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 9c0 6-8 11-8 11z\"/><\/symbol>\n<symbol id=\"home\" viewBox=\"0 0 24 24\"><path d=\"M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z\"/><\/symbol>\n<symbol id=\"users\" viewBox=\"0 0 24 24\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6M16 4.5a3.5 3.5 0 010 7M18 14c2.5.6 4 2.6 4 6\"/><\/symbol>\n<symbol id=\"shirt\" viewBox=\"0 0 24 24\"><path d=\"M8 3L3 6l2 4 3-1v12h8V9l3 1 2-4-5-3a4 4 0 01-8 0z\"/><\/symbol>\n<symbol id=\"book\" viewBox=\"0 0 24 24\"><path d=\"M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM4 19v-14M9 7h6\"/><\/symbol>\n<symbol id=\"cup\" viewBox=\"0 0 24 24\"><path d=\"M7 3h10l-1 18H8zM7.5 9h9\"/><\/symbol>\n<symbol id=\"drop\" viewBox=\"0 0 24 24\"><path d=\"M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z\"/><\/symbol>\n<symbol id=\"sofa\" viewBox=\"0 0 24 24\"><path d=\"M5 11V8a3 3 0 013-3h8a3 3 0 013 3v3M3 13a2 2 0 014 0v2h10v-2a2 2 0 014 0v5H3zM6 18v2M18 18v2\"/><\/symbol>\n<symbol id=\"leaf\" viewBox=\"0 0 24 24\"><path d=\"M5 19C5 9 10 4 20 4c0 10-5 15-15 15zM5 19c3-5 6-8 10-10\"/><\/symbol>\n<symbol id=\"play\" viewBox=\"0 0 24 24\"><path d=\"M8 5l11 7-11 7z\"/><\/symbol>\n<symbol id=\"bolt\" viewBox=\"0 0 24 24\"><path d=\"M13 3L5 14h6l-1 7 8-11h-6z\"/><\/symbol>\n<symbol id=\"chart\" viewBox=\"0 0 24 24\"><path d=\"M5 20V10M12 20V4M19 20v-7\"/><\/symbol>\n<symbol id=\"grid\" viewBox=\"0 0 24 24\"><rect x=\"4\" y=\"4\" width=\"6\" height=\"6\" rx=\"2\"/><rect x=\"14\" y=\"4\" width=\"6\" height=\"6\" rx=\"2\"/><rect x=\"4\" y=\"14\" width=\"6\" height=\"6\" rx=\"2\"/><rect x=\"14\" y=\"14\" width=\"6\" height=\"6\" rx=\"2\"/><\/symbol>\n<symbol id=\"lock\" viewBox=\"0 0 24 24\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"3\"/><path d=\"M8 11V8a4 4 0 018 0v3\"/><\/symbol>\n<symbol id=\"plus\" viewBox=\"0 0 24 24\"><path d=\"M12 5v14M5 12h14\"/><\/symbol>\n<symbol id=\"x\" viewBox=\"0 0 24 24\"><path d=\"M6 6l12 12M18 6L6 18\"/><\/symbol>\n<\/svg>\n\n<header class=\"wrap\">\n  <nav class=\"nav\" aria-label=\"Principal\">\n    <a class=\"logo\" href=\"#top\"><b><svg class=\"i\"><use href=\"#box\"/><\/svg><\/b>DonaTrack<\/a>\n    <a class=\"p on\" href=\"#top\">Inicio<\/a>\n    <a class=\"p\" href=\"#recorrido\">Cómo funciona<\/a>\n    <a class=\"p\" href=\"#galeria\">Galería<\/a>\n    <a class=\"p\" href=\"#mapa\">Mapa de impacto<span class=\"sp\">Próximamente<\/span><\/a>\n    <a class=\"p\" href=\"#privacidad\">Privacidad<\/a>\n    <a class=\"btn alt sm\" href=\"#sumate\">Registrarme<\/a>\n    <a class=\"btn sm\" href=\"#sumate\">Ingresar<\/a>\n  <\/nav>\n<\/header>\n\n<main class=\"wrap\" id=\"top\">\n  <div class=\"bento\" id=\"inicio\">\n    <div class=\"bloque c-pap hero\">\n      <div>\n        <span class=\"tag t-ent\" style=\"margin-bottom:18px\">Trazabilidad solidaria<\/span>\n        <h1>Cada donación llega. <em>Y se nota.<\/em><\/h1>\n        <p class=\"lead\">DonaTrack une a quien dona, a la entidad que recibe y al depósito que ordena. Lo llevás al depósito, lo registramos, lo asignamos a una necesidad real y lo seguís hasta que la entidad confirma que lo recibió.<\/p>\n      <\/div>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n        <a class=\"btn\" href=\"#recorrido\" data-go=\"recorrido\">Seguir una donación <svg class=\"i\"><use href=\"#play\"/><\/svg><\/a>\n        <a class=\"btn alt\" href=\"#sumate\">Ingresar con sesión demo<\/a>\n      <\/div>\n    <\/div>\n    <div class=\"bloque c-dur stat\">\n      <div class=\"lbl\"><span class=\"ic\"><svg class=\"i\"><use href=\"#check\"/><\/svg><\/span>Donaciones entregadas<\/div>\n      <div><div class=\"cifra\">128<\/div><div class=\"small\" style=\"color:var(--ink)\">confirmadas por las entidades<\/div><\/div>\n    <\/div>\n    <div class=\"s-row\">\n      <div class=\"bloque c-lil\"><div class=\"lbl\" style=\"font-weight:800;display:flex;gap:10px;align-items:center\"><span class=\"ic\"><svg class=\"i\"><use href=\"#home\"/><\/svg><\/span>Entidades<\/div><div><div class=\"cifra\">34<\/div><div class=\"small\" style=\"color:var(--ink)\">ayudadas<\/div><\/div><\/div>\n      <div class=\"bloque c-men\"><div class=\"lbl\" style=\"font-weight:800;display:flex;gap:10px;align-items:center\"><span class=\"ic\"><svg class=\"i\"><use href=\"#leaf\"/><\/svg><\/span>Alimentos<\/div><div><div class=\"cifra\">2.448<\/div><div class=\"small\" style=\"color:var(--ink)\">kg distribuidos<\/div><\/div><\/div>\n    <\/div>\n    <div class=\"bloque c-azu strip\">\n      <div style=\"display:flex;gap:14px;align-items:center\"><span class=\"ic\"><svg class=\"i\"><use href=\"#users\"/><\/svg><\/span><div><div class=\"cifra\" style=\"font-size:36px\">86<\/div><div class=\"small\" style=\"color:var(--ink)\">donantes activos<\/div><\/div><\/div>\n      <div class=\"cap\" role=\"img\" aria-label=\"52 Colaboradores, 26 Sostenedores, 8 Transformadores\"><span style=\"flex:52;background:var(--ink)\"><\/span><span style=\"flex:26;background:var(--azul-d)\"><\/span><span style=\"flex:8;background:#fff\"><\/span><\/div>\n      <div class=\"small\" style=\"text-align:right;color:var(--ink)\">52 Colaboradores · 26 Sostenedores · 8 Transformadores<br><span class=\"demo\">Datos de demostración<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <section id=\"problema\" aria-labelledby=\"hp\">\n    <div class=\"prob\">\n      <div class=\"bloque c-ink a oscuro\">\n        <div><span class=\"lv\">El problema<\/span><\/div>\n        <h3 id=\"hp\">Donás, y después no sabés qué pasó.<\/h3>\n        <p class=\"small\" style=\"font-size:17px;font-weight:600\">Entre la puerta del depósito y la mesa de una entidad hay registro, asignación, camión y confirmación. Cuando eso vive en planillas y mensajes sueltos, nadie ve el recorrido completo.<\/p>\n        <div class=\"preg\"><span>¿Llegó?<\/span><span>¿A quién fue?<\/span><span>¿Cuándo?<\/span><\/div>\n      <\/div>\n      <div class=\"bloque c-sol b\">\n        <h3>DonaTrack deja cada paso a la vista.<\/h3>\n        <p style=\"font-weight:700;font-size:17px\">Cada cambio de estado queda con fecha y responsable. La donante lo mira, la entidad lo confirma y el depósito lo ordena en el mismo lugar.<\/p>\n        <div><span class=\"tag blanco\" style=\"color:var(--ink)\">Trazabilidad<\/span> <span class=\"tag blanco\" style=\"color:var(--ink)\">Transparencia<\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"recorrido\" aria-labelledby=\"hr\">\n    <div class=\"sec-h\"><div><h2 class=\"t\" id=\"hr\">Una donación, cinco paradas<\/h2><p class=\"lead2\">Tocá cada parada, avanzá de a una o reproducí el recorrido completo. Los siete estados reales están abajo.<\/p><\/div>\n    <button class=\"btn\" id=\"play\"><svg class=\"i\"><use href=\"#play\"/><\/svg> Reproducir recorrido<\/button><\/div>\n    <div class=\"journey\">\n      <div class=\"rail\" aria-hidden=\"true\"><i id=\"fill\"><\/i><\/div>\n      <div class=\"track\" id=\"track\"><\/div>\n      <div class=\"detail\">\n        <div class=\"bloque\" id=\"dBlk\"><span class=\"demo\" id=\"dTag\"><\/span><h3 id=\"dTit\"><\/h3><p class=\"x\" id=\"dTxt\"><\/p>\n          <div class=\"acts\"><button class=\"btn\" id=\"adv\">Avanzar un paso<\/button><span class=\"small\" id=\"advMsg\" role=\"status\" style=\"align-self:center\"><\/span><\/div><\/div>\n        <div class=\"bloque c-cre\"><div class=\"small\">Los siete estados reales del sistema. Tocá uno.<\/div>\n          <div class=\"estados\" id=\"estados\"><\/div>\n          <p id=\"eDesc\" aria-live=\"polite\">Algunas transiciones dependen de eventos asíncronos: ahí vas a ver “Actualizando…” y no un éxito inmediato.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"roles\" aria-labelledby=\"hro\">\n    <div class=\"sec-h\"><div><h2 class=\"t\" id=\"hro\">Tres personas, un mismo tablero<\/h2><p class=\"lead2\">Cada rol ve solo lo que necesita para hacer su parte.<\/p><\/div><\/div>\n    <div class=\"roles\">\n      <div class=\"bloque c-ros role r1\"><span class=\"ic\"><svg class=\"i\"><use href=\"#heart\"/><\/svg><\/span><h3>Donante<\/h3><p>Seguí cada donación por sus estados, conocé las necesidades de las entidades y sumá misiones e insignias. Puede ser una persona humana o jurídica.<\/p><ul><li>Mis donaciones<\/li><li>Misiones<\/li><li>Insignias<\/li><li>Notificaciones<\/li><\/ul><\/div>\n      <div class=\"bloque c-men role r2\"><span class=\"ic\"><svg class=\"i\"><use href=\"#home\"/><\/svg><\/span><h3>Entidad<\/h3><p>Mirá tus necesidades con su cobertura (por ejemplo, 18 de 30 frazadas) y confirmá la recepción con un toque.<\/p><ul><li>Necesidades<\/li><li>Confirmar recepción<\/li><\/ul><\/div>\n      <div class=\"bloque c-azu role r3\"><span class=\"ic\"><svg class=\"i\"><use href=\"#truck\"/><\/svg><\/span><h3>Administración<\/h3><p>Registra, asigna y despacha. Una tarea a la vez, sin perder de vista el depósito.<\/p>\n        <div class=\"mini\" id=\"mini\"><\/div>\n        <ul><li>Inventario<\/li><li>Asignaciones<\/li><li>Camiones<\/li><\/ul><\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"numeros\" aria-labelledby=\"hn\">\n    <div class=\"sec-h\"><div><h2 class=\"t\" id=\"hn\">Transparencia en números<\/h2><p class=\"lead2\">Cifras públicas, visibles sin iniciar sesión. <span class=\"demo\">Datos de demostración<\/span><\/p><\/div><\/div>\n    <div class=\"trans\">\n      <div class=\"bloque c-ink big oscuro\"><div><span class=\"lv\">86 donantes activos<\/span><\/div><h3 style=\"font-size:clamp(26px,2.6vw,36px)\">Quiénes sostienen el recorrido<\/h3>\n        <div class=\"cap\" role=\"img\" aria-label=\"52 Colaboradores, 26 Sostenedores, 8 Transformadores\"><span style=\"flex:52;background:var(--lila)\"><\/span><span style=\"flex:26;background:var(--sol)\"><\/span><span style=\"flex:8;background:var(--menta)\"><\/span><\/div>\n        <p class=\"small\" style=\"font-size:15px\">Los donantes se agrupan en tres categorías: Colaboradores, Sostenedores y Transformadores.<\/p><\/div>\n      <div class=\"bloque c-lil cat\"><div class=\"small\" style=\"color:var(--ink)\">Colaboradores<\/div><div class=\"cifra\">52<\/div><\/div>\n      <div class=\"bloque c-sol cat\"><div class=\"small\" style=\"color:var(--ink)\">Sostenedores<\/div><div class=\"cifra\">26<\/div><\/div>\n      <div class=\"bloque c-men cat\"><div class=\"small\" style=\"color:var(--ink)\">Transformadores<\/div><div class=\"cifra\">8<\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"galeria\" aria-labelledby=\"hg\">\n    <div class=\"sec-h\"><div><h2 class=\"t\" id=\"hg\">Galería de donaciones entregadas<\/h2><p class=\"lead2\">Filtrá por categoría. Ejemplos con datos de demostración.<\/p><\/div><\/div>\n    <div class=\"chips\" id=\"chips\" role=\"group\" aria-label=\"Filtrar por categoría\"><\/div>\n    <div class=\"gal\" id=\"gal\"><\/div>\n  <\/section>\n\n  <section id=\"mapa\" aria-labelledby=\"hm\">\n    <div class=\"sec-h\"><div><h2 class=\"t\" id=\"hm\">Mapa de impacto<\/h2><\/div><\/div>\n    <div class=\"mapblk\">\n      <div class=\"bloque c-sol\" style=\"display:flex;flex-direction:column;justify-content:space-between;gap:18px\"><div><span class=\"soon\">Próximamente<\/span><h3 style=\"font-size:30px;margin:18px 0 8px\">Vas a poder ver dónde llega cada aporte<\/h3><p style=\"font-weight:700\">Todavía no está disponible. Mientras tanto, seguí las cifras públicas de transparencia.<\/p><\/div><div class=\"small\" style=\"color:var(--ink)\">Sin ubicaciones reales por ahora.<\/div><\/div>\n      <div class=\"bloque c-pap\">\n        <svg viewBox=\"0 0 420 260\" width=\"100%\" height=\"100%\" role=\"img\" aria-label=\"Esquema ilustrativo de un depósito conectado con entidades\">\n          <rect x=\"0\" y=\"0\" width=\"420\" height=\"260\" rx=\"24\" fill=\"#E8DCC6\"/>\n          <path d=\"M70 130 C130 60 190 60 210 130 S300 200 350 90\" stroke=\"#DFD0BB\" stroke-width=\"14\" stroke-linecap=\"round\" fill=\"none\"/>\n          <path d=\"M210 130 C240 190 280 215 330 205\" stroke=\"#E5BD77\" stroke-width=\"14\" stroke-linecap=\"round\" fill=\"none\"/>\n          <circle cx=\"70\" cy=\"130\" r=\"22\" fill=\"#CC7952\"/><circle cx=\"210\" cy=\"130\" r=\"16\" fill=\"#D5D1D2\"/><circle cx=\"350\" cy=\"90\" r=\"16\" fill=\"#E3B4A4\"/><circle cx=\"330\" cy=\"205\" r=\"16\" fill=\"#F2DFB4\"/>\n          <text x=\"70\" y=\"176\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#474344\">Depósito<\/text>\n          <text x=\"350\" y=\"125\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#6A6465\">Entidad<\/text>\n          <text x=\"330\" y=\"240\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#6A6465\">Entidad<\/text>\n          <text x=\"210\" y=\"30\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#6A6465\">Esquema ilustrativo<\/text>\n        <\/svg>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"privacidad\" aria-labelledby=\"hpv\">\n    <div class=\"priv\">\n      <div class=\"bloque c-lil\"><span class=\"ic\"><svg class=\"i\"><use href=\"#lock\"/><\/svg><\/span><h3 id=\"hpv\">Privacidad<\/h3><p style=\"font-weight:700;font-size:17px\">Sin sesión ves cifras agregadas y entregas de ejemplo. Con sesión, cada rol ve solo lo suyo.<\/p><p style=\"margin-top:18px\"><a class=\"btn\" href=\"#\">Leer la política de privacidad<\/a><\/p><\/div>\n      <div class=\"bloque c-cre\"><ul>\n        <li><span class=\"ic ink\"><svg class=\"i\"><use href=\"#users\"/><\/svg><\/span><span>Cada donante ve sus propias donaciones y notificaciones.<\/span><\/li>\n        <li><span class=\"ic ink\"><svg class=\"i\"><use href=\"#home\"/><\/svg><\/span><span>Cada entidad ve sus necesidades y lo que se le asignó.<\/span><\/li>\n        <li><span class=\"ic ink\"><svg class=\"i\"><use href=\"#clip\"/><\/svg><\/span><span>Cada cambio de estado queda con fecha y responsable.<\/span><\/li>\n      <\/ul><\/div>\n    <\/div>\n  <\/section>\n\n  <div class=\"cta c-ink oscuro\" id=\"sumate\">\n    <div><h2>Sumá tu bloque al recorrido<\/h2><p style=\"margin-top:12px;opacity:.9;font-size:18px;font-weight:600\">Registrate como persona humana, jurídica o entidad. Es el primer paso para que lo tuyo llegue.<\/p><\/div>\n    <div class=\"col\">\n      <a class=\"btn\" href=\"#\">Registrarme como persona humana<\/a>\n      <a class=\"btn alt\" href=\"#\">Registrarme como persona jurídica<\/a>\n      <a class=\"btn alt\" href=\"#\">Registrar mi entidad<\/a>\n      <div class=\"small\" style=\"margin-top:6px\">¿Querés mirar primero? Ingresá con una sesión demo:<\/div>\n      <div class=\"roles-demo\"><a class=\"chip\" href=\"#\">Donante<\/a><a class=\"chip\" href=\"#\">Entidad<\/a><a class=\"chip\" href=\"#\">Administración<\/a><\/div>\n    <\/div>\n  <\/div>\n  <footer><span>DonaTrack · Proyecto académico UTN-FRBA<\/span><span>Datos de demostración · <a href=\"#\" style=\"text-decoration:underline\">Privacidad<\/a><\/span><\/footer>\n<\/main>\n\n<nav class=\"dock\" id=\"dock\" aria-label=\"Secciones\">\n  <a href=\"#top\" data-s=\"inicio\"><svg class=\"i\"><use href=\"#home\"/><\/svg><span>Inicio<\/span><\/a>\n  <a href=\"#recorrido\" data-s=\"recorrido\"><svg class=\"i\"><use href=\"#truck\"/><\/svg><span>Recorrido<\/span><\/a>\n  <a href=\"#roles\" data-s=\"roles\"><svg class=\"i\"><use href=\"#users\"/><\/svg><span>Roles<\/span><\/a>\n  <a href=\"#galeria\" data-s=\"galeria\"><svg class=\"i\"><use href=\"#grid\"/><\/svg><span>Galería<\/span><\/a>\n  <a href=\"#sumate\" data-s=\"sumate\"><svg class=\"i\"><use href=\"#heart\"/><\/svg><span>Sumate<\/span><\/a>\n<\/nav>\n<div class=\"toast\" id=\"toast\" role=\"status\"><\/div>\n\n<script>\nconst reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;\nconst $=id=>document.getElementById(id);\nconst toast=(()=>{const t=$('toast');let tm;return m=>{t.textContent=m;t.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('on'),2200)}})();\n/* en el prototipo los href=\"#\" no navegan */\ndocument.addEventListener('click',e=>{const a=e.target.closest('a[href=\"#\"]');if(a){e.preventDefault();toast('Es un prototipo: este enlace no navega')}});\n/* recorrido */\nconst steps=[\n {n:'Llega al depósito',ic:'box',c:'var(--sol)',s:'En depósito',t:'La persona donante lleva su aporte',x:'Lo llevás al depósito central. Ahí empieza la trazabilidad: la donación queda En depósito, a la espera de ser registrada.'},\n {n:'Se registra',ic:'clip',c:'var(--durazno)',s:'En depósito',t:'La administración la registra',x:'Se cargan qué es, cantidad, vencimiento y categoría. Si algún dato viene desordenado, pasa por revisión de normalización.'},\n {n:'Se asigna',ic:'link',c:'var(--lila)',s:'Asignada',t:'El sistema la asigna a una necesidad',x:'Un algoritmo propone a qué necesidad concreta de una entidad va. La administración revisa y aprueba o descarta la propuesta.'},\n {n:'Viaja',ic:'truck',c:'var(--azul)',s:'Lista para entregar → En traslado',t:'Se carga en un camión y sale por una ruta',x:'Cuando queda Lista para entregar se suma a un camión con paradas. Sale y pasa a En traslado.'},\n {n:'Se confirma',ic:'check',c:'var(--menta)',s:'Entregada',t:'La entidad confirma la recepción',x:'Con “Confirmar recepción” la donación pasa a Entregada y suma al impacto acumulado.'}];\nconst track=$('track');let cur=0,timer=null,busy=false;\nsteps.forEach((s,i)=>{const b=document.createElement('button');b.style.setProperty('--c',s.c);b.innerHTML=`<span class=\"dot\"><svg class=\"i\"><use href=\"#${s.ic}\"/><\/svg><\/span><span>${i+1}. ${s.n}<\/span>`;b.onclick=()=>{stop();go(i)};track.appendChild(b)});\nfunction go(i){cur=i;[...track.children].forEach((b,k)=>{b.classList.toggle('on',k===i);b.classList.toggle('done',k<i);b.setAttribute('aria-current',k===i?'step':'false')});\n const s=steps[i];$('fill').style.width=((i+.5)/5*100)+'%';$('dBlk').style.background=s.c;\n $('dTag').textContent='Estado: '+s.s;$('dTit').textContent=s.t;$('dTxt').textContent=s.x;$('adv').textContent=i===4?'Volver a empezar':'Avanzar un paso'}\nfunction stop(){clearInterval(timer);timer=null}\n$('play').onclick=()=>{stop();go(0);timer=setInterval(()=>{if(cur>=4){stop();return}go(cur+1)},reduce?1600:1400)};\n$('adv').onclick=()=>{if(busy)return;stop();if(cur===4){go(0);return}\n busy=true;$('adv').disabled=true;$('advMsg').textContent='Actualizando…';\n setTimeout(()=>{busy=false;$('adv').disabled=false;$('advMsg').textContent='';go(cur+1)},900)};\ngo(0);\n/* siete estados */\nconst E=[['t-dep','En depósito','Llegó al depósito y espera registro y asignación.'],['t-asi','Asignada','Tiene una necesidad concreta de una entidad; la administración aprobó la propuesta.'],['t-lis','Lista para entregar','Está lista para cargarse en un camión.'],['t-tra','En traslado','Viaja en un camión por una ruta con paradas.'],['t-ent','Entregada','La entidad confirmó la recepción y suma al impacto.'],['t-fal','Entrega fallida','Nadie la abel>\n  <div class=\"f2\"><label>Cantidad<input name=\"c\" required placeholder=\"Ej.: 20 kg\"><\/label><label>Vencimiento<input name=\"v\" type=\"date\"><\/label><\/div>\n  <div class=\"f2\"><label>Categoría<select name=\"k\"><option>Alimentos<\/option><option>Bebidas<\/option><option>Vestimenta<\/option><option>Mobiliario<\/option><option>Útiles escolares<\/option><option>Higiene<\/option><\/select><\/label><label>Donante<input name=\"d\" required placeholder=\"Nombre o razón social\"><\/label><\/div>\n  <button class=\"btn\" id=\"frmBtn\" type=\"submit\">Registrar<\/button><\/form><\/div>\n<nav class=\"dock\" id=\"dock\" aria-label=\"Vistas\"><\/nav>\n<div class=\"toast\" id=\"toast\" role=\"status\"><\/div>\n\n<script>\nconst $=id=>document.getElementById(id);\nconst toast=(()=>{const t=$('toast');let tm;return m=>{t.textContent=m;t.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('on'),2200)}})();\nconst later=(fn)=>setTimeout(fn,800); /* el \"Actualizando…\" se ve siempre; no es movimiento decorativo */\ndocument.addEventListener('click',e=>{const a=e.target.closest('a[href=\"#\"]');if(a)e.preventDefault()});\n/* ---------- datos de demostración ---------- */\nconst P=[\n {lv:'Urgente',c:'var(--rosa)',t:'4 donaciones llevan más de 5 días sin asignar',x:'Ejecutá el algoritmo de asignación y revisá las propuestas: aprobás o descartás cada una.',a:'Ejecutar asignación',ctx:['DT-0398 · 8 días','DT-0396 · 6 días'],go:'asig'},\n {lv:'Urgente',c:'var(--rosa)',t:'2 vencen en 48 h: lácteos y panificados',x:'Priorizalas en el próximo camión o marcalas como vencidas si ya no sirven.',a:'Priorizar en camión',ctx:['DT-0401 · Yogur 40 kg','DT-0403 · Pan lactal 60 u'],go:'deposito'},\n {lv:'Hoy',c:'var(--sol)',t:'Camión 3 sin chofer confirmado para mañana',x:'Ruta Sur, 4 paradas, sale a las 08:00.',a:'Confirmar chofer',ctx:['Ruta Sur','4 paradas','Sale 08:00'],go:'ruta'},\n {lv:'Hoy',c:'var(--sol)',t:'Entrega pendiente de confirmar en Hogar Esperanza',x:'Llegó ayer 17:40. Avisale a la entidad para que confirme la recepción.',a:'Avisar a la entidad',ctx:['Hogar Esperanza','Llegó ayer 17:40'],go:'deposito'},\n {lv:'Esta semana',c:'var(--azul)',t:'3 entidades nuevas esperan aprobación',x:'Revisá sus datos y aprobalas para que puedan publicar necesidades.',a:'Revisar entidades',ctx:['3 entidades'],go:'entidades'}];\nconst S={dep:['En depósito','t-dep'],asi:['Asignada','t-asi'],lis:['Lista para entregar','t-lis'],tra:['En traslado','t-tra'],ven:['Vencida','t-ven']};\nconst TOT={dep:18,asi:11,lis:7,tra:9};\nconst D=[['DT-0398','Frazadas · 30 u','Cooperativa La Huerta','sin asignar','dep','8 días'],['DT-0401','Yogur · 40 kg','Lácteos del Sur','sin asignar','dep','3 días · vence en 48 h'],['DT-0396','Fideos · 35 kg','Cooperativa La Huerta','Merendero Norte','dep','6 días'],['DT-0403','Pan lactal · 60 u','Panadería El Molino','Comedor Los Girasoles','asi','2 días'],['DT-0407','Conservas · 24 kg','Nicolás Pérez','Escuela 12','asi','5 días'],['DT-0411','Camperas · 18 u','Nicolás Pérez','Hogar Esperanza','lis','1 día'],['DT-0412','Arroz · 50 kg','Cooperativa La Huerta','Comedor Los Girasoles','tra','hoy'],['DT-0414','Útiles · 120 u','Librería Central','Escuela 12','tra','hoy']];\nconst A=[{id:'DT-0398',q:'Frazadas · 30 u',d:'Comedor Los Girasoles',n:'Necesidad: Frazadas 18/30',s:'p',c:'var(--rosa)'},{id:'DT-0401',q:'Yogur · 40 kg',d:'Merendero Norte',n:'Necesidad: Leche en polvo 6/40',s:'p',c:'var(--sol)'},{id:'DT-0396',q:'Fideos · 35 kg',d:'Merendero Norte',n:'Necesidad abierta del merendero',s:'p',c:'var(--lila)'}];\nconst NEEDS=[['Frazadas · Comedor Los Girasoles (urgente)','18/30',60,'rosa-d'],['Útiles escolares · Escuela 12','90/120',75,'azul-d'],['Leche en polvo · Merendero Norte (urgente)','6/40',15,'rosa-d'],['Camperas · Hogar Esperanza','18/18',100,'menta-d']];\nconst RK=[['1','Cooperativa La Huerta','var(--sol)'],['2','Nicolás Pérez','var(--lila)'],['3','Panadería El Molino','var(--menta)']];\nconst done=new Set();let idx=0;\n/* ---------- progreso y foco ---------- */\nfunction status(){const n=P.length-done.size;\n $('pcap').innerHTML=P.map((p,i)=>`<i class=\"${done.has(i)?'ok':''}\"><\/i>`).join('');\n $('pcnt').textContent=done.size+' de '+P.length+' resueltos';\n if(cur==='atender'){$('ttl').textContent=n===0?'Todo al día. Buen turno.':(n===1?'Te queda 1 cosa para atender.':'Hoy te toca atender '+n+' cosas.')}\n const b=document.querySelector('#dock [data-v=\"atender\"] .bd');if(b){b.textContent=n;b.hidden=n===0}}\nfunction nextIdx(){for(let k=1;k<=P.length;k++){const j=(idx+k)%P.length;if(!done.has(j)){idx=j;return}}}\nlet busy=false;\nfunction resolver(i,after){if(busy||done.has(i))return;busy=true;toast('Actualizando…');const b=$('ok');if(b&&idx===i){b.disabled=true;b.textContent='Actualizando…'}\n later(()=>{busy=false;done.add(i);if(idx===i)nextIdx();toast('Resuelto (demo)');status();focus();if(after)after()})}\nfunction focus(){const f=$('focus');\n if(done.size===P.length){f.className='focus bloque c-men';f.style.background='';f.innerHTML='<div><span class=\"lv\">Todo al día<\/span><h2>No quedan pendientes.<\/h2><p class=\"x\">Buen turno. Mirá cómo van los camiones en “En ruta”.<\/p><\/div><div class=\"acts\"><button class=\"btn\" data-v=\"ruta\">Ver camiones<\/button><\/div>';queue();return}\n const p=P[idx];f.className='focus bloque';f.style.background=p.c;\n f.innerHTML=`<div><span class=\"lv\">${p.lv} · ${done.size+1} de ${P.length}<\/span><h2>${p.t}<\/h2><p class=\"x\">${p.x}<\/p><div class=\"ctx\">${p.ctx.map(c=>`<span>${c}<\/span>`).join('')}<\/div><\/div>\n <div class=\"acts\"><button class=\"btn\" id=\"ok\">${p.a}<\/button><button class=\"btn alt\" id=\"later\">Después<\/button><button class=\"link\" data-v=\"${p.go}\">Abrir la pantalla<\/button><span class=\"kb\"><kbd>R<\/kbd> resolver · <kbd>D<\/kbd> después<\/span><\/div>`;\n $('ok').onclick=()=>resolver(idx);$('later').onclick=()=>{nextIdx();focus()};queue()}\nfunction queue(){const q=$('queue');q.innerHTML='';P.forEach((p,i)=>{const b=document.createElement('button');b.className='qi'+(done.has(i)?' done':'');b.setAttribute('aria-current',i===idx&&!done.has(i));\n b.innerHTML=`<span class=\"dot\" style=\"background:${p.c}\"><\/span><span><b>${p.t}<\/b><small>${done.has(i)?'Resuelto (demo)':p.lv}<\/small><\/span>`;b.onclick=()=>{if(!done.has(i)){idx=i;focus()}};q.appendChild(b)})}\ndocument.addEventListener('keydown',e=>{if(cur!=='atender'||e.ctrlKey||e.metaKey||e.altKey||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)||document.querySelector('.hoja.on'))return;\n if(e.key==='r'||e.key==='R'){if(done.size<P.length)resolver(idx)}else if((e.key==='d'||e.key==='D')&&done.size<P.length){nextIdx();focus()}});\n/* ---------- donaciones que piden atención + inventario ---------- */\nfunction cards(){$('sc').innerHTML=D.map(d=>`<div class=\"sc\"><span class=\"id\">${d[0]}<\/span>${d[1]}<small>${d[2]} → ${d[3]}<\/small><span class=\"tag ${S[d[4]][1]}\">${S[d[4]][0]}<\/span><small>${d[5]}<\/small><\/div>`).join('')}\nlet sf='todas';const seg=$('seg'),inv=$('inv');\n[['todas','Todas']].concat(Object.entries(S).map(([k,v])=>[k,v[0]])).forEach(([k,l])=>{const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.onclick=()=>{sf=k;drawInv()};seg.appendChild(b)});\nfunction drawInv(){const L=D.filter(d=>sf==='todas'||d[4]===sf);\n [...seg.children].forEach(b=>{const k=b.dataset.k,n=k==='todas'?D.length:D.filter(d=>d[4]===k).length;b.textContent=(k==='todas'?'Todas':S[k][0])+' · '+n;b.setAttribute('aria-pressed',k===sf)});\n $('invNota').textContent=sf==='todas'?`Mostrando las ${D.length} donaciones que piden atención, de 45 en circulación.`:`Mostrando ${L.length}${TOT[sf]?' de '+TOT[sf]:''} · solo las que piden atención.`;\n inv.innerHTML=L.length?L.map(d=>`<div class=\"it\"><span class=\"id\">${d[0]}<\/span><span class=\"c2\">${d[1]}<small>${d[2]}<\/small><\/span><span class=\"c3\">→ ${d[3]}<small>${d[5]}<\/small><\/span><span><span class=\"tag ${S[d[4]][1]}\">${S[d[4]][0]}<\/span><\/span><span>${d[4]==='dep'?`<button class=\"btn sm alt\" data-venc=\"${d[0]}\">Marcar vencida<\/button>`:''}<\/span><\/div>`).join(''):'<div class=\"card\">Nada con ese estado por ahora.<\/div>';\n inv.querySelectorAll('[data-venc]').forEach(b=>b.onclick=()=>{if(b.disabled)return;b.disabled=true;b.textContent='Actualizando…';toast('Actualizando…');later(()=>{const d=D.find(x=>x[0]===b.dataset.venc);d[4]='ven';d[5]='marcada vencida';TOT.dep--;cards();drawInv();toast(d[0]+' marcada como Vencida (demo)')})})}\n/* normalizacion */\nconst NORM=[['“yogurt 40kg”','Yogur · 40 kg'],['“frazada x30”','Frazadas · 30 u']];\nfunction drawNorm(){const q=$('norm');q.innerHTML=NORM.length?'':'<p class=\"small\">No hay datos para revisar.<\/p>';NORM.forEach((n,i)=>{const r=document.createElement('div');r.className='qi';r.style.cursor='default';r.innerHTML=`<span style=\"flex:1\"><small>Llegó como ${n[0]}<\/small><b>Normalizado: ${n[1]}<\/b><\/span><button class=\"btn sm\">Aprobar<\/button>`;r.querySelector('button').onclick=e=>{const b=e.currentTarget;b.disabled=true;b.textContent='Actualizando…';later(()=>{NORM.splice(i,1);drawNorm();toast('Revisión aprobada (demo)')})};q.appendChild(r)})}\n/* ---------- asignaciones ---------- */\nfunction drawProps(){$('props').innerHTML=A.map((a,i)=>{const fin=a.s!=='p';return `<div class=\"s4\"><div class=\"prop bloque ${fin?'fin':''}\" style=\"background:${a.c}\"><span class=\"tag blanco\">${a.s==='p'?'Propuesta del sistema':a.s==='a'?'Aprobada · Asignada':'Descartada'}<\/span><h3>${a.id} · ${a.q}<\/h3><div class=\"flow\"><span>→<\/span><span>${a.d}<\/span><\/div><div class=\"small\" style=\"color:var(--ink)\">${a.n}<\/div>\n <div class=\"acts\">${fin?'':`<button class=\"btn sm\" data-ap=\"${i}\">Aprobar<\/button><button class=\"btn sm alt\" data-de=\"${i}\">Descartar<\/button>`}<\/div><\/div><\/div>`}).join('');\n document.querySelectorAll('[data-ap],[data-de]').forEach(b=>b.onclick=()=>{const ap=b.datase rores antes de confirmar (demo).';toast('Importación en revisión (demo)');view('donantes')})});\n/* registrar */\n$('frm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),b=$('frmBtn');b.disabled=true;b.textContent='Actualizando…';toast('Actualizando…');\n later(()=>{D.unshift(['DT-0417',f.get('q')+' · '+f.get('c'),f.get('d'),'sin asignar','dep','hoy']);TOT.dep++;b.disabled=false;b.textContent='Registrar';e.target.reset();cards();sf='todas';drawInv();closeHoja();view('deposito');toast('DT-0417 registrada: En depósito (demo)')})};\n/* ---------- navegación ---------- */\nconst V=[['atender','Atender','bolt'],['ruta','En ruta','truck'],['deposito','Depósito','box'],['impacto','Impacto','chart']];\nconst TIT={atender:null,ruta:['Camiones en ruta.','Camión 1 y 2 en ruta; Camión 3 cargando.'],deposito:['45 donaciones en circulación.','Registrá, revisá y marcá vencidas.'],impacto:['Lo que ya llegó.','Resumen del mes y necesidades abiertas.'],asig:['Propuestas para revisar.','Aprobás o descartás; nada queda asignado sin tu visto bueno.'],donantes:['Donantes.','Ranking e importación.'],entidades:['Entidades.','Aprobaciones y necesidades.'],rank:['Ranking del mes.','Donantes que más aportaron.']};\nconst PANT=[['Inicio','atender','home'],['Donantes','donantes','users'],['Entidades','entidades','heart'],['Donaciones','deposito','box'],['Asignaciones','asig','link'],['Camiones','ruta','truck'],['Rankings','rank','chart'],['Registrar donación','_reg','plus'],['Importar CSV','_csv','clip']];\nconst dock=$('dock');let cur='atender',lastFocus=null;\nV.forEach(v=>{const b=document.createElement('button');b.dataset.v=v[0];b.innerHTML=`<svg class=\"i\"><use href=\"#${v[2]}\"/><\/svg><span>${v[1]}<\/span>`+(v[0]==='atender'?'<em class=\"bd\">5<\/em>':'');dock.appendChild(b)});\ndock.insertAdjacentHTML('beforeend','<button id=\"more\" aria-label=\"Todas las pantallas\" aria-haspopup=\"dialog\"><svg class=\"i\"><use href=\"#grid\"/><\/svg><span>Más<\/span><\/button>');\nfunction view(v){cur=v;document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));\n const inDock=V.some(x=>x[0]===v);[...dock.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v||(b.id==='more'&&!inDock)));\n const t=TIT[v];$('prog').style.display=v==='atender'?'flex':'none';\n $('sub').textContent=t?t[1]:'Una cosa a la vez: resolvela o dejala para después.';if(t)$('ttl').textContent=t[0];\n if(v==='entidades')drawEnt();status();closeHoja();window.scrollTo(0,0);\n try{history.replaceState(null,'','#'+v)}catch(e){}}\ndocument.addEventListener('click',e=>{const g=e.target.closest('[data-v]');if(g&&g.dataset.v){e.preventDefault();view(g.dataset.v)}\n const o=e.target.closest('[data-open]');if(o)openHoja(o.dataset.open);\n if(e.target.closest('[data-cerrar]')||e.target===$('velo'))closeHoja();\n const f=e.target.closest('[data-fil]');if(f){sf=f.dataset.fil;drawInv();view('deposito')}});\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape')closeHoja()});\nfunction openHoja(id){lastFocus=document.activeElement;closeHoja(true);$('velo').classList.add('on');const h=$(id);h.classList.add('on');$('more').setAttribute('aria-expanded','true');setTimeout(()=>{const f=h.querySelector('input,button.cerrar,button');if(f)f.focus()},60)}\nfunction closeHoja(quiet){document.querySelectorAll('.hoja.on').forEach(h=>h.classList.remove('on'));$('velo').classList.remove('on');if(!quiet&&lastFocus){try{lastFocus.focus()}catch(e){}lastFocus=null}}\n$('more').onclick=()=>openHoja('hMas');\n$('pants').innerHTML=PANT.map(p=>`<button data-p=\"${p[1]}\"><svg class=\"i\"><use href=\"#${p[2]}\"/><\/svg>${p[0]}<\/button>`).join('');\n$('pants').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;const p=b.dataset.p;if(p==='_reg'){openHoja('hReg')}else if(p==='_csv'){closeHoja();document.querySelector('[data-csv]').click()}else{view(p)}};\n/* inicio */\ncards();drawInv();drawNorm();drawProps();status();focus();\nconst q=new URLSearchParams(
