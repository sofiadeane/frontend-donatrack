at 30% 28%,#fff,var(--c) 70%);flex:none;box-shadow:inset 0 -6px 12px rgba(255,255,255,.5),0 8px 18px -10px var(--c)}\n.pill b{font-weight:500;display:block;font-size:18px}.pill span{font-size:14px;color:var(--ink2);font-weight:400}\n.pill .bt{margin-left:auto;background:var(--ink);color:#fff;border-radius:99px;padding:9px 20px;font-size:13.5px;font-weight:500;white-space:nowrap;text-decoration:none}\n/* rueda */\n.dialwrap{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;margin-top:20px}\n.dial{position:relative;width:100%;max-width:500px;margin:0 auto;aspect-ratio:1;border-radius:50%;padding:2%}\n.dial svg{width:100%;height:100%;display:block}\n.dc{position:absolute;inset:25%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px}\n.dc .n{font-size:clamp(60px,9vw,104px);font-weight:200;letter-spacing:-.05em;line-height:1}\n.dc .s{font-weight:500;font-size:clamp(14px,1.7vw,20px)}\n.dc .k{font-size:12px;color:var(--ink2);font-weight:400}\n.tk{stroke:rgba(20,24,26,.3);stroke-width:2.2;stroke-linecap:round;transition:stroke .3s,stroke-width .3s}\n.tk.dv{stroke:rgba(150,70,50,.5)}\n.tk.on{stroke:var(--lime2);stroke-width:3.4}\n.tk.cur{stroke:var(--ink);stroke-width:4.2}\n.nl{font:600 7px var(--font);fill:var(--ink2);text-anchor:middle}\n.nl.cur{fill:var(--ink)}\n#mk{transition:transform .5s cubic-bezier(.4,.1,.2,1)}\n.steps{display:grid;gap:7px}\n.step{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:rgba(255,255,255,.6);padding:10px 16px;border-radius:18px;font:400 15px var(--font);color:var(--ink);cursor:pointer}\n.step small{margin-left:auto;font-size:12px;color:var(--ink2)}\n.step em{font-style:normal;font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink2);width:16px}\n.step i{width:10px;height:10px;border-radius:50%;background:rgba(20,24,26,.28);flex:none}\n.step.dv i{background:#c98374}\n.step[aria-pressed=true]{background:var(--lime);border-color:var(--lime2);font-weight:600}.step[aria-pressed=true] i{background:var(--ink)}.step[aria-pressed=true] small,.step[aria-pressed=true] em{color:var(--lime-ink)}\n.dinfo{margin-top:14px;padding:18px 20px;font-size:15px;font-weight:400}\n.log{margin-top:14px;padding:16px 20px}\n.log ol{list-style:none;padding:0;display:grid;gap:7px;margin-top:8px;font-size:13.5px;font-weight:400}\n.log li{display:flex;gap:10px;align-items:center}\n.log li i{width:8px;height:8px;border-radius:50%;background:var(--lime2);flex:none}\n.log li span{color:var(--ink2);margin-left:auto;font-size:12.5px;text-align:right}\n.log li.dv i{background:#c98374}\n/* números */\n.nums{display:grid;grid-template-columns:repeat(2,1fr);gap:0 30px;margin-top:20px}\n.nm{padding:26px 6px 22px;border-top:1px solid var(--line)}\n.nm .big{font-size:clamp(60px,9.5vw,136px);font-weight:200;letter-spacing:-.06em;line-height:.95}\n.nm .big sup{font-size:.28em;vertical-align:top;color:var(--moss);letter-spacing:0;font-weight:500}\n.nm p{font-size:15px;color:var(--ink2);font-weight:400}\n.gauge{height:12px;border-radius:99px;background:rgba(20,24,26,.1);margin-top:12px;overflow:hidden;display:flex;max-width:360px}\n.gauge i{display:block;height:100%}\n/* galería */\n.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}\n.fc{font:400 14px var(--font);padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.65);cursor:pointer;color:var(--ink)}\n.fc[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}\n.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}\n.gal article{padding:20px 22px;overflow:hidden;min-height:132px}\n.gal article::after{content:\"\";position:absolute;right:-36px;top:-36px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--c,var(--lime)),transparent 70%);opacity:.9;pointer-events:none}\n.gal article[hidden]{display:none}.gal b{font-weight:500;display:block;font-size:18px}\n.tag{display:inline-block;font:600 12px var(--font);padding:4px 11px;border-radius:99px;background:var(--lime);color:var(--lime-ink);margin-top:12px}\n.tag.o{background:rgba(255,255,255,.6);border:1px solid var(--ink);color:var(--ink)}\n.soon{padding:34px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;margin-top:20px}\n.final{padding:38px;margin-top:20px;background:linear-gradient(135deg,rgba(255,255,255,.6),rgba(228,250,140,.55))}\n.priv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}\n.priv div{padding:20px 22px;font-size:14.5px;color:var(--ink2);font-weight:400}.priv b{display:block;color:var(--ink);font-weight:500;font-size:17px;margin-bottom:4px}\nfooter{padding:34px 0 10px;font-size:13px;color:var(--ink2);font-weight:400}\n@media (max-width:900px){\n  .idx{position:sticky;top:8px;left:auto;transform:none;flex-direction:row;overflow-x:auto;margin:8px 10px 0;padding:8px;border-radius:99px;gap:2px;align-items:center;width:auto;max-width:calc(100vw - 20px)}\n  .idx .lg{margin:0 6px 0 4px}.idx a{white-space:nowrap;padding:7px 12px}.idx a small{display:none}.idx .tog{margin:0 0 0 4px;white-space:nowrap}\n  main{margin-left:0}\n  .herogrid,.dialwrap,.soon,.prob,.priv{grid-template-columns:1fr}.gal{grid-template-columns:1fr 1fr}\n  .pill .bt{display:none}.nums{grid-template-columns:1fr}\n}\n@media (max-width:520px){.crystal{max-width:260px}.gal{grid-template-columns:1fr}.pill{border-radius:36px}.pill .av{width:46px;height:46px}.final,.soon{padding:24px}}\n@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}\n<\/style>\n<\/head>\n<body>\n<div class=\"aur\" aria-hidden=\"true\">\n  <i style=\"left:-8%;top:-2%;width:560px;height:560px;background:var(--pink)\"><\/i>\n  <i style=\"right:-10%;top:4%;width:620px;height:620px;background:var(--lime);opacity:.55\"><\/i>\n  <i style=\"left:30%;top:16%;width:520px;height:520px;background:var(--lav)\"><\/i>\n  <i style=\"right:-6%;top:34%;width:560px;height:560px;background:var(--mint)\"><\/i>\n  <i style=\"left:-10%;top:48%;width:600px;height:600px;background:var(--sky)\"><\/i>\n  <i style=\"right:10%;top:62%;width:560px;height:560px;background:var(--pink);opacity:.7\"><\/i>\n  <i style=\"left:10%;top:78%;width:620px;height:620px;background:var(--lime);opacity:.5\"><\/i>\n  <i style=\"right:-8%;top:90%;width:520px;height:520px;background:var(--lav)\"><\/i>\n<\/div>\n<nav class=\"idx glass\" aria-label=\"Índice\">\n  <span class=\"lg\"><i>d<\/i>DonaTrack<\/span>\n  <a href=\"#inicio\" data-s=\"inicio\"><small>00<\/small>Inicio<\/a>\n  <a href=\"#problema\" data-s=\"problema\"><small>01<\/small>El problema<\/a>\n  <a href=\"#actores\" data-s=\"actores\"><small>02<\/small>Tres actores<\/a>\n  <a href=\"#rueda\" data-s=\"rueda\"><small>03<\/small>La rueda<\/a>\n  <a href=\"#cifras\" data-s=\"cifras\"><small>04<\/small>Cifras<\/a>\n  <a href=\"#galeria\" data-s=\"galeria\"><small>05<\/small>Galería y mapa<\/a>\n  <a href=\"#privacidad\" data-s=\"privacidad\"><small>06<\/small>Privacidad<\/a>\n  <a href=\"#entrar\" data-s=\"entrar\"><small>07<\/small>Entrar<\/a>\n  <button class=\"tog\" id=\"solid\" aria-pressed=\"false\">Sin transparencia<\/button>\n<\/nav>\n\n<main>\n  <section id=\"inicio\" style=\"padding-top:clamp(40px,6vw,80px)\">\n    <div class=\"herogrid\">\n      <div>\n        <p class=\"eyebrow\">Trazabilidad de donaciones solidarias<\/p>\n        <h1>Dar es fácil. <mark>Saber adónde llegó<\/mark>, también.<\/h1>\n        <p class=\"lead\">DonaTrack muestra el camino completo de cada donación, desde que entra al depósito hasta que la entidad confirma que la recibió.<\/p>\n        <div class=\"row\"><a class=\"btn\" href=\"#rueda\">Ver la rueda de estados<\/a><a class=\"btn sec\" href=\"#entrar\">Ingresar<\/a><\/div>\n      <\/div>\n      <svg class=\"crystal\" viewBox=\"0 0 400 430\" role=\"img\" aria-label=\"Bloque de cristal translúcido con degradé lima y rosado\">\n        <defs>\n          <linearGradient id=\"a\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#f7c6dc\"/><stop offset=\".5\" stop-color=\"#e9ffa0\"/><stop offset=\"1\" stop-color=\"#8fc21c\"/><\/linearGradient>\n          <linearGradient id=\"b\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".95\"/><stop offset=\"1\" stop-color=\"#cfc5f6\" stop-opacity=\".55\"/><\/linearGradient>\n          <linearGradient id=\"c\" x1=\"1\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#bdeedb\" stop-opacity=\".9\"/><stop offset=\"1\" stop-color=\"#fff\" stop-opacity=\".45\"/><\/linearGradient>\n          <linearGradient id=\"e\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#e6ff7a\" stop-opacity=\".75\"/><stop offset=\"1\" stop-color=\"#f7c6dc\" stop-opacity=\".55\"/><\/linearGradient>\n          <radialGradient id=\"d\"><stop offset=\"0\" stop-color=\"#fff\"/><stop offset=\"1\" stop-color=\"#d8f24a\" stop-opacity=\".45\"/><\/radialGradient>\n        <\/defs>\n        <polygon points=\"200,60 340,130 340,290 200,360 60,290 60,130\" fill=\"url(#a)\" opacity=\".4\"/>\n        <polygon points=\"200,60 340,130 200,200 60,130\" fill=\"url(#b)\" stroke=\"#fff\" stroke-opacity=\".95\"/>\n        <polygon points=\"60,130 200,200 200,360 60,290\" fill=\"url(#c)\" stroke=\"#fff\" stroke-opacity=\".7\"/>\n        <polygon points=\"340,130 200,200 200,360 340,290\" fill=\"url(#e)\" stroke=\"#fff\" stroke-opacity=\".7\"/>\n        <path d=\"M80 118L200 178 320 118\" stroke=\"#fff\" stroke-opacity=\".8\" fill=\"none\" stroke-width=\"2\"/>\n        <g stroke=\"#14181a\" stroke-opacity=\".3\" fill=\"none\" stroke-width=\"1.4\"><path d=\"M130 165L200 200 270 165\"/><path d=\"M200 200V290\"/><\/g>\n        <circle cx=\"200\" cy=\"215\" r=\"34\" fill=\"url(#d)\" stroke=\"#fff\" stroke-width=\"2\"/>\n        <ellipse cx=\"190\" cy=\"204\" rx=\"11\" ry=\"6\" fill=\"#fff\" opacity=\".85\"/>\n        <rect x=\"258\" y=\"238\" width=\"68\" height=\"24\" rx=\"12\" fill=\"#fff\" fill-opacity=\".88\"/><text x=\"292\" y=\"254\" text-anchor=\"middle\" font-family=\"Figtree,sans-serif\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1a2503\">DT-0412<\/text>\n        <rect x=\"72\" y=\"300\" width=\"84\" height=\"24\" rx=\"12\" fill=\"#fff\" fill-opacity=\".8\"/><text x=\"114\" y=\"316\" text-anchor=\"middle\" font-family=\"Figtree,sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"#1a2503\">En depósito<\/text>\n        <ellipse cx=\"200\" cy=\"398\" rx=\"110\" ry=\"14\" fill=\"#6f8f10\" opacity=\".14\"/>\n      <\/svg>\n    <\/div>\n    <div class=\"facts\"><span>Registro con fecha y responsable<\/span><span>Asignación revisada por la administración<\/span><span>Entrega confirmada por la entidad<\/span><\/div>\n  <\/section>\n\n  <section id=\"problema\">\n    <p class=\"eyebrow\">01 · El problema<\/p>\n    <h2>Donar es un acto de fe. <mark>Hasta ahora.<\/mark><\/h2>\n    <div class=\"prob\">\n      <div class=\"glass\"><span class=\"tg\">Sin trazabilidad<\/span><p class=\"q\">Se entrega en el depósito y no se vuelve a saber nada: si se asignó, si salió, si llegó.<\/p><p class=\"mini\" style=\"margin-top:12px\">La donante no ve el camino y la entidad no sabe qué viene en camino.<\/p><\/div>\n      <div class=\"glass b\"><span class=\"tg\">Con DonaTrack<\/span><p class=\"q\">Cada cambio de estado queda registrado con fecha y responsable, y se muestra completo.<\/p><p class=\"mini\" style=\"margin-top:12px\">De la entrada al depósito a la confirmación de recepción de la entidad.<\/p><\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"actores\">\n    <p class=\"eyebrow\">02 · Tres actores<\/p>\n    <h2>Una donación, <mark>tres manos<\/mark><\/h2>\n    <p class=\"lead\">Cada actor ve lo que le toca. La trazabilidad une las tres miradas.<\/p>\n    <div class=\"pills\">\n      <div class=\"pill glass\" style=\"--c:#f2a9c8\"><span class=\"av\"><\/span><div><b>Donantes<\/b><span>Personas humanas o jurídicas. Siguen sus donaciones con el historial de estados, conocen las necesidades de las entidades y suman misiones e insignias.<\/span><\/div><a class=\"bt\" href=\"#entrar\">Quiero donar<\/a><\/div>\n      <div class=\"pill glass\" style=\"--c:#a9cff2\"><span class=\"av\"><\/span><div><b>Entidades beneficiarias<\/b><span>Publican necesidades con su cobertura (ej. 18 de 30 frazadas) y confirman la recepción de lo asignado.<\/span><\/div><a class=\"bt\" href=\"#entrar\">Soy una entidad<\/a><\/div>\n      <div class=\"pill glass\" style=\"--c:#c9e56a\"><span class=\"av\"><\/span><div><b>Administración del depósito<\/b><span>Registra lo que llega, revisa y aprueba o descarta las asignaciones, y organiza los camiones y sus rutas.<\/span><\/div><a class=\"bt\" href=\"#entrar\">Administro<\/a><\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"rueda\">\n    <p class=\"eyebrow\">03 · Cómo funciona: la rueda de estados<\/p>\n    <h2>Siete estados, <mark>una vuelta<\/mark><\/h2>\n    <p class=\"lead\">Girá la rueda (clic, flechas del teclado o reproducir) para ver qué significa cada estado. Cinco forman el camino; dos son desvíos.<\/p>\n    <div class=\"dialwrap\">\n      <div class=\"dial glass\">\n        <svg viewBox=\"-128 -128 256 256\" id=\"dsvg\" aria-hidden=\"true\"><\/svg>\n        <div class=\"dc\" aria-live=\"polite\"><span class=\"n\" id=\"dn\">1<\/span><span class=\"s\" id=\"ds\"><\/span><span class=\"k\" id=\"dk\"><\/span><\/div>\n      <\/div>\n      <div>\n        <div class=\"steps\" id=\"steps\" role=\"group\" aria-label=\"Estados de una donación\"><\/div>\n        <p class=\"glass dinfo\" id=\"dinfo\"><\/p>\n        <div class=\"glass log\"><h3>Registro de ejemplo · DT-0412<\/h3><ol id=\"log\"><\/ol><p class=\"mini\" style=\"margin-top:8px\">Ejemplo ilustrativo del historial: cada línea guarda fecha y responsable.<\/p><\/div>\n        <div class=\"row\" style=\"margin-top:14px\"><button class=\"btn dk\" id=\"play\">Reproducir recorrido<\/button><\/div>\n      <\/div>\n    <\/div>\n    <p class=\"mini\" style=\"margin-top:18px\">Algunas transiciones dependen de eventos asíncronos: mientras el sistema confirma, la plataforma muestra “Actualizando…” y no un éxito inmediato.<\/p>\n  <\/section>\n\n  <section id=\"cifras\">\n    <p class=\"eyebrow\">04 · Transparencia en números<\/p>\n    <h2>Lo que llegó, <mark>sin maquillaje<\/mark><\/h2>\n    <p class=\"mini\">Datos de demostración<\/p>\n    <div class=\"nums\">\n      <div class=\"nm\"><div class=\"big\">128<\/div><p>donaciones entregadas<\/p><\/div>\n      <div class=\"nm\"><div class=\"big\">34<\/div><p>entidades ayudadas<\/p><\/div>\n      <div class=\"nm\"><div class=\"big\">2.448<sup>kg<\/sup><\/div><p>de alimentos distribuidos<\/p><\/div>\n      <div class=\"nm\"><div class=\"big\">86<\/div><p>donantes activos<\/p><div class=\"gauge\" role=\"img\" aria-label=\"52 Colaboradores, 26 Sostenedores, 8 Transformadores\"><i style=\"width:60.5%;background:#14181a\"><\/i><i style=\"width:30.2%;background:#7fae14\"><\/i><i style=\"width:9.3%;background:#f3a9c6\"><\/i><\/div><p class=\"mini\" style=\"margin-top:8px\">52 Colaboradores · 26 Sostenedores · 8 Transformadores<\/p><\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"galeria\">\n    <p class=\"eyebrow\">05 · Galería de lo entregado<\/p>\n    <h2>Cada cosa, <mark>con su destino<\/mark><\/h2>\n    <p class=\"mini\">Entregas de demostración. Filtrá por categoría.<\/p>\n    <div class=\"chips\" id=\"chips\" role=\"group\" aria-label=\"Filtrar por categoría\"><\/div>\n    <div class=\"gal\" id=\"gal\"><\/div>\n    <p class=\"mini\" id=\"empty\" hidden style=\"margin-top:10px\">Todavía no hay entregas de demostración en esta categoría.<\/p>\n    <div class=\"soon glass\"><div><span class=\"tag o\" style=\"margin:0 0 10px\">Próximamente<\/span><h2 style=\"font-size:clamp(28px,3.2vw,44px);margin:6px 0\">Mapa de impacto<\/h2><p class=\"mini\">Todavía no está disponible. El esquema es ilustrativo y no muestra ubicaciones reales.<\/p><\/div>\n      <svg viewBox=\"0 0 300 130\" role=\"img\" aria-label=\"Esquema ilustrativo del mapa de impacto\"><g fill=\"none\" stroke=\"#14181a\" stroke-opacity=\".28\"><circle cx=\"150\" cy=\"62\" r=\"20\"/><circle cx=\"150\" cy=\"62\" r=\"40\"/><circle cx=\"150\" cy=\"62\" r=\"58\"/><\/g><g fill=\"#d8f24a\" stroke=\"#14181a\"><circle cx=\"150\" cy=\"62\" r=\"6\"/><circle cx=\"96\" cy=\"40\" r=\"4\"/><circle cx=\"205\" cy=\"84\" r=\"4\"/><circle cx=\"212\" cy=\"32\" r=\"4\"/><\/g><text x=\"150\" y=\"126\" text-anchor=\"middle\" font-size=\"10\" fill=\"#3d4743\" font-family=\"sans-serif\">Esquema ilustrativo<\/text><\/svg><\/div>\n  <\/section>\n\n  <section id=\"privacidad\">\n    <p class=\"eyebrow\">06 · Privacidad<\/p>\n    <h2>Se muestra el camino, <mark>no a las personas<\/mark><\/h2>\n    <div class=\"priv\">\n      <div class=\"glass\"><b>Cifras agregadas<\/b>Lo público son totales de demostración: entregas, entidades, kilos y donantes activos.<\/div>\n      <div class=\"glass\"><b>Cada rol, lo suyo<\/b>Donantes, entidades y administración ven la información que corresponde a su rol.<\/div>\n      <div class=\"glass\"><b>Política completa<\/b>El texto definitivo vive en la página de privacidad. <a href=\"#\">Leer privacidad<\/a><\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"entrar\">\n    <p class=\"eyebrow\">07 · Entrar<\/p>\n    <div class=\"glass final\">\n      <h2>Probá la plataforma <mark>por rol<\/mark><\/h2>\n      <p class=\"lead\">Sesión demo para donante, entidad o administración. O registrate como persona humana, jurídica o entidad.<\/p>\n      <div class=\"row\"><a class=\"btn\" href=\"#\">Ingresar como donante<\/a><a class=\"btn dk\" href=\"#\">Ingresar como administración<\/a><a class=\"btn sec\" href=\"#\">Registrarme<\/a><\/div>\n    <\/div>\n    <footer>DonaTrack · Proyecto académico UTN-FRBA · Datos de demostración · <a href=\"#\">Privacidad<\/a><\/footer>\n  <\/section>\n<\/main>\n<script>\nconst $= ontains('on'))return;if(e.key==='Escape')closeP();if(e.key==='ArrowDown'){sel=Math.min(fl.length-1,sel+1);drawP();e.preventDefault()}if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);drawP();e.preventDefault()}if(e.key==='Enter')run(sel)});\n<\/script>\n<\/body>\n<\/html>\n", "sistema": {"concepto": "Lima translúcida: cristal gris-lima con tipografía enorme y liviana. Vidrio esmerilado sobre auroras pastel (rosa, lavanda, menta, celeste) con acento lima; la precisión editorial reemplaza al adorno.", "principios": ["La tipografía es protagonista: cifras y títulos enormes en peso 200-300, sin tarjetas para las cifras clave.", "El vidrio es un acento, no un fondo de lectura: el texto siempre va en tinta #14181a sobre superficies de 52-78 % de blanco, y existe el modo 'Sin transparencia'.", "Lima solo marca lo que está activo o resaltado (estado actual, resaltador de títulos, acción primaria); el negro marca acciones secundarias firmes.", "El estado es estructura: carriles en el dashboard, rueda de 84 ticks en la landing.", "Densidad operativa primero: cada carril muestra solo lo que pide atención y el total real.", "Nada de éxito inmediato: toda acción asíncrona pasa por 'Actualizando…'."], "tokens": {"color": {"--bg": "#e6e9e2", "--ink": "#14181a", "--ink2": "#3d4743 (texto secundario, contraste >9:1 sobre vidrio claro)", "--lime": "#d8f24a", "--lime2": "#aacf1f", "--lime-ink": "#1a2503 (texto sobre lima)", "--moss": "#3f5a0c (acento en texto)", "--rose / --rose-ink": "#f6c9c0 / #5a1608 (urgente, fallida)", "--pink,--lav,--mint,--sky": "#f7c6dc, #cfc5f6, #bdeedb, #bddcf6 (solo auroras y toques en vidrio)", "--g / --g2": "rgba(255,255,255,.52) / .78 (vidrio / vidrio de lectura)", "--solid": "#f6f7f2 (fallback sin transparencia)"}, "tipografia": {"familia": "Figtree (Google Fonts) con fallback ui-sans-serif, system-ui, Segoe UI, Roboto", "display": "300, hasta 112 px, tracking -0.045em; resaltador lima en la palabra clave", "cifras": "200, 34-136 px, tracking -0.05em", "cuerpo": "400, 14-19 px; títulos de bloque 500-600", "etiquetas": "600, 10-12 px"}, "espaciado": "Escala de 4: 4, 8, 12, 16, 20, 26, 34; secciones de landing con 56-116 px de aire; dashboard con gaps de 12 px.", "radios": "Pastilla total (99px) para botones, tags y píldoras; 18-28 px para vidrio; círculo para la rueda.", "bordes/sombras": "Borde blanco 85 % + brillo interno de 1 px + degradé especular 135° al 55 % de blanco; sombra suave 0 18px 38px -28px; blur 22 px saturate 1.45."}, "componentes": [{"nombre": "Vidrio (.glass)", "uso": "Contenedor base: carriles, paneles, píldoras, barra de pestañas."}, {"nombre": "Resaltador (mark)", "uso": "Subrayado lima en la palabra clave de cada título."}, {"nombre": "Índice lateral numerado", "uso": "Navegación fija de la landing (chips en horizontal en móvil)."}, {"nombre": "Rueda de estados", "uso": "84 ticks, 12 por estado, número central, marcadores 1-7, pasos clicables, registro de ejemplo con fecha y responsable."}, {"nombre": "Cristal isométrico", "uso": "Objeto SVG ancla del hero."}, {"nombre": "Cifras en línea", "uso": "KPI sin tarjetas, separadas por filetes."}, {"nombre": "Carril + chip expandible", "uso": "Estado con conteo real, ticks de volumen y donaciones que piden atención; al abrir muestra acciones."}, {"nombre": "Fila de ruta", "uso": "Paradas con puntos (hecho, actual, pendiente punteado), carga con medidor."}, {"nombre": "Fila de lista (.rw)", "uso": "Inventario y propuestas; en móvil colapsa a tarjeta."}, {"nombre": "Paleta Ctrl K", "uso": "Navega a cualquier sección y dispara acciones."}, {"nombre": "Tag de estado", "uso": "Siempre con texto; lima = avance, contorno = en depósito, rosa = problema, gris = vencida."}, {"nombre": "Botón 'Sin transparencia'", "uso": "Cambia a superficies sólidas; se recuerda en localStorage y respeta prefers-reduced-transparency."}, {"nombre": "Toast", "uso": "Confirma 'Actualizando…' y luego el resultado."}], "patrones": ["Landing: índice fijo numerado, secciones de una idea cada una, dos palabras resaltadas por título.", "Dashboard: título-cifra, cifras en línea, carriles + columna lateral, rutas, necesidades/actividad/impacto.", "Acción asíncrona: botón 'Actualizando…' deshabilitado, toast, estado nuevo recién a los ~1,5 s.", "Navegación por hash o ?vista=… con subvistas (#donaciones/registrar).", "Filtros como píldoras con conteo; vacío con mensaje."], "tono": "Directo, sobrio, con una pizca de ingenio; sin dramatismo. Voseo rioplatense.", "copyEjemplos": {"headline": "Dar es fácil. Saber adónde llegó, también.", "seccion": "Siete estados, una vuelta", "dashboard": "45 donaciones en carriles", "pendiente": "4 donaciones llevan más de 5 días sin asignar", "asincronico": "Actualizando… el estado cambia cuando el sistema lo confirma", "vacio": "Ninguna donación coincide con el filtro."}, "estados": {"EN_DEPOSITO": "Tag con contorno; carril 1; tick 1 de la rueda", "ASIGNACION_REALIZADA": "Tag lima 'Asignada'; carril 2; propuesta para aprobar o descartar", "LISTA_PARA_ENTREGAR": "Tag lima; carril 3; se carga en camión", "EN_TRASLADO": "Tag lima; carril 4; sin acciones, referencia al camión", "ENTREGADA": "Último tick lima de la rueda; sale de los carriles y suma al impacto", "ENTREGA_FALLIDA": "Tag rosa; 'fuera de carril' con Reasignar; desvío de la rueda con ticks rojizos", "VENCIDA": "Tag gris; 'fuera de carril'; desvío de la rueda"}, "accesibilidad": "Texto en tinta sobre vidrio claro (≥9:1); lima solo con texto #1a2503; foco visible de 3 px; estados siempre con texto; chips operables con teclado (Enter/Espacio); rueda con flechas; paleta con aria-modal y Esc; prefers-reduced-motion y prefers-reduced-transparency respetados; botón 'Sin transparencia' como fallback manual; soporte sin backdrop-filter vía @supports.", "paraExtender": "Falta llevar el sistema a: vistas de donante (historial de estados como rueda pequeña, misiones e insignias) y entidad (necesidades con medidor, 'Confirmar recepción'), formularios de registro e ingreso (campos de vidrio con validación), notificaciones, estados vacíos y de error, y tablas largas con paginación o virtualización. Las pantallas Donantes, Entidades y Rankings del dashboard son vistas resumidas. Falta definir el modo oscuro."}, "notas": "# d5-c3 Lima translúcida: notas\n- Landing: índice 00-07; se sumó \"El problema\" y \"Privacidad\"; rueda con 7 estados (5 camino + 2 desvíos), registro de ejemplo (fechas ilustrativas), galería con 7 entregas de demostración.\n- Dashboard: Inicio, Donaciones (inventario, registrar, normalización), Asignaciones, Camiones con contenido completo; Donantes, Entidades y Rankings resumidos. Estado en memoria: las acciones cambian conteos y carriles tras \"Actualizando…\".\n- Soporta `#vista`, `#donaciones/registrar` y `?vista=` (más `?solid=1` para forzar sin transparencia).\n- Supuestos de demo: DT-0415, DT-0416, DT-0390 se completaron con la actividad dada; el destino de propuestas para DT-0398/0401 es inventado solo al ejecutar la asignación; \"Aprobar\" deja la donación en Lista para entregar.\n- Pendiente: texto definitivo de privacidad, modo oscuro, paradas reales de Ruta Sur (se rotulan Parada 1-4), qué acciones reales existen para Camión 3 sin chofer.\n- Chrome headless no baja de 500 px de ancho: las capturas de 390 se hicieron con un iframe de 390 px (shotm.sh).\n"}, {"n": 6, "nombre": "Atlas de Rumbos", "resumen": "Cartografía · cartas náuticas, rosa de los vientos, sellos de lacre y constancias.", "landing": "<!doctype html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>DonaTrack · Atlas de Rumbos<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=EB+Garamond:ital@0;1&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--parch:#eee1c0;--parch2:#e2d0a4;--card:#f6edd3;--kraft:#c8a46c;--kraftD:#a98147;--ink:#2a1c12;--tob:#2a1 ue la recibió. Con fecha y responsable en cada tramo, para que nada se pierda en el camino.<\/p>\n  <div class=\"cta\"><a class=\"b p\" href=\"#derrota\">Seguir una donación →<\/a><a class=\"b\" href=\"#entrar\">Ingresar con sesión demo<\/a><\/div>\n  <div class=\"vig\"><svg aria-hidden=\"true\"><use href=\"#anc\"/><\/svg><span>Un proyecto de gestión y trazabilidad para organizaciones solidarias universitarias.<\/span><\/div>\n <\/div>\n <div class=\"art\" id=\"art\"><\/div>\n<\/div><\/header>\n\n<section id=\"problema\" style=\"padding-top:20px\"><div class=\"wrap\">\n <span class=\"kick\">II · Qué es y por qué<\/span>\n <h2>Sin carta, <em>se pierde el rumbo<\/em><\/h2>\n <div class=\"spread\">\n  <svg class=\"snake\" viewBox=\"0 0 1000 420\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M-10 20C120-20 200 60 150 110S20 130 60 190 260 250 230 160 90 150 130 260 300 330 480 300 620 360 760 330\" fill=\"none\" stroke=\"#2a1c12\" stroke-width=\"3.2\" stroke-linecap=\"round\"/><\/svg>\n  <div class=\"col paper\" style=\"padding:26px 26px 14px;z-index:2\">\n   <p><span class=\"cap-red\" aria-hidden=\"true\">U<\/span>na persona deja lo que quiere donar en un depósito. Una entidad necesita justo eso. Entre un punto y el otro hay registros, asignaciones, camiones y paradas.<\/p>\n   <p>Cuando ese camino no queda anotado, el hilo se corta: nadie sabe si la donación espera, si vence mañana, si ya salió o si llegó. <strong>DonaTrack pone cada tramo en la carta<\/strong> y lo deja a la vista de quien dona, de quien recibe y de quien administra.<\/p>\n   <p style=\"font-style:italic;font-size:17px\">Una plataforma de gestión y trazabilidad para organizaciones solidarias universitarias.<\/p>\n  <\/div>\n  <figure class=\"engr\" style=\"margin:0;z-index:2\"><svg viewBox=\"0 0 460 340\" role=\"img\" aria-label=\"Grabado: velero sobre olas, con una línea punteada que marca su rumbo\"><rect width=\"460\" height=\"340\" fill=\"url(#hatch2)\" opacity=\".0\"/><g id=\"eng\"><\/g><\/svg><figcaption>Lo que no se anota, se pierde en el mar.<\/figcaption><\/figure>\n <\/div>\n<\/div><\/section>\n\n<section id=\"derrota\" class=\"dk\"><div class=\"wrap\">\n <span class=\"kick\">III · Cómo funciona<\/span>\n <h2><span class=\"rn\">I–VII<\/span>La derrota de una donación, <em>lámina por lámina<\/em><\/h2>\n <p style=\"max-width:42em\">Una donación recorre cinco puertos: depósito, asignación, carga, travesía y entrega. Hay dos desvíos que no queremos, pero también se registran. Tocá un puerto o una lámina para leer qué pasa en cada uno.<\/p>\n <div class=\"chart\" style=\"color:var(--ink)\"><svg class=\"hv\" id=\"chH\" viewBox=\"0 0 1000 390\" role=\"group\" aria-label=\"Carta con la derrota de una donación: cinco puertos y dos desvíos\"><\/svg><svg class=\"vv\" id=\"chV\" viewBox=\"0 0 340 740\" role=\"group\" aria-label=\"Carta vertical con la derrota de una donación\"><\/svg><\/div>\n <div class=\"lam\" id=\"lam\" role=\"group\" aria-label=\"Siete láminas, una por estado\"><\/div>\n <div class=\"read\" style=\"color:var(--parch)\"><div class=\"plate paper\" id=\"plate\"><\/div><div class=\"rd\" id=\"rd\" aria-live=\"polite\"><\/div><\/div>\n <div class=\"ctl\"><button class=\"b p\" id=\"play\">Recorrer la derrota<\/button><span id=\"asy\" role=\"status\"><\/span><\/div>\n <p class=\"note\">Los cambios que dependen de eventos asíncronos muestran «Actualizando…» antes de confirmarse: nada se da por hecho hasta que el sistema responde.<\/p>\n<\/div><\/section>\n\n<section id=\"abordo\"><div class=\"wrap\">\n <span class=\"kick\">IV · Tres a bordo<\/span>\n <h2>Quién <em>lleva cada instrumento<\/em><\/h2>\n <div class=\"crew\">\n  <article class=\"paper\"><svg class=\"ins\" aria-hidden=\"true\"><use href=\"#rose\"/><\/svg><h3>Quien dona<\/h3><div class=\"sub\">Personas donantes<\/div><p>Personas humanas o jurídicas. Siguen el historial de estados de cada donación y miran las necesidades de las entidades.<\/p><ul><li>Categoría de donante, misiones con progreso e insignias<\/li><li>Notificaciones de cada cambio<\/li><\/ul><\/article>\n  <article class=\"paper\"><svg class=\"ins\" aria-hidden=\"true\"><use href=\"#anc\"/><\/svg><h3>Quien recibe<\/h3><div class=\"sub\">Entidades beneficiarias<\/div><p>Publican sus necesidades con cobertura, por ejemplo 18 de 30 frazadas, y confirman la recepción de lo que llega a puerto.<\/p><ul><li>Necesidades activas<\/li><li>Acción «Confirmar recepción»<\/li><\/ul><\/article>\n  <article class=\"paper\"><svg class=\"ins\" aria-hidden=\"true\"><use href=\"#whl\"/><\/svg><h3>Quien lleva el timón<\/h3><div class=\"sub\">Administración del depósito<\/div><p>Registra lo que entra, corre los algoritmos de asignación, revisa y aprueba o descarta propuestas, arma los camiones y atiende las alertas.<\/p><ul><li>Inventario con «Marcar vencida»<\/li><li>Camiones, rutas y paradas<\/li><\/ul><\/article>\n <\/div>\n<\/div><\/section>\n\n<section id=\"cifras\" class=\"dk\"><div class=\"wrap\">\n <span class=\"kick\">V · Transparencia pública<\/span>\n <h2>El libro de <em>cifras<\/em><\/h2><span class=\"demo\">Datos de demostración<\/span>\n <div class=\"fig\">\n  <svg viewBox=\"-120 -120 240 240\" role=\"img\" aria-label=\"Anillo de donantes activos: 52 colaboradores, 26 sostenedores y 8 transformadores\"><circle r=\"112\" fill=\"none\" stroke=\"#b8893a\" stroke-width=\"1\"/><circle r=\"106\" fill=\"none\" stroke=\"#b8893a\" stroke-width=\".6\" stroke-dasharray=\"2 5\"/><g id=\"ticks\" stroke=\"#b8893a\" stroke-width=\"1\"><\/g>\n   <g fill=\"none\" stroke-width=\"26\" transform=\"rotate(-90)\"><circle r=\"76\" stroke=\"#e6c373\" stroke-dasharray=\"231 478\"/><circle r=\"76\" stroke=\"#d99361\" stroke-dasharray=\"114 478\" stroke-dashoffset=\"-234\"/><circle r=\"76\" stroke=\"#c9ccce\" stroke-dasharray=\"30 478\" stroke-dashoffset=\"-351\"/><\/g>\n   <use href=\"#rose\" x=\"-52\" y=\"-52\" width=\"104\" height=\"104\" style=\"color:#eee1c0;opacity:.18\"/>\n   <text y=\"4\" text-anchor=\"middle\" font-family=\"Cinzel,serif\" font-weight=\"700\" font-size=\"34\" fill=\"#eee1c0\">86<\/text><text y=\"22\" text-anchor=\"middle\" font-family=\"Cormorant Garamond,serif\" font-size=\"13\" fill=\"#eee1c0\">donantes activos<\/text><\/svg>\n  <div><div class=\"nums\"><div><strong>128<\/strong>donaciones entregadas<\/div><div><strong>34<\/strong>entidades ayudadas<\/div><div><strong>2.448<\/strong>kg de alimentos distribuidos<\/div><div><strong>86<\/strong>donantes activos<\/div><\/div>\n  <ul class=\"keys\"><li><i style=\"background:#e6c373\"><\/i>52 Colaboradores<\/li><li><i style=\"background:#d99361\"><\/i>26 Sostenedores<\/li><li><i style=\"background:#c9ccce\"><\/i>8 Transformadores<\/li><\/ul><\/div>\n <\/div>\n<\/div><\/section>\n\n<section id=\"constancia\"><div class=\"wrap\">\n <span class=\"kick\">VI · Constancia de recepción<\/span>\n <h2>Cuando llega, <em>se sella<\/em><\/h2>\n <div class=\"cons\">\n  <div class=\"cert\"><span class=\"demo\">Ejemplo ilustrativo<\/span><div class=\"cin\">\n   <div class=\"cc\">DONATRACK · DEPÓSITO CENTRAL<\/div><h3>Constancia de recepción<\/h3><div class=\"orn\" aria-hidden=\"true\">◆<\/div>\n   <p>Se deja constancia de que <b>Comedor Los Girasoles<\/b> confirmó la recepción de la donación <b>DT-0409<\/b>: frazadas × 30.<\/p>\n   <p style=\"font-size:16px;font-style:italic\">Queda registrado con fecha y responsable. Estado final: Entregada.<\/p>\n   <div class=\"sig\"><div>Responsable de la entidad<\/div><div class=\"slot\" id=\"slot\" style=\"border:0;padding:0;min-height:0\"><span class=\"ph\">Sin<br>sellar<\/span><\/div><div>Responsable del depósito<\/div><\/div>\n  <\/div><\/div>\n  <div>\n   <p>La entidad cierra el recorrido confirmando la recepción. Hasta que el sistema lo registra, la constancia queda sin sellar. Probalo con la donación de ejemplo.<\/p>\n   <button class=\"b p\" id=\"conf\">Confirmar recepción<\/button> <span id=\"cmsg\" role=\"status\" style=\"font-family:var(--serif);font-style:italic;font-size:19px;margin-left:8px\"><\/span>\n   <h3 style=\"font-family:var(--serif);font-size:26px;margin:28px 0 0\">Tres lacres, tres usos<\/h3>\n   <div class=\"seals\"><figure><svg class=\"seal\"><use href=\"#seal\"/><\/svg>Lacre rojo<br>recepción confirmada<\/figure><figure><svg class=\"seal cu\"><use href=\"#seal\"/><\/svg>Lacre cobre<br>asignación aprobada<\/figure><figure><svg class=\"seal ag\"><use href=\"#seal\"/><\/svg>Lacre plata<br>acción enviada<\/figure><\/div>\n  <\/div>\n <\/div>\n<\/div><\/section>\n\n<section id=\"entregas\" style=\"padding-top:10px\"><div class=\"wrap\">\n <span class=\"kick\">VII · Galería de entregas<\/span>\n <h2>Etiquetas de <em>lo que ya llegó<\/em><\/h2><span class=\"demo\">Datos de demostración<\/span>\n <div class=\"stk\" id=\"stk\" role=\"group\" aria-label=\"Filtrar por categoría\"><\/div>\n <p id=\"gtxt\" aria-live=\"polite\"><\/p>\n <div class=\"tags\" id=\"tags\"><\/div>\n<\/div><\/section>\n\n<section id=\"atlas\" class=\"dk\"><div class=\"wrap atl\">\n <div><span class=\"kick\">VIII · Mapa de impacto<\/span><h2>El atlas <em>todavía está en blanco<\/em><\/h2><span class=\"soon\">PRÓXIMAMENTE<\/span>\n  <p>El mapa de impacto aún no existe. Cuando esté listo, vas a ver hasta dónde llegó lo que se donó. Mientras tanto, la carta de al lado es solo un esquema ilustrativo: no marca ninguna ubicación real.<\/p><\/div>\n <figure class=\"fog\" style=\"margin:0\"><svg viewBox=\"0 0 400 300\" role=\"img\" aria-label=\"Esquema ilustrativo de una carta con zonas sin cartografiar\"><g id=\"fogc\"><\/g><\/svg><figcaption style=\"text-align:center;font-style:italic;font-size:15px;padding-top:6px\">Esquema ilustrativo, sin ubicaciones reales.<\/figcaption><\/figure>\n<\/div><\/section>\n\n<section id=\"privacidad\"><div class=\"wrap priv\">\n <div><span class=\"kick\">IX · Privacidad<\/span><h2>Lo público <em>y lo reservado<\/em><\/h2><\/div>\n <ul><li>La vista pública muestra cifras agregadas y entregas de ejemplo, sin exponer datos personales.<\/li><li>El detalle completo de cada donación, con fecha y responsable, lo ven las personas que participan con su sesión.<\/li><li>Cada rol ve solo lo que le corresponde: donante, entidad o administración.<\/li><\/ul>\n<\/div><\/section>\n\n<section id=\"entrar\" style=\"padding-top:20px\"><div class=\"wrap\">\n <span class=\"kick\">X · Zarpar<\/span><h2>Subí <em>a bordo<\/em><\/h2>\n <div class=\"ent\">\n  <div class=\"paper\"><h3>Ingresar<\/h3><p>Entrá con una sesión de demostración según tu rol.<\/p><div class=\"row\"><a class=\"b\" href=\"#entrar\">Donante<\/a><a class=\"b\" href=\"#entrar\">Entidad<\/a><a class=\"b p\" href=\"#entrar\">Administración<\/a><\/div><\/div>\n  <div class=\"paper\"><h3>Registrarte<\/h3><p>Sumate como persona humana, persona jurídica o entidad.<\/p><div class=\"row\"><a class=\"b\" href=\"#entrar\">Persona humana<\/a><a class=\"b\" href=\"#entrar\">Persona jurídica<\/a><a class=\"b\" href=\"#entrar\">Entidad<\/a><\/div><\/div>\n <\/div>\n<\/div><\/section>\n<footer><div class=\"wrap\"><svg aria-hidden=\"true\"><use href=\"#rose\"/><\/svg><span>DonaTrack · Proyecto académico UTN-FRBA<\/span><a href=\"#privacidad\">Privacidad<\/a><a href=\"#top\">Volver a la rosa ↑<\/a><\/div><\/footer>\n\n<div class=\"pal\" id=\"pal\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Ir a una sección\"><div class=\"pbox\"><input id=\"q\" placeholder=\"Escribí una sección o acción…\" autocomplete=\"off\" aria-controls=\"pl\"><ul id=\"pl\" role=\"listbox\"><\/ul><p>↑ ↓ para moverte · Enter para ir · Esc para cerrar<\/p><\/div><\/div>\n<div class=\"toast\" id=\"toast\" role=\"status\"><\/div>\n<script>\nconst $=s=>document.querySelector(s),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;\nconst toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2800)};\nconst pt=(r,a)=>[r*Math.sin(a*Math.PI/180),-r*Math.cos(a*Math.PI/180)];\nconst U=(id,x,y,w,st)=>`<use hre \/kbd><\/button>\n<\/div><\/header>\n<nav class=\"idx\" aria-label=\"Pantallas de administración\"><div class=\"wrap\" id=\"idx\"><\/div><\/nav>\n\n<main><div class=\"wrap\">\n\n<!-- I INICIO -->\n<section class=\"view\" id=\"v-inicio\" aria-label=\"Inicio\">\n <div class=\"g2 sec\" style=\"border:0;padding-top:0\">\n  <div><div class=\"dial\"><svg viewBox=\"-200 -200 400 400\" id=\"wheel\" role=\"group\" aria-label=\"Rosa de estados: 45 donaciones en circulación\"><\/svg><\/div><\/div>\n  <div>\n   <span class=\"kick\">Hoy<\/span><span class=\"demo\">Datos de demostración<\/span>\n   <h1>45 donaciones en la rosa, <em>2 piden rumbo ya.<\/em><\/h1>\n   <div class=\"leg\" id=\"leg\" role=\"group\" aria-label=\"Filtrar por estado\"><\/div>\n   <ol class=\"pend\" id=\"pend\"><\/ol>\n  <\/div>\n <\/div>\n <section class=\"sec\" aria-labelledby=\"hm\">\n  <h2 id=\"hm\"><span class=\"rn\">II<\/span>Láminas que piden atención<\/h2>\n  <p class=\"ct\" id=\"ct\" aria-live=\"polite\"><\/p>\n  <div class=\"hand\" id=\"hand\"><\/div>\n <\/section>\n <div class=\"cols\">\n  <div><h2><span class=\"rn\">III<\/span>Flota en la carta<\/h2>\n   <ul class=\"mini\" id=\"fl\"><\/ul><p class=\"ct\">Esquema ilustrativo: no es un mapa real ni hay seguimiento en vivo.<\/p>\n   <div class=\"desv\"><h3>Desvíos del rumbo<\/h3>\n    <p><span class=\"st s-fal\" style=\"background:var(--card);color:var(--red)\">Entrega fallida<\/span><\/p><p>Ayer nadie recibió DT-0390 en Merendero Norte: vuelve al depósito.<\/p><button class=\"b s p\" data-async=\"Reasignar DT-0390\">Reasignar<\/button>\n    <p style=\"margin-top:12px\"><span class=\"st s-ven\" style=\"background:var(--card);color:#4a3f3a\">Vencida<\/span><\/p><p>2 donaciones vencen en 48 h (DT-0401 y DT-0403). Si no llegan a tiempo, se marcan como vencidas.<\/p><button class=\"b s\" data-go=\"donaciones\">Ver inventario<\/button><\/div>\n  <\/div>\n  <div><h2><span class=\"rn\">IV<\/span>Mareas del mes<\/h2>\n   <div class=\"big\">23<\/div><p sty \">Bitácora de hoy<\/h2><ul class=\"log\" id=\"log\"><\/ul><\/div>\n <\/div>\n<\/section>\n\n<!-- II DONANTES -->\n<section class=\"view\" id=\"v-donantes\" hidden aria-label=\"Donantes\">\n <span class=\"kick\">II · Donantes<\/span><h1>86 donantes <em>a bordo<\/em><\/h1><span class=\"demo\">Datos de demostración<\/span>\n <div class=\"cat3\"><div><strong>52<\/strong>Colaboradores<\/div><div><strong>26<\/strong>Sostenedores<\/div><div><strong>8<\/strong>Transformadores<\/div><\/div>\n <section class=\"sec\"><h2>Importar CSV de donantes<\/h2><p>Cargá un archivo CSV para sumar donantes. La importación corre en segundo plano y el resultado aparece cuando termina.<\/p>\n  <div class=\"drop\"><label class=\"b\" for=\"csv\" style=\"cursor:pointer\">Elegir archivo CSV<\/label><input type=\"file\" id=\"csv\" accept=\".csv,text/csv\" class=\"sr\"><span class=\"msg\" id=\"csvm\" role=\"status\">Ningún archivo elegido.<\/span><\/div><\/section>\n <section class=\"sec\" style=\"border:0\"><h2>Donantes del mes<\/h2><ol class=\"rk\"><li><b>I<\/b>Cooperativa La Huerta<\/li><li><b>II<\/b>Nicolás Pérez<\/li><li><b>III<\/b>Panadería El Molino<\/li><\/ol><button class=\"b s\" data-go=\"rankings\">Ver rankings<\/button><\/section>\n<\/section>\n\n<!-- III ENTIDADES -->\n<section class=\"view\" id=\"v-entidades\" hidden aria-label=\"Entidades\">\n <span class=\"kick\">III · Entidades<\/span><h1>34 entidades <em>en puerto<\/em><\/h1><span class=\"demo\">Datos de demostración<\/span>\n <section class=\"sec\"><h2>Esperan aprobación (3)<\/h2><div id=\"ent\"><\/div><\/section>\n <section class=\"sec\" style=\"border:0\"><h2>Necesidades abiertas<\/h2><div id=\"nec2\" style=\"max-width:640px\"><\/div><\/section>\n<\/section>\n\n<!-- IV DONACIONES -->\n<section class=\"view\" id=\"v-donaciones\" hidden aria-label=\"Donaciones\">\n <span class=\"kick\">IV · Donaciones<\/span><h1>Inventario <em>del depósito<\/em><\/h1>\n <div class=\"tabs\" role=\"tablist\" id=\"tabs\"><button role=\"tab\" data-t usuarios reales?", "respuesta": "Encastre y Huerto: simples y cercanas para donantes y entidades. En el panel, conviene una versión más densa y consistente (original o Huerto)."}, {"pregunta": "¿Cuál tiene más potencial de identidad reconocible?", "respuesta": "La Gaceta, Tratado y Atlas: son muy distintivas. Pero la identidad también debe resistir el tiempo y el uso cotidiano; ahí pesa menos."}, {"pregunta": "¿Cuál tiene el mejor equilibrio entre personalidad, profesionalismo y usabilidad?", "respuesta": "Huerto: personalidad propia, tono sobrio y estados claros. La original es más segura pero menos propia."}, {"pregunta": "¿Qué elementos podrían combinarse?", "respuesta": "De Huerto, la paleta con coral solo para alertas y los estados con nombre real. De Encastre, la cola de tareas. De Gaceta, el libro de registro. De Atlas, el recorrido como ruta. De la original, la base de tokens."}, {"pregunta": "¿Qué dirección recomendás y por qué?", "respuesta": "Híbrida: Huerto como identidad pública y base de color. Dashboard sobre la estructura de la original, con la cola de tareas de Encastre. Prioriza confianza, claridad y contexto institucional sobre novedad."}], "incertidumbres": ["Se usó el texto del PDF extraído con PDFKit (la herramienta de lectura de PDF no estaba disponible). No se vieron las figuras ni diagramas del enunciado.", "No hay pruebas con usuarias reales (donantes, entidades, administración). Todo juicio sobre público es interpretativo.", "Las asociaciones de color y de estilo (calma, confianza, tradición) dependen de cada cultura y contexto; no son verdades universales.", "No se midió contraste ni accesibilidad de cada propuesta; solo se tomó lo declarado en las notas y lo visto en capturas.", "No se revisaron todas las pantallas de cada propuesta con detalle (se miró una captura de dashboard por propuesta y notas); la landing de cada una se evaluó por sus notas y sistema.json.", "El enunciado no define identidad visual ni público en detalle: se infirió del marco institucional (UTN Solidaria) y de los requisitos de UI.", "Pesos sugeridos y puntajes no son métricas objetivas.", "La paleta de Encastre cambió a 'A · Tierra' después de esta evaluación. Los puntajes de accesibilidad y diferenciación de esa columna no se rehicieron con la paleta nueva."]};
var st = {i: 0, v: 'landing', w: '100%', ev: false};
var W = null;
function $(i) { return document.getElementById(i); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function isHex(s) { return typeof s === 'string' && /^#[0-9a-fA-F]{3,8}$/.test(s.trim()); }
function val(v) {
  if (v == null) return '—';
  if (Array.isArray(v)) return '<ul>' + v.map(function (x) { return '<li>' + (typeof x === 'object' ? gen(x) : val(x)) + '</li>'; }).join('') + '</ul>';
  if (typeof v === 'object') return gen(v);
  var s = String(v); var m = s.match(/#[0-9a-fA-F]{6}\b|#[0-9a-fA-F]{3}\b/);
  return (m ? '<span class="sw" style="background:' + m[0] + '"></span>' : '') + esc(s);
}
function gen(o) { return '<dl>' + Object.keys(o).map(function (k) { return '<dt>' + esc(k) + '</dt><dd>' + val(o[k]) + '</dd>'; }).join('') + '</dl>'; }
function tabs() { $('tabs').innerHTML = D.map(function (d, i) { return '<button class="tab" type="button" data-i="' + i + '" aria-pressed="' + (!st.ev && i === st.i) + '">' + d.n + ' · ' + esc(d.nombre) + '</button>'; }).join('') + '<button class="tab" type="button" data-ev="1" aria-pressed="' + st.ev + '">Evaluación</button>'; }
function paint(load) {
  var d = D[st.i]; tabs();
  var evm = st.ev;
  ['info', 'sys'].forEach(function (x) { $(x).hidden = evm; });
  document.querySelector('.stage').hidden = evm; $('ev').hidden = !evm;
  document.querySelectorAll('#vs button, #ws button, #fsBtn').forEach(function (b) { b.disabled = evm; });
  if (evm) { renderEval(); try { history.replaceState(null, '', '#evaluacion'); } catch (e) {} return; }
  document.querySelectorAll('#vs button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === st.v)); });
  document.querySelectorAll('#ws button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.w === st.w)); });
  $('fr').style.setProperty('--w', st.w);
  if (load !== false) $('fr').srcdoc = d[st.v];
  $('info').innerHTML = '<h2>' + esc(d.nombre) + '</h2><p>' + esc(d.resumen) + '</p>';
  var s = d.sistema || {};
  var keys = ['principios', 'tono', 'copyEjemplos', 'tokens', 'componentes', 'patrones', 'estados', 'accesibilidad', 'paraExtender'];
  var lab = {principios:'Principios', tono:'Tono', copyEjemplos:'Ejemplos de copy', tokens:'Tokens', componentes:'Componentes', patrones:'Patrones', estados:'Cómo se representan los 7 estados', accesibilidad:'Accesibilidad', paraExtender:'Qué falta para extenderlo al resto del producto'};
  $('sys').innerHTML = '<div class="cols">' + keys.filter(function (k) { return s[k] != null; }).map(function (k) { return '<div class="card"><h3>' + lab[k] + '</h3>' + val(s[k]) + '</div>'; }).join('') + '</div>' +
    (d.notas ? '<div class="card"><h3>Notas del desarrollo</h3><pre>' + esc(d.notas) + '</pre></div>' : '') +
    '<p class="note">Prototipos exploratorios con datos de demostración. Todavía no son la implementación del proyecto.</p>';
  $('fsLab').textContent = d.nombre + ' · ' + (st.v === 'landing' ? 'Landing' : 'Dashboard');
  $('fsV').textContent = st.v === 'landing' ? 'Ver dashboard' : 'Ver landing';
  try { history.replaceState(null, '', '#d' + d.n + '-' + st.v); } catch (e) {}
}
function go(n) { if (n < 0 || n >= D.length) return; st.i = n; st.ev = false; paint(); }
document.addEventListener('click', function (e) {
  var t = e.target.closest('button'); if (!t) return;
  if (t.dataset.ev) { st.ev = true; paint(); }
  else if (t.dataset.i != null) go(+t.dataset.i);
  else if (t.closest('#vs')) { st.v = t.dataset.v; paint(); }
  else if (t.closest('#ws')) { st.w = t.dataset.w; paint(false); }
});
function fsOn() { document.body.classList.add('fs'); $('fsBar').hidden = false; try { var p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
function fsOff() { document.body.classList.remove('fs'); $('fsBar').hidden = true; try { if (document.fullscreenElement) document.exitFullscreen().catch(function () {}); } catch (e) {} }
$('fsBtn').onclick = fsOn; $('fsOut').onclick = fsOff;
$('fsPrev').onclick = function () { go(st.i - 1); }; $('fsNext').onclick = function () { go(st.i + 1); };
$('fsV').onclick = function () { st.v = st.v === 'landing' ? 'dashboard' : 'landing'; paint(); };
document.addEventListener('fullscreenchange', function () { if (!document.fullscreenElement && document.body.classList.contains('fs')) fsOff(); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight') go(st.i + 1); if (e.key === 'ArrowLeft') go(st.i - 1);
  if (e.key === 'f' || e.key === 'F') { document.body.classList.contains('fs') ? fsOff() : fsOn(); }
  if (e.key === 'Escape') fsOff();
});

function pillE(n) { var k = Math.max(1, Math.min(5, Math.round(n))); return '<span class="pill p' + k + '">' + (Math.round(n * 10) / 10) + '</span>'; }
function lst(a) { return (a && a.length) ? '<ul>' + a.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '<span class="note">—</span>'; }
function renderEval() {
  var el = $('ev');
  if (!EVAL) { el.innerHTML = '<div class="card"><h2>Evaluación estratégica</h2><p class="lead">Este panel se completa automáticamente a las 5:00 (hora de Buenos Aires) con el análisis del PDF del enunciado: matriz comparativa, puntajes ponderados, análisis por propuesta y recomendación. Cuando termine, recargá esta página.</p></div>'; return; }
  var E = EVAL, cols = E.columnas || [], crit = (E.puntajes && E.puntajes.criterios) || [];
  if (!W) { W = {}; crit.forEach(function (c) { W[c.id] = c.peso; }); }
  var h = '<div><h2>Evaluación estratégica de las propuestas</h2><p class="lead">Generada: ' + esc(E.generado || '') + '. ' + esc(E.fuentes || '') + '</p></div>';
  h += '<div class="card"><h3>Resumen en 1 minuto</h3><ul class="big">' + (E.resumenEjecutivo || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
  var r = E.recomendacion || {};
  h += '<div class="card rec"><h3>Recomendación</h3><dl><dt>Dirección</dt><dd>' + esc(r.direccion) + '</dd><dt>Landing</dt><dd>' + esc(r.landing) + '</dd><dt>Dashboard</dt><dd>' + esc(r.dashboard) + '</dd><dt>Combinar</dt><dd>' + lst(r.combinar) + '</dd><dt>Por qué</dt><dd>' + esc(r.porQue) + '</dd></dl></div>';
  h += '<div class="card"><h3>Puntaje ponderado (ajustá los pesos)</h3><p class="note">El puntaje es una herramienta de razonamiento comparativo, no una métrica objetiva. Cambiá los pesos según qué te importa más.</p><div class="wts" id="wts">' +
    crit.map(function (c) { return '<label>' + esc(c.nombre) + ': <b id="wv-' + c.id + '">' + W[c.id] + '</b>%<input type="range" min="0" max="50" step="5" value="' + W[c.id] + '" data-w="' + c.id + '"></label>'; }).join('') + '</div><div class="rank" id="rank" style="margin-top:12px"></div></div>';
  h += '<div class="card"><h3>Puntajes por criterio (1 a 5)</h3><div class="tw"><table><thead><tr><th>Criterio</th>' + cols.map(function (c) { return '<th>' + esc(c.nombre) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    crit.map(function (c) { return '<tr><td>' + esc(c.nombre) + '</td>' + cols.map(function (k) { var v = ((E.puntajes.valores || {})[k.id] || {})[c.id] || {}; return '<td>' + (v.p != null ? pillE(v.p) : '—') + '<div class="note">' + esc(v.j) + '</div></td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div></div>';
  h += '<div class="card"><h3>Matriz comparativa</h3><div class="tw"><table><thead><tr><th>Dimensión</th>' + cols.map(function (c) { return '<th>' + esc(c.nombre) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    (E.matriz || []).map(function (m) { return '<tr><td>' + esc(m.dimension) + '</td>' + cols.map(function (k) { var v = (m.valores || {})[k.id]; return '<td>' + (Array.isArray(v) ? lst(v) : esc(v)) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div></div>';
  h += '<div class="card"><h3>Conclusiones</h3><dl class="qa">' + (E.conclusiones || []).map(function (q) { return '<dt>' + esc(q.pregunta) + '</dt><dd>' + esc(q.respuesta) + '</dd>'; }).join('') + '</dl></div>';
  h += '<div class="card"><h3>Análisis individual</h3>' + cols.map(function (c) { var a = (E.analisis || {})[c.id] || {};
    return '<details><summary>' + esc(c.nombre) + '</summary><dl>' + [['personalidad','Personalidad y tono'],['publico','Público'],['coherencia','Coherencia con Donatrack'],['institucional','Comunicación institucional'],['paleta','Paleta cromática']].map(function (k) { return '<dt>' + k[1] + '</dt><dd>' + esc(a[k[0]]) + '</dd>'; }).join('') +
      '<dt>Ventajas</dt><dd>' + lst(a.ventajas) + '</dd><dt>Desventajas</dt><dd>' + lst(a.desventajas) + '</dd><dt>Riesgos</dt><dd>' + lst(a.riesgos) + '</dd><dt>Oportunidades</dt><dd>' + lst(a.oportunidades) + '</dd><dt>Conservar</dt><dd>' + lst(a.conservar) + '</dd></dl></details>'; }).join('') + '</div>';
  var en = E.enunciado || {};
  h += '<div class="card"><h3>Qué dice el enunciado</h3><p style="margin:0 0 6px">' + esc(en.resumen) + '</p>' + lst(en.criteriosClave) + '</div>';
  h += '<div class="card"><h3>Incertidumbres</h3>' + lst(E.incertidumbres) + '</div>';
  el.innerHTML = h;
  drawRank();
}
function drawRank() {
  var E = EVAL, cols = E.columnas || [], crit = E.puntajes.criterios, tot = 0;
  crit.forEach(function (c) { tot += W[c.id]; });
  var rows = cols.map(function (k) { var s = 0; crit.forEach(function (c) { var v = ((E.puntajes.valores[k.id] || {})[c.id] || {}).p || 0; s += v * W[c.id]; }); return {n: k.nombre, v: tot ? s / tot : 0}; }).sort(function (a, b) { return b.v - a.v; });
  $('rank').innerHTML = rows.map(function (r) { return '<div class="rk"><span>' + esc(r.n) + '</span><div class="bar"><i style="width:' + (r.v / 5 * 100) + '%"></i></div><b>' + r.v.toFixed(2) + '</b></div>'; }).join('') + (tot ? '' : '<p class="note">Todos los pesos están en 0.</p>');
}
document.addEventListener('input', function (e) { var id = e.target && e.target.dataset && e.target.dataset.w; if (!id) return; W[id] = +e.target.value; $('wv-' + id).textContent = W[id]; drawRank(); });

try { if (location.hash === '#evaluacion') st.ev = true; var m = location.hash.match(/^#d([1-6])-(landing|dashboard)$/); if (m) { st.i = +m[1] - 1; st.v = m[2]; } } catch (e) {}
paint();
