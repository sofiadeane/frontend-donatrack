ora como tinta y superficie de contraste (dock, bloques oscuros, CTA). El siena aparece en bloques grandes con texto oscuro #2A2526, cerca del contraste mínimo: revisar antes de usarlo en cuerpo de texto. El óxido #943D2C queda como acento; 'Entrega fallida' usa su tinte suave.", "nota": "La paleta no tiene verde: 'Entregada' va en dorado. 'En depósito' (oro suave) y 'Entregada' (oro) son vecinos: se distinguen por intensidad y por el texto."}, "tipografia": {"titulos y cifras": "Baloo 2 800 (fallback Arial Rounded MT Bold, Nunito, system-ui)", "texto": "Nunito 500-900", "escala": "cifras 46-60 px, h1 hasta 76 px (landing) y 60 px (dashboard), cuerpo 16-19 px, apoyo 13 px"}, "espaciado": "Base de 4 px; separación entre bloques 16 px (landing) y 20 px (dashboard); padding de bloque 24-42 px; gutter 24 px (16 px en móvil).", "radios": "Bloque 28 px, bloque grande/hoja/foco 40 px, fila o tarjeta chica 22 px, píldoras y botones 999 px.", "bordes/sombras": "Superficies planas sin bordes; ring de 2 px solo en botón secundario y chips. Sombra suave únicamente en elementos flotantes (nav, dock, hoja)."}, "componentes": [{"nombre": "Bloque", "uso": "Contenedor base de color con radio 28; unidad del mosaico de la landing y de las tarjetas del dashboard."}, {"nombre": "Cifra", "uso": "Número grande en Baloo con etiqueta y variación en píldora."}, {"nombre": "Cápsula segmentada", "uso": "Progreso y proporciones (donantes 52/26/8, circulación 18/11/7/9, impacto por categoría); en circulación además filtra el inventario."}, {"nombre": "Tag de estado", "uso": "Píldora con punto y texto para los siete estados reales."}, {"nombre": "Botón / chip", "uso": "Primario ink, secundario con ring, chip filtro con aria-pressed."}, {"nombre": "Parada de recorrido", "uso": "Círculo con ícono; en landing son cinco paradas tocables, en dashboard la ruta de un camión con paradas y carga."}, {"nombre": "Tarjeta de foco", "uso": "Una tarea urgente con acción (Resolver) y Después; la cola lateral muestra el resto."}, {"nombre": "Dock de cápsulas", "uso": "Navegación inferior: en el dashboard cuatro vistas más Más; en la landing móvil las secciones."}, {"nombre": "Hoja", "uso": "Bottom sheet en móvil y modal centrado en escritorio (Más, Registrar donación)."}, {"nombre": "Toast", "uso": "Confirma 'Actualizando…' y luego el resultado (demo)."}], "patrones": ["Landing: mosaico asimétrico de 12 columnas, secciones como bloques, nav flotante en píldora (escritorio) o dock (móvil).", "Dashboard: vistas por pestaña de dock, cola de turno, circulación como cápsula filtrable.", "Escritorio del dashboard: foco 7/12 + cola 5/12, tira oscura de circulación, grilla de 4 columnas de donaciones; inventario 8/12 con panel lateral; atajos R (resolver) y D (después).", "Acción asíncrona: botón deshabilitado con 'Actualizando…' durante ~0,8 s y luego estado nuevo."], "tono": "Cercano, en voseo, optimista y concreto. Acompaña sin dramatizar: los pendientes son tareas, no alarmas.", "copyEjemplos": {"landingHeadline": "Cada donación llega. Y se nota.", "landingCta": "Seguir una donación", "dashboardSaludo": "Hoy te toca atender 5 cosas.", "dashboardVacio": "Todo al día. Buen turno.", "accion": "Ejecutar asignación · Confirmar chofer · Avisar a la entidad · Marcar vencida", "asincrono": "Actualizando… → Resuelto (demo)", "proximamente": "Vas a poder ver dónde llega cada aporte"}, "estados": {"EN_DEPOSITO": "Tag oro suave con texto 'En depósito'", "ASIGNACION_REALIZADA": "Tag bone con texto 'Asignada'", "LISTA_PARA_ENTREGAR": "Tag gris cálido con texto 'Lista para entregar'", "EN_TRASLADO": "Tag siena con texto 'En traslado'", "ENTREGADA": "Tag oro con texto 'Entregada'", "ENTREGA_FALLIDA": "Tag óxido suave con texto 'Entrega fallida'", "VENCIDA": "Tag taupe con texto 'Vencida'"}, "accesibilidad": "Foco visible de 3 px (blanco sobre fondos oscuros); estados siempre con texto y punto; texto de estado en tonos oscuros sobre pastel; aria-pressed/aria-current/aria-live en chips, pasos y mensajes; hojas con Esc, velo y retorno de foco; prefers-reduced-motion desactiva transiciones. Pendiente: contraste medido formalmente y foco atrapado dentro de las hojas.", "paraExtender": "Falta llevar el sistema a donante (mis donaciones con historial de estados, misiones, insignias, notificaciones), entidad (necesidades con cobertura y Confirmar recepción), formularios completos de registro (humana, jurídica, entidad) y login demo por rol; reutilizan bloque, cápsula, tag, foco, dock y hoja. Las pantallas Donantes, Entidades y Rankings del dashboard están resumidas."}, "notas": "# Encastre: notas\n- Híbrido: landing = Bloques (mosaico, cápsula de 5 paradas, roles, galería); dashboard = Bolsillo (4 vistas, hoja Más, foco con Resolver/Después, dock).\n- Un solo CSS compartido (build en scratchpad/build-d2/: shared.css + build.py) inyectado inline en ambos archivos.\n- Escritorio del dashboard: grilla 12 columnas, foco + cola, tira de circulación filtrable, atajos R/D. El foco sigue siendo de a una tarea.\n- Parámetros: dashboard.html?vista=atender|ruta|deposito|impacto|asig|donantes|entidades|rank y &abrir=mas|reg.\n- Pendiente: Donantes/Entidades/Rankings resumidos; \"Camión 3\" usa paradas genéricas (el brief no da nombres); propuestas de asignación y normalización son ejemplos; la hoja no atrapa el foco; sin test en lector de pantalla.\n"}, {"n": 3, "nombre": "Tratado de la máquina", "resumen": "Trazo · máquina grabada en tinta, láminas numeradas y plano de planta con válvulas.", "landing": "<!doctype html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>DonaTrack · Tratado de la máquina<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--papel:#EFE5CA;--papel2:#E6DAB9;--tinta:#2A2822;--tinta2:#5A5546;--naranja:#C4501B;--naranja2:#F29A62;--linea:#2A2822;\n--cond:\"Barlow Condensed\",\"Arial Narrow\",\"Roboto Condensed\",sans-serif;--texto:\"Barlow\",\"Segoe UI\",system-ui,sans-serif;--mono:\"IBM Plex Mono\",ui-monospace,Menlo,Consolas,monospace}\n*{box-sizing:border-box;margin:0}\nhtml{scroll-behavior:smooth}\nbody{background:var(--papel);color:var(--tinta);font-family:var(--texto);font-size:17px;line-height:1.55;overflow-x:hidden;background-image:radial-gradient(rgba(42,40,34,.07) 1px,transparent 1px);background-size:6px 6px}\na{color:inherit}\nbutton{font:inherit}\n:focus-visible{outline:3px solid var(--naranja);outline-offset:3px}\n.dk :focus-visible{outline-color:var(--naranja2)}\n.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}\naside{position:sticky;top:0;height:100vh;border-right:1.5px solid var(--linea);padding:22px 18px;display:flex;flex-direction:column;gap:16px;background:var(--papel2);overflow-y:auto}\n.brand{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.04em;text-transform:uppercase;display:flex;gap:10px;align-items:center;text-decoration:none}\n.brand small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;font-weight:400;color:var(--tinta2)}\naside ol{list-style:none;padding:0;display:grid;gap:1px}\naside ol a{display:grid;grid-template-columns:36px 1fr;font-family:var(--cond);font-weight:500;font-size:18px;text-transform:uppercase;letter-spacing:.03em;text-decoration:none;padding:3px 8px;border-left:3px solid transparent;color:var(--tinta2)}\naside ol a span{font-family:var(--mono);font-size:11px;padding-top:5px}\naside ol a:hover{color:var(--tinta)}\naside ol a.on{border-left-color:var(--naranja);color:var(--tinta);background:rgba(196,80,27,.12)}\n.pub{margin-top:auto;display:grid;gap:6px;font-family:var(--mono);font-size:12px}\n.pub a{border:1.5px solid var(--linea);padding:5px 10px;text-decoration:none;text-align:center}\n.pub a:hover{background:var(--tinta);color:var(--papel)}\n.pub a.pri{background:var(--naranja);color:#fff;border-color:var(--naranja)}\nmain{padding:0 clamp(16px,3.4vw,52px) 40px;max-width:1240px;min-width:0}\nsection{padding:60px 0 34px;border-bottom:1.5px solid var(--linea);position:relative}\nsection:after{content:\"\";position:absolute;left:0;right:0;bottom:-6px;border-bottom:1px solid var(--linea)}\n.rot{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--naranja);margin-bottom:8px;display:flex;gap:12px;align-items:center}\n.rot:after{content:\"\";flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--tinta) 0 6px,transparent 6px 10px);opacity:.5}\nh1,h2,h3{font-family:var(--cond);font-weight:600;text-transform:uppercase;line-height:.98;letter-spacing:.01em}\nh1{font-size:clamp(48px,7.6vw,104px);margin-bottom:18px}\nh1 em{font-style:normal;color:var(--naranja);background:linear-gradient(transparent 82%,rgba(196,80,27,.22) 0)}\nh2{font-size:clamp(36px,4.6vw,58px);margin-bottom:14px}\nh3{font-size:25px;margin-bottom:4px}\n.lead{font-size:clamp(17px,1.5vw,20px);max-width:38em;color:var(--tinta2)}\n.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}\n.btn{font-family:var(--mono);font-size:14px;text-decoration:none;border:1.5px solid var(--linea);padding:10px 18px;background:var(--papel);cursor:pointer;color:var(--tinta);box-shadow:3px 3px 0 var(--linea);display:inline-block}\n.btn.pri{background:var(--naranja);color:#fff}\n.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--linea)}\n.dk .btn{box-shadow:3px 3px 0 var(--naranja2);border-color:var(--papel)}\n/* secciones con nota al margen */\n.sec{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:0 30px}\n.marg{font-family:var(--mono);font-size:11.5px;color:var(--tinta2);border-left:1px dotted var(--tinta);padding-left:12px;align-self:start;margin-top:26px;line-height:1.5}\n.marg b{display:block;color:var(--naranja);font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}\n.marg+.marg{margin-top:18px}\n.plate{border:1.5px solid var(--linea);padding:8px;margin-top:26px;background:rgba(255,255,255,.2);position:relative}\n.plate>.in{border:1px solid var(--linea);padding:12px;position:relative}\n.plate>.in:before,.plate>.in:after{content:\"\";position:absolute;width:16px;height:16px;border:2px solid var(--naranja);pointer-events:none}\n.plate>.in:before{left:-7px;top:-7px;border-right:0;border-bottom:0}\n.plate>.in:after{right:-7px;bottom:-7px;border-left:0;border-top:0}\n.dk{background:var(--tinta);color:var(--papel);background-image:repeating-linear-gradient(135deg,rgba(239,229,202,.05) 0 1px,transparent 1px 7px)}\n.dk.plate,.dk.plate>.in{border-color:var(--tinta)}\n.dk.plate>.in{border-color:var(--papel)}\n.plate svg{display:block;width:100%;height:auto}\n.cap{font-family:var(--mono);font-size:12px;color:var(--tinta2);display:flex;justify-content:space-between;gap:10px;padding:8px 2px 0;flex-wrap:wrap}\n.dk .cap{color:#CFC4A6}\n/* piezas */\n.parts{display:grid;grid-template-columns:repeat(2,1fr);margin-top:24px;border:1.5px solid var(--linea);background:rgba(255,255,255,.18)}\n.part{padding:20px;display:grid;grid-template-columns:92px 1fr;gap:16px;border-bottom:1.5px solid var(--linea);position:relative}\n.part:nth-child(odd){border-right:1.5px solid var(--linea)}\n.part:nth-last-child(-n+2){border-bottom:0}\n.part svg{width:92px;height:92px}\n.part p{font-size:15.5px}\n.part code{font-family:var(--mono);font-size:11.5px;color:var(--naranja);display:block;margin-top:6px}\n.part .n{position:absolute;right:12px;top:8px;font-family:var(--mono);font-size:11px;color:var(--tinta2)}\n/* problema */\n.prob{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:22px;border:1.5px solid var(--linea)}\n.prob>div{padding:20px}\n.prob>div:first-child{border-right:1.5px solid var(--linea);background:repeating-linear-gradient(135deg,rgba(42,40,34,.07) 0 1px,transparent 1px 8px)}\n.prob h3{margin-bottom:8px}\n.prob ul{list-style:none;padding:0;font-size:16px}\n.prob li{padding:6px 0 6px 28px;position:relative;border-bottom:1px dotted var(--tinta2)}\n.prob li:before{position:absolute;left:0;top:6px;font-family:var(--mono);color:var(--naranja);content:\"×\"}\n.prob>div+div li:before{content:\"✓\";color:var(--tinta)}\n/* circuito */\n.circ svg text{font-family:var(--mono);font-size:12px;fill:var(--papel)}\n.node{cursor:pointer}\n.node circle{fill:var(--tinta);stroke:var(--papel);stroke-width:2.5}\n.node.on circle{fill:var(--naranja)}\n.node:focus-visible circle{stroke:var(--naranja2);stroke-width:5}\n.info{border:1.5px solid var(--papel);padding:14px 16px;margin-top:14px;min-height:100px;background:rgba(239,229,202,.08);font-size:16px}\n.info b{font-family:var(--cond);font-size:26px;text-transform:uppercase;display:block;font-weight:600;color:var(--naranja2)}\n.tbl{display:grid;grid-template-columns:repeat(7,1fr);gap:0;margin-top:22px;border:1.5px solid var(--linea)}\n.tbl div{padding:10px 8px;border-right:1px solid var(--linea);font-size:14px;line-height:1.3}\n.tbl div:last-child{border-right:0}\n.tbl b{display:block;font-family:var(--cond);font-size:19px;text-transform:uppercase;font-weight:600}\n.tbl code{font-family:var(--mono);font-size:10.5px;color:var(--tinta2);word-break:break-all;display:block;margin-top:3px}\n.tbl div.d{background:repeating-linear-gradient(135deg,rgba(196,80,27,.18) 0 2px,transparent 2px 7px)}\n/* operarios */\n.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:22px}\n.role{border:1.5px solid var(--linea);padding:18px;text-align:center;font-size:15.5px;background:rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center}\n.role svg{width:150px;height:150px;margin-bottom:6px}\n.role small{font-family:var(--mono);font-size:11px;color:var(--naranja);letter-spacing:.08em;text-transform:uppercase}\n/* contadores */\n.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px}\n.cnt{border:1.5px solid var(--linea);padding:14px 10px;text-align:center;background:rgba(255,255,255,.25);min-width:0}\n.odo{display:flex;gap:3px;justify-content:center;margin-bottom:8px}\n.odo i{font-family:var(--mono);font-style:normal;font-weight:500;font-size:clamp(22px,2.6vw,34px);background:var(--tinta);color:var(--papel);width:1.05em;text-align:center;border-radius:2px;line-height:1.4;box-shadow:inset 0 -6px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}\n.odo i.dot{background:none;color:var(--tinta);width:.35em;box-shadow:none}\n.cnt small{font-family:var(--cond);font-weight:500;font-size:19px;text-transform:uppercase;line-height:1.1;display:block}\n.cats{font-family:var(--mono);font-size:13px;margin-top:16px;display:flex;gap:10px 16px;flex-wrap:wrap}\n.cats span{border:1.5px solid var(--linea);padding:1px 10px}\n.demo{font-family:var(--mono);font-size:12px;border:1.5px dashed var(--tinta);padding:1px 8px;display:inline-block;margin-top:14px}\n.dk .demo{border-color:var(--naranja2);color:var(--naranja2)}\n/* galería */\n.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}\n.chip{font-family:var(--mono);font-size:13px;border:1.5px solid var(--linea);background:var(--papel);padding:4px 12px;cursor:pointer;color:var(--tinta)}\n.chip[aria-pressed=true]{background:var(--tinta);color:var(--papel)}\n.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:14px}\n.gi{border:1.5px solid var(--linea);padding:6px;background:rgba(255,255,255,.22)}\n.gi>div{border:1px solid var(--linea);padding:12px;height:100%;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}\n.gi[hidden]{display:none}\n.gi svg{width:56px;height:56px}\n.gi h3{font-size:22px;margin:0}\n.gi p{font-family:var(--mono);font-size:11.5px;color:var(--tinta2)}\n.gi .tag{font-family:var(--mono);font-size:11px;border:1.5px solid var(--linea);padding:0 6px;display:inline-block;margin-top:4px}\n/* atlas */\n.atlas{position:relative}\n.stamp{position:absolute;right:18px;top:18px;font-family:var(--cond);font-weight:700;font-size:28px;text-transform:uppercase;color:var(--naranja);border:3px solid var(--naranja);padding:0 12px;transform:rotate(6deg);background:var(--papel);z-index:2}\n.priv{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}\n.priv div{border:1.5px solid var(--linea);padding:16px;font-size:16px}\n.priv h3{font-size:22px}\nfooter{padding:30px 0 0;font-family:var(--mono);font-size:12px;color:var(--tinta2);display:flex;gap:18px;flex-wrap:wrap}\n@media(max-width:1180px){.sec{grid-template-columns:minmax(0,1fr)}.marg{margin-top:16px;border-left:2px solid var(--naranja)}}\n@media(max-width:900px){\n .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;align-content:start}\n aside{position:sticky;height:auto;z-index:5;flex-direction:row;align-items:center;padding:8px 12px;border-right:0;border-bottom:1.5px solid var(--linea);overflow-x:auto;overflow-y:hidden;gap:12px}\n .brand small,.pub{display:none}.brand span{display:none}\n aside ol{display:flex;gap:4px}\n aside ol a{grid-template-columns:auto;white-space:nowrap;font-size:16px;border-left:0;border-bottom:3px solid transparent;padding:2px 8px}\n aside ol a span{display:none}\n aside ol a.on{border-bottom-color:var(--naranja)}\n .parts,.roles,.prob,.priv{grid-template-columns:1fr}\n .counters{grid-template-columns:repeat(2,1fr)}\n .gal{grid-template-columns:1fr 1fr}\n .part:nth-child(odd){border-right:0}.part:nth-last-child(-n+2){border-bottom:1.5px solid var(--linea)}.part:last-child{border-bottom:0}\n .prob>div:first-child{border-right:0;border-bottom:1.5px solid var(--linea)}\n .tbl{grid-template-columns:1fr 1fr}.tbl div{border-bottom:1px solid var(--linea)}\n section{padding-top:36px}\n .stamp{font-size:22px;right:8px;top:8px}\n}\n@media(max-width:700px){.circ svg text{font-size:21px}.circ .node text{font-size:21px}}\n@media(max-width:560px){.gal{grid-template-columns:1fr}.part{grid-template-columns:70px 1fr}.part svg{width:70px;height:70px}.btn{padding:10px 14px}}\n@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}\n@keyframes spin{to{transform:rotate(360deg)}}\n.g1{transform-origin:178px 150px;animation:spin 24s linear infinite}.g2{transform-origin:236px 118px;animation:spin 24s linear infinite reverse}\n<\/style>\n<\/head>\n<body>\n<div class=\"shell\">\n<aside aria-label=\"Índice del tratado\">\n <a class=\"brand\" href=\"#s1\"><svg width=\"34\" height=\"34\" viewBox=\"0 0 34 34\" aria-hidden=\"true\"><circle cx=\"17\" cy=\"17\" r=\"12\" fill=\"none\" stroke=\"#2A2822\" stroke-width=\"7\" stroke-dasharray=\"4 3.2\"/><circle cx=\"17\" cy=\"17\" r=\"8\" fill=\"#EFE5CA\" stroke=\"#2A2822\" stroke-width=\"1.5\"/><circle cx=\"17\" cy=\"17\" r=\"3\" fill=\"#C4501B\"/><\/svg><span>DonaTrack<small>TRATADO DE TRAZABILIDAD<\/small><\/span><\/a>\n <ol id=\"idx\">\n  <li><a href=\"#s1\"><span>I<\/span>Principio<\/a><\/li>\n  <li><a href=\"#s2\"><span>II<\/span>El problema<\/a><\/li>\n  <li><a href=\"#s3\"><span>III<\/span>Las piezas<\/a><\/li>\n  <li><a href=\"#s4\"><span>IV<\/span>El circuito<\/a><\/li>\n  <li><a href=\"#s5\"><span>V<\/span>Los operarios<\/a><\/li>\n  <li><a href=\"#s6\"><span>VI<\/span>Registro público<\/a><\/li>\n  <li><a href=\"#s7\"><span>VII<\/span>Entregas<\/a><\/li>\n  <li><a href=\"#s8\"><span>VIII<\/span>Atlas<\/a><\/li>\n  <li><a href=\"#s9\"><span>IX<\/span>Privacidad<\/a><\/li>\n  <li><a href=\"#s10\"><span>X<\/span>Entrada<\/a><\/li>\n <\/ol>\n <div class=\"pub\"><a href=\"#s7\">Galería de entregas<\/a><a href=\"#s9\">Privacidad<\/a><a href=\"#s10\">Ingresar<\/a><a class=\"pri\" href=\"#s10\">Registrarme<\/a><\/div>\n<\/aside>\n\n<main>\n<section id=\"s1\" style=\"padding-top:44px\">\n <div class=\"rot\">Lámina I · Principio de funcionamiento<\/div>\n <h1>Una máquina de precisión para que <em>ninguna donación se pierda.<\/em><\/h1>\n <p class=\"lead\">DonaTrack registra, asigna, traslada y confirma cada donación, y deja constancia de cada paso con fecha y responsable.<\/p>\n <div class=\"btns\"><a class=\"btn pri\" href=\"#s4\">Ver la máquina en marcha<\/a><a class=\"btn\" href=\"#s10\">Ingresar<\/a><\/div>\n <div class=\"sec\"><div>\n <div class=\"plate dk\"><div class=\"in\">\n  <svg viewBox=\"0 0 820 340\" role=\"img\" aria-label=\"Grabado de una máquina: tolva de entrada, engranajes, tuberías y un camión de salida\">\n   <defs><pattern id=\"ha\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><path d=\"M0 0v6\" stroke=\"#EFE5CA\" stroke-width=\"1\" opacity=\".55\"/><\/pattern><\/defs>\n   <g fill=\"none\" stroke=\"#EFE5CA\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n    <path d=\"M40 40h120l-24 70H64z\" fill=\"url(#ha)\"/><path d=\"M52 60h96M58 80h84\" stroke-width=\"1\" stroke=\"#2A2822\"/>\n    <path d=\"M100 110v34h78\"/><path d=\"M110 110v24h58\" stroke-width=\"1\"/>\n    <rect x=\"260\" y=\"90\" width=\"150\" height=\"120\" rx=\"4\"/><rect x=\"270\" y=\"100\" width=\"130\" height=\"100\" rx=\"2\" stroke-width=\"1\"/>\n    <path d=\"M275 125h120M275 140h120M275 155h90M275 170h60\" stroke-width=\".8\"/>\n    <circle cx=\"178\" cy=\"150\" r=\"34\" stroke-width=\"9\" stroke-dasharray=\"7 7.3\" class=\"g1\"/><circle cx=\"178\" cy=\"150\" r=\"26\"/><circle cx=\"178\" cy=\"150\" r=\"9\" fill=\"#2A2822\"/><circle cx=\"178\" cy=\"150\" r=\"3\" fill=\"#C4501B\" stroke=\"none\"/>\n    <circle cx=\"236\" cy=\"118\" r=\"22\" stroke-width=\"7\" stroke-dasharray=\"5 5.2\" class=\"g2\"/><circle cx=\"236\" cy=\"118\" r=\"16\"/><circle cx=\"236\" cy=\"118\" r=\"5\" fill=\"#2A2822\"/>\n    <path d=\"M410 150h70q16 0 16 16v90h110\"/><path d=\"M410 164h60q4 0 4 8v96h130\" stroke-width=\"1\"/>\n    <circle cx=\"496\" cy=\"166\" r=\"9\" fill=\"#2A2822\"/><circle cx=\"496\" cy=\"256\" r=\"9\" fill=\"#2A2822\"/>\n    <path d=\"M60 300h720\" stroke-width=\"1.5\"/><path d=\"M40 312h760M80 322h700\" stroke-width=\".8\"/>\n    <path d=\"M610 190h110l30 36v44H610z\" fill=\"url(#ha)\"/><path d=\"M720 190v36h30\"/><rect x=\"630\" y=\"204\" width=\"68\" height=\"34\" stroke-width=\"1\" fill=\"#2A2822\"/>\n    <circle cx=\"650\" cy=\"276\" r=\"18\" fill=\"#2A2822\"/><circle cx=\"650\" cy=\"276\" r=\"7\"/><circle cx=\"730\" cy=\"276\" r=\"18\" fill=\"#2A2822\"/><circle cx=\"730\" cy=\"276\" r=\"7\"/>\n    <rect x=\"590\" y=\"214\" width=\"30\" height=\"30\" stroke-width=\"1.5\" fill=\"#2A2822\"/><path d=\"M590 214l30 30M620 214l-30 30\" stroke-width=\".8\"/>\n   <\/g>\n   <path d=\"M100 126v8M140 150h-6M262 258l60 0\" stroke=\"#F29A62\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n   <path d=\"M640 238h48v14h-48z\" fill=\"#C4501B\"/>\n   <g font-family=\"IBM Plex Mono,monospace\" font-size=\"11\" fill=\"#EFE5CA\"><text x=\"52\" y=\"28\">A · entrada<\/text><text x=\"150\" y=\"206\">B · asignación<\/text><text x=\"300\" y=\"82\">C · registro de estados<\/text><text x=\"560\" y=\"180\">D · salida<\/text><text x=\"760\" y=\"248\">E<\/text><\/g>\n   <rect x=\"262\" y=\"212\" width=\"146\" height=\"18\" fill=\"#C4501B\"/><text x=\"270\" y=\"225\" font-family=\"IBM Plex Mono,monospace\" font-size=\"11\" fill=\"#fff\">fecha + responsable<\/text>\n  <\/svg>\n  <div class=\"cap\"><span>Fig. 1 · Esquema ilustrativo, sin escala<\/span><span>Entra una donación, sale una entrega confirmada<\/span><\/div>\n <\/div><\/div><\/div>\n <div><div class=\"marg\"><b>Nota al margen<\/b>Cada donación que entra queda registrada con qué es, cuánta hay, cuándo vence y a qué categoría pertenece.<\/div><div class=\"marg\"><b>Leyenda<\/b>A entrada · B asignación · C registro · D salida · E confirmación.<\/div><\/div><\/div>\n<\/section>\n\n<section id=\"s2\">\n <div class=\"rot\">Lámina II · El problema<\/div>\n <h2>Donar es fácil. Saber adónde fue, no.<\/h2>\n <p class=\"lead\">Sin un mecanismo, una donación puede quedarse días en el depósito, vencerse o llegar a quien no la necesita, y nadie puede decir en qué paso está.<\/p>\n <div class=\"prob\">\n  <div><h3>Sin mecanismo<\/h3><ul><li>No se sabe en qué estado está cada donación.<\/li><li>Lo que vence se descubre tarde.<\/li><li>Las necesidades de las entidades y lo que se dona no se encuentran.<\/li><li>Nadie deja constancia de quién hizo qué.<\/li><\/ul><\/div>\n  <div><h3>Con DonaTrack<\/h3><ul><li>Siete estados definidos, de En depósito a Entregada.<\/li><li>Alertas de vencimiento y de donaciones sin asignar.<\/li><li>Asignación propuesta por algoritmos y revisada por la administración.<\/li><li>Cada cambio queda con fecha y responsable.<\/li><\/ul><\/div>\n <\/div>\n<\/section>\n\n<section id=\"s3\">\n <div class=\"rot\">Lámina III · Las piezas<\/div>\n <h2>Cuatro mecanismos, ningún eslabón suelto.<\/h2>\n <p class=\"lead\">Cada pieza hace una sola cosa y deja registro de lo que hizo.<\/p>\n <div class=\"parts\">\n  <div class=\"part\"><span class=\"n\">pieza 1<\/span><svg viewBox=\"0 0 84 84\" fill=\"none\" stroke=\"#2A2822\" stroke-width=\"2\" aria-hidden=\"true\"><rect x=\"16\" y=\"12\" width=\"52\" height=\"62\" rx=\"3\"/><rect x=\"30\" y=\"6\" width=\"24\" height=\"12\" fill=\"#EFE5CA\"/><path d=\"M26 34h32M26 44h32M26 54h20\" stroke-width=\"1.5\"/><circle cx=\"56\" cy=\"58\" r=\"8\" stroke=\"#C4501B\"/><\/svg><div><h3>Registro<\/h3><p>La administración anota qué es, cuánta hay, cuándo vence y a qué categoría pertenece.<\/p><code>EN_DEPOSITO<\/code><\/div><\/div>\n  <div class=\"part\"><span class=\"n\">pieza 2<\/span><svg viewBox=\"0 0 84 84\" fill=\"none\" stroke=\"#2A2822\" stroke-width=\"2\" aria-hidden=\"true\"><circle cx=\"30\" cy=\"42\" r=\"18\" stroke-width=\"7\" stroke-dasharray=\"4 3.8\"/><circle cx=\"30\" cy=\"42\" r=\"12\"/><circle cx=\"58\" cy=\"30\" r=\"12\" stroke-width=\"5\" stroke-dasharray=\"3 3.6\"/><circle cx=\"58\" cy=\"30\" r=\"8\"/><circle cx=\"30\" cy=\"42\" r=\"3\" stroke=\"#C4501B\"/><\/svg><div><h3>Asignación<\/h3><p>Los algoritmos proponen un destino para cada donación. La administración revisa, aprueba o descarta.<\/p><code>ASIGNACION_REALIZADA<\/code><\/div><\/div>\n  <div class=\"part\"><span class=\"n\">pieza 3<\/span><svg viewBox=\"0 0 84 84\" fill=\"none\" stroke=\"#2A2822\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M6 24h42v34H6zM48 34h18l10 12v12H48z\"/><circle cx=\"20\" cy=\"62\" r=\"7\" fill=\"#EFE5CA\"/><circle cx=\"62\" cy=\"62\" r=\"7\" fill=\"#EFE5CA\"/><path d=\"M14 34h28\" stroke=\"#C4501B\"/><\/svg><div><h3>Traslado<\/h3><p>Se carga el camión y sale por una ruta con paradas.<\/p><code>LISTA_PARA_ENTREGAR · EN_TRASLADO<\/code><\/div><\/div>\n  <div class=\"part\"><span class=\"n\">pieza 4<\/span><svg viewBox=\"0 0 84 84\" fill=\"none\" stroke=\"#2A2822\" stroke-width=\"2\" aria-hidden=\"true\"><circle cx=\"42\" cy=\"42\" r=\"28\"/><circle cx=\"42\" cy=\"42\" r=\"22\" stroke-width=\"1\"/><path d=\"M30 42l9 9 16-18\" stroke=\"#C4501B\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><div><h3>Confirmación<\/h3><p>La entidad confirma la recepción. Recién ahí la donación pasa a Entregada y suma al impacto.<\/p><code>ENTREGADA<\/code><\/div><\/div>\n <\/div>\n<\/section>\n\n<section id=\"s4\">\n <div class=\"rot\">Lámina IV · El circuito<\/div>\n <h2>El camino de una donación, de punta a punta.<\/h2>\n <p class=\"lead\">Tocá cada estación o poné la máquina en marcha. Las líneas punteadas son los dos desvíos: Entrega fallida y Vencida.<\/p>\n <div class=\"plate dk circ\"><div class=\"in\">\n  <svg id=\"map\" viewBox=\"0 0 800 270\" role=\"group\" aria-label=\"Circuito de estados de una donación\"><\/svg>\n  <div class=\"cap\"><span>Fig. 2 · Circuito de estados<\/span><span>Cada cambio queda con fecha y responsable<\/span><\/div>\n <\/div><\/div>\n <div class=\"info\" id=\"info\" aria-live=\"polite\" style=\"background:var(--tinta);color:var(--papel)\"><\/div>\n <div class=\"btns\" style=\"margin-top:14px\"><button class=\"btn pri\" id=\"run\" type=\"button\">Poner en marcha<\/button><\/div>\n <div class=\"tbl\" aria-label=\"Los siete estados\">\n  <div><b>En depósito<\/b><code>EN_DEPOSITO<\/code><\/div><div><b>Asignada<\/b><code>ASIGNACION_REALIZADA<\/code><\/div><div><b>Lista para entregar<\/b><code>LISTA_PARA_ENTREGAR<\/code><\/div><div><b>En traslado<\/b><code>EN_TRASLADO<\/code><\/div><div><b>Entregada<\/b><code>ENTREGADA<\/code><\/div><div class=\"d\"><b>Entrega fallida<\/b><code>ENTREGA_FALLIDA<\/code><\/div><div class=\"d\"><b>Vencida<\/b><code>VENCIDA<\/code><\/div>\n <\/div>\n <div class=\"cap\" style=\"padding-top:8px\"><span>Tabla 1 · Los siete estados reales. Rayados: desvíos.<\/span><\/div>\n<\/section>\n\n<section id=\"s5\">\n <div class=\"rot\">Lámina V · Los operarios<\/div>\n <h2>Tres manos en la misma máquina.<\/h2>\n <div class=\"roles\">\n  <div class=\"role\"><svg viewBox=\"0 0 150 150\" fill=\"none\" stroke=\"#2A2822\" stroke-width=\"2\" role=\"img\" aria-label=\"Retrato grabado del donante\"><circle cx=\"75\" cy=\"75\" r=\"70\"/><circle cx=\"75\" cy=\"75\" r=\"64\" stroke-width=\"1\"/><circle cx=\"75\" cy=\"62\" r=\"20\"/><path d=\"M36 128c4-28 20-38 39-38s35 10 39 38M60 70c6 6 24 6 30 0M62 52h26\"/><path d=\"M48 118l8-10M58 122l8-12M92 122l-8-12M102 118l-8-10\" stroke-width=\"1\"/><\/svg><small>Operario A<\/small><h3>Donante<\/h3><p>Persona humana o jurídica. Mira el historial de estados de cada donación y sus incentivos: categoría, misiones e insignias.<\/p><\/div>\n  <div class=\"role\"><svg viewBox=\"0 0 150 150\" fill=\"none\" stroke=\"#2A2822\" stroke-width=\"2\" role=\"img\" aria-label=\"Retrato grabado de la entidad\"><circle cx=\"75\" cy=\"75\" r=\"70\"/><circle cx=\"75\" cy=\"75\" r=\"64\" stroke-width=\"1\"/><path d=\"M40 112V70l35-26 35 26v42zM62 112V88h26v24\"/><path d=\"M75 44v-14l12 4-12 4\" stroke=\"#C4501B\"/><\/svg><small>Operario B<\/small><h3>Entidad<\/h3><p>Publica sus necesidades con cobertura (por ejemplo, 18 de 30 frazadas) y confirma lo que recibe.<\/p><\/div>\n  <div class=\"role\"><svg viewBox=\"0 0 150 150\" fill=\"none\" stroke=\"#2A2822\" stroke-width=\"2\" role=\"img\" aria-label=\"Retrato grabado de la administración\"><circle cx=\"75\" cy=\"75\" r=\"70\"/><circle cx=\"75\" cy=\"75\" r=\"64\" stroke-width=\"1\"/><circle cx=\"75\" cy=\"75\" r=\"22\" stroke-width=\"9\" stroke-dasharray=\"5 4.4\"/><circle cx=\"75\" cy=\"75\" r=\"14\"/><circle cx=\"75\" cy=\"75\" r=\"4\" stroke=\"#C4501B\"/><\/svg><small>Operario C<\/small><h3>Administración del depósito<\/h3><p>Registra, revisa propuestas, arma rutas y cuida los vencimientos.<\/p><\/div>\n <\/div>\n<\/section>\n\n<section id=\"s6\">\n <div class=\"rot\">Lámina VI · Registro público<\/div>\n <h2>Los contadores de la máquina, a la vista.<\/h2>\n <div class=\"counters\" id=\"counters\">\n  <div class=\"cnt\"><div class=\"odo\" data-v=\"128\" data-d=\"4\"><\/div><small>donaciones entregadas<\/small><\/div>\n  <div class=\"cnt\"><div class=\"odo\" data-v=\"34\" data-d=\"4\"><\/div><small>entidades ayudadas<\/small><\/div>\n  <div class=\"cnt\"><div class=\"odo\" data-v=\"2448\" data-d=\"4\" data-sep=\"1\"><\/div><small>kg de alimentos distribuidos<\/small><\/div>\n  <div class=\"cnt\"><div class=\"odo\" data-v=\"86\" data-d=\"4\"><\/div><small>donantes activos<\/small><\/div>\n <\/div>\n <div class=\"cats\"><span>52 Colaboradores<\/span><span>26 Sostenedores<\/span><span>8 Transformadores<\/span><\/div>\n <span class=\"demo\">Datos de demostración<\/span>\n<\/section>\n\n<section id=\"s7\">\n <div class=\"rot\">Lámina VII · Entregas<\/div>\n <h2>Lo que la máquina ya entregó.<\/h2>\n <p class=\"lead\">Galería pública de donaciones entregadas. Filtrá por categoría.<\/p>\n <div class=\"chips\" id=\"chips\" role=\"group\" aria-label=\"Filtrar por categoría\"><\/div>\n <div class=\"gal\" id=\"gal\"><\/div>\n <span class=\"demo\">Ejemplos de demostración<\/span>\n<\/section>\n\n<section id=\"s8\">\n <div class=\"rot\">Lámina VIII · Atlas<\/div>\n <h2>Mapa de impacto.<\/h2>\n <div class= una sesión de demostración por rol.<\/p>\n <div class=\"btns\"><a class=\"btn pri\" href=\"#\">Registrarme<\/a><a class=\"btn\" href=\"#\">Ingresar<\/a><\/div>\n <footer><span>DonaTrack · proyecto académico UTN-FRBA<\/span><a href=\"#s9\">Privacidad<\/a><\/footer>\n<\/section>\n<\/main>\n<\/div>\n\n<script>\n(function(){\n var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;\n var links=[].slice.call(document.querySelectorAll('#idx a'));\n var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id)})}})},{rootMargin:'-30% 0px -60% 0px'});\n document.querySelectorAll('main section').forEach(function(s){io.observe(s)});\n /* circuito */\n var S=[['En depósito','Llega al depósito y se registra: qué es, cantidad, vencimiento y categoría.'],['Asignada','El sistema la asigna a una necesidad concreta; la administración aprueba o descarta la propuesta.'],['Lista para entregar','Queda lista y se suma a un camión con ruta y paradas.'],['En traslado','El camión está en ruta. La pantalla muestra \"Actualizando…\" hasta recibir el evento.'],['Entregada','La entidad confirmó la recepción: suma al impacto con fecha y responsable.']];\n var NS='http://www.w3.org/2000/svg',map=document.getElementById('map'),info=document.getElementById('info');\n function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);(p||map).appendChild(e);return e}\n var d='M60 120C120 120 130 60 210 60S310 120 400 120 500 60 590 60 690 120 740 120';\n el('path',{d:d,fill:'none',stroke:'#EFE5CA','stroke-width':2.5,id:'main'});\n el('path',{d:d,fill:'none',stroke:'#EFE5CA','stroke-width':1,transform:'translate(0 7)'});\n var main=document.getElementById('main'),L=main.getTotalLength(),pts=[],nodes=[];\n [0,.25,.5,.75,1].forEach(function(f){pts.push(main.getPointAtLength(f*L))});\n var p1=pts[0],p3=pts[3];\n el('path',{d:'M'+p3.x+' '+(p3.y+16)+' d var(--linea)}\n .stops li{flex-direction:row;max-width:none;text-align:left;gap:10px}\n .stops li.t{padding-left:0}\n .stops li.t svg{width:40px}\n .short button{font-size:17px;padding:8px 9px 5px}.short button i{display:none}\n form.f{grid-template-columns:1fr}\n table,tbody,tr,td{display:block}thead{display:none}\n tr{border:1.5px solid var(--linea);padding:8px 10px;margin-bottom:10px;background:rgba(255,255,255,.3)}\n td{border:0;padding:2px 0}td:first-child{font-weight:500}td:last-child{padding-top:6px}\n .log li{grid-template-columns:1fr;gap:0}\n .rk li{grid-template-columns:48px 1fr}.rk .tag{display:none}\n .crumb{display:none}\n .sel strong{font-size:30px}.sel small{font-size:17px}\n}\n@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n<\/style>\n<\/head>\n<body>\n<header class=\"bar\">\n <a class=\"brand\" href=\"#inicio\" data-go=\"inicio\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 34 34\" aria-hidden=\"true\"><circle cx=\"17\" cy=\"17\" r=\"12\" fill=\"none\" stroke=\"#EFE5CA\" stroke-width=\"7\" stroke-dasharray=\"4 3.2\"/><circle cx=\"17\" cy=\"17\" r=\"8\" fill=\"#2A2822\" stroke=\"#EFE5CA\" stroke-width=\"1.5\"/><circle cx=\"17\" cy=\"17\" r=\"3\" fill=\"#C4501B\"/><\/svg>DonaTrack<\/a>\n <span class=\"crumb\" id=\"crumb\">Administración / Depósito central / Plano de planta · sábado 31 de octubre<\/span>\n <span class=\"demo\">Datos de demostración<\/span>\n <button class=\"k\" id=\"openPal\" type=\"button\">Ir a o hacer…<kbd>Ctrl K<\/kbd><\/button>\n<\/header>\n<div class=\"ruler\" aria-hidden=\"true\"><\/div>\n<nav class=\"short\" id=\"nav\" aria-label=\"Pantallas de administración\"><\/nav>\n\n<main>\n<!-- INICIO -->\n<section class=\"view\" id=\"v-inicio\">\n <div class=\"rot\">Lámina 1 · Plano de planta<\/div>\n <h1>Todo el depósito en un solo circuito.<\/h1>\n <p class=\"sub\">45 donaciones en circulación. Las válvulas naranja marcan dónde se está trabando algo: tocalas o elegí una estación para ver el detalle.<\/p>\n\n <div class=\"plate dk\"><div class=\"in\">\n  <div class=\"lam\"><span>Fig. 1 · Esquema operativo<\/span><span>Depósito central · escala S/E<\/span><\/div>\n  <div class=\"flow\" id=\"flow\"><\/div>\n  <div class=\"branches\">\n   <div class=\"br\"><b>Entrega fallida<\/b>Nadie recibió DT-0390 en Merendero Norte: vuelve al depósito (ayer).<\/div>\n   <div class=\"br\"><b>Vencimientos<\/b>2 vencen en 48 h: lácteos y panificados (DT-0401 y DT-0403). Una donación vencida se marca como Vencida.<\/div>\n  <\/div>\n  <div class=\"leg\"><i><\/i>válvula = pendiente que frena el circuito<\/div>\n <\/div><\/div>\n\n <div class=\"cols\">\n  <div class=\"plate\"><div class=\"in\">\n   <div class=\"lam\"><span>Lám. 2 · Ficha técnica<\/span><span>Estación elegida<\/span><\/div>\n   <h2 id=\"fichaT\">Ficha técnica<\/h2>\n   <div class=\"tw\"><table><thead><tr><th>Código<\/th><th>Qué es<\/th><th>Destino<\/th><th>Estado<\/th><th>Acción<\/th><\/tr><\/thead><tbody id=\"rows\"><\/tbody><\/table><\/div>\n   <p class=\"nm\" id=\"nota\"><\/p>\n  <\/div><\/div>\n  <div class=\"plate\"><div class=\"in\">\n   <div class=\"lam\"><span>Lám. 3 · Alarmas<\/span><span>A urgente · B hoy · C semana<\/span><\/div>\n   <h2>Registro de alarmas<\/h2>\n   <ul class=\"alarm\" id=\"alarm\"><\/ul>\n  <\/div><\/div>\n <\/div>\n\n <div class=\"plate stack\"><div class=\"in\">\n  <div class=\"lam\"><span>Lám. 4 · Rieles<\/span><span>Posiciones por paradas cumplidas<\/span><\/div>\n  <h2>Rieles de camiones<\/h2>\n  <div class=\"rails\" id=\"rails1\"><\/div>\n  <p class=\"nm\">Posiciones por paradas cumplidas, no en vivo.<\/p>\n <\/div><\/div>\n\n <div class=\"two\">\n  <div class=\"plate\"><div class=\"in\"><div class=\"lam\"><span>Lám. 5 · Calibres<\/span><span>Cobertura<\/span><\/div><h2>Necesidades abiertas<\/h2><div class=\"need\" id=\"need\"><\/div><\/div><\/div>\n  <div class=\"plate\"><div class=\"in\"><div class=\"lam\"><span>Lám. 6 · Serie<\/span><span>S34 – S41<\/span><\/div><h2>Semanas S34 a S41<\/h2>\n   <svg id=\"spark\" viewBox=\"0 0 400 150\" width=\"100%\" role=\"img\" aria-label=\"Recibidas: 9, 12, 7, 14, 11, 16, 10, 8. Entregadas: 6, 8, 9, 10, 12, 11, 13, 5.\"><\/svg>\n   <p class=\"nm\">Trazo lleno: recibidas · trazo punteado naranja: entregadas.<\/p>\n   <p style=\"margin-top:10px\"><b>23<\/b> entregadas este mes (+15 %) · <b>31<\/b> recibidas este mes (+8 %)<\/p>\n   <p style=\"margin-top:6px\">Huella acumulada: <b>2.450 kg<\/b> a <b>34 entidades<\/b>. Alimentos 62 %, vestimenta 18 %, útiles escolares 12 %, higiene 8 %.<\/p><\/div><\/div>\n <\/div>\n <div class=\"plate stack\"><div class=\"in\"><div class=\"lam\"><span>Lám. 7 · Bitácora<\/span><span>Cada cambio, con fecha y responsable<\/span><\/div><h2>Bitácora<\/h2>\n  <ul class=\"log\">\n   <li><span>hace 12 min<\/span><span>Los Girasoles confirmó la recepción de DT-0409 (frazadas ×30).<\/span><\/li>\n   <li><span>hace 40 min<\/span><span>El camión 2 salió con 6 donaciones hacia Los Girasoles.<\/span><\/li>\n   <li><span>hace 1 h<\/span><span>El sistema asignó DT-0415 (útiles) a la necesidad de Escuela 12.<\/span><\/li>\n   <li><span>hace 2 h<\/span><span>Recibida DT-0416 (conservas 24 kg, Nicolás Pérez).<\/span><\/li>\n   <li><span>hace 3 h<\/span><span>DT-0411 quedó lista y se sumó al camión 3.<\/span><\/li>\n   <li class=\"f\"><span>ayer<\/span><span>Nadie recibió DT-0390 en Merendero Norte: vuelve al depósito (Entrega fallida).<\/span><\/li>\n  <\/ul><\/div><\/div>\n<\/section>\n\n<!-- DONACIONES -->\n<section class=\"view\" id=\"v-donaciones\" hidden>\n <div class=\"rot\">Lámina 8 · Donaciones<\/div>\n <h1>Inventario del depósito.<\/h1>\n <p class=\"sub\">Donaciones que piden atención y todo lo que está en circulación. Filtrá por estado; las acciones responden \"Actualizando…\" hasta que llega el evento.<\/p>\n <div class=\"tabs\" role=\"tablist\" id=\"dtabs\">\n  <button role=\"tab\" aria-selected=\"true\" data-t=\"inv\">Inventario<\/button><button role=\"tab\" aria-selected=\"false\" data-t=\"reg\">Registrar donación<\/button><button role=\"tab\" aria-selected=\"false\" data-t=\"norm\">Revisión de normalización<\/button>\n <\/div>\n <div id=\"t-inv\" class=\"plate\"><div class=\"in\">\n  <div class=\"lam\"><span>Tabla de inventario<\/span><span id=\"invCount\"><\/span><\/div>\n  <div class=\"chips\" id=\"chips\" role=\"group\" aria-label=\"Filtrar por estado\"><\/div>\n  <div class=\"tw\"><table><thead><tr><th>Código<\/th><th>Qué es<\/th><th>Origen → destino<\/th><th>Estado<\/th><th>Acción<\/th><\/tr><\/thead><tbody id=\"inv\"><\/tbody><\/table><\/div>\n  <p class=\"nm\">Muestra de demostración: 8 donaciones que piden atención más la entrega fallida.<\/p>\n <\/div><\/div>\n <div id=\"t-reg\" class=\"plate\" hidden><div class=\"in\">\n  <div class=\"lam\"><span>Formulario de registro<\/span><span>Qué es · cantidad · vencimiento · categoría<\/span><\/div>\n  <form class=\"f\" id=\"regf\">\n   <label>Qué es<input required name=\"q\" placeholder=\"Ej.: Frazadas\" value=\"Frazadas\"><\/label>\n   <label>Cantidad<input required name=\"c\" placeholder=\"Ej.: 30 u\" value=\"30 u\"><\/label>\n   <label>Vencimiento<input name=\"v\" type=\"text\" placeholder=\"Sin vencimiento\"><\/label>\n   <label>Categoría<select name=\"k\"><option>alimentos<\/option><option>bebidas<\/option><option selected>vestimenta<\/option><option>mobiliario<\/option><option>útiles escolares<\/option><option>higiene<\/option><\/select><\/label>\n   <div style=\"grid-column:1/-1\" class=\"row\"><button class=\"btn pri\" type=\"submit\" id=\"regb\">Registrar donación<\/button><\/div>\n  <\/form>\n  <p class=\"nm\" id=\"regn\">Al registrar, la donación queda En depósito, con fecha y responsable.<\/p>\n <\/div><\/div>\n <div id=\"t-norm\" class=\"plate\" hidden><div class=\"in\">\n  <div class=\"lam\"><span>Revisión de normalización de datos<\/span><span>Ejemplo ilustrativo<\/span><\/div>\n  <div class=\"tw\"><table><thead><tr><th>Dato original<\/th><th>Propuesta<\/th><th>Acción<\/th><\/tr><\/thead><tbody id=\"normr\"><\/tbody><\/table><\/div>\n  <p class=\"nm\">Ejemplos ilustrativos para mostrar el flujo de revisión.<\/p>\n <\/div><\/div>\n<\/section>\n\n<!-- ASIGNACIONES -->\n<section class=\"view\" id=\"v-asignaciones\" hidden>\n <div class=\"rot\">Lámina 9 · Asignaciones<\/div>\n <h1>Propuestas para revisar.<\/h1>\n <p class=\"sub\">Los algoritmos proponen un destino; la administración aprueba o descarta. Hoy hay 4 donaciones con más de 5 días sin asignar y 2 asignadas sin camión.<\/p>\n <div class=\"row\" style=\"margin:0 0 16px\"><button class=\"btn pri\" id=\"runAlg\" type=\"button\">Ejecutar algoritmos de asignación<\/button><\/div>\n <div class=\"two\" style=\"margin-top:0\">\n  <div class=\"plate\"><div class=\"in\"><div class=\"lam\"><span>Cola de revisión<\/span><span id=\"propN\">0 propuestas<\/span><\/div>\n   <ul class=\"alarm\" id=\"props\"><li><b>—<\/b><div><span>Sin propuestas por revisar. Ejecutá los algoritmos para generarlas.<\/span><\/div><\/li><\/ul><\/div><\/div>\n  <div class=\"plate\"><div class=\"in\"><div class=\"lam\"><span>Contexto<\/span><span>Necesidades abiertas<\/span><\/div><div class=\"need\" id=\"need2\"><\/div>\n   <p class=\"nm\">Asignada con 2 sin camión: DT-0403 y DT-0407 (demostración).<\/p><\/div><\/div>\n <\/div>\n<\/section>\n\n<!-- CAMIONES -->\n<section class=\"view\" id=\"v-camiones\" hidden>\n <div class=\"rot\">Lámina 10 · Camiones<\/div>\n <h1>Flota y rutas.<\/h1>\n <p class=\"sub\">3 camiones: 2 en ruta, 1 cargando. Cada ruta es un riel con sus paradas.<\/p>\n <div class=\"plate\"><div class=\"in\"><div class=\"lam\"><span>Rieles de la flota<\/span><span>No en vivo<\/span><\/div><div class=\"rails\" id=\"rails2\"><\/div>\n  <p class=\"nm\">Posiciones por paradas cumplidas, no en vivo.<\/p><\/div><\/div>\n<\/section>\n\n<!-- DONANTES -->\n<section class=\"view\" id=\"v-donantes\" hidden>\n <div class=\"rot\">Lámina 11 · Donantes<\/div>\n <h1>Quiénes alimentan la máquina.<\/h1>\n <p class=\"sub\">86 donantes activos: 52 Colaboradores, 26 Sostenedores y 8 Transformadores (demostración).<\/p>\n <div class=\"two\" style=\"margin-top:0\">\n  <div class=\"plate\"><div class=\"in\"><div class=\"lam\"><span>Importación<\/span><span>CSV de donantes<\/span><\/div><h2>Importar CSV<\/h2>\n   <p>Subí un archivo CSV de donantes. Va a pasar por la revisión de normalización antes de sumarse.<\/p>\n   <div class=\"row\"><label class=\"btn\" style=\"cursor:pointer\">Elegir archivo<input id=\"csv\" type=\"file\" accept=\".csv,text/csv\" hidden><\/label><button class=\"btn pri\" id=\"csvb\" type=\"button\">Importar CSV de donantes<\/button><\/div>\n   <p class=\"nm\" id=\"csvn\">Ningún archivo elegido.<\/p><\/div><\/div>\n  <div class=\"plate\"><div class=\"in\"><div class=\"lam\"><span>Mes en curso<\/span><span>Ejemplo<\/span><\/div><h2>Ranking del mes<\/h2><ol class=\"rk\"><li>Cooperativa La Huerta<span class=\"tag\">1.º<\/span><\/li><li>Nicolás Pérez<span class=\"tag\">2.º<\/span><\/li><li>Panadería El Molino<span class=\"tag\">3.º<\/span><\/li><\/ol><\/div><\/div>\n <\/div>\n<\/section>\n\n<!-- ENTIDADES -->\n<section class=\"view\" id=\"v-entidades\" hidden>\n <div class=\"rot\">Lámina 12 · Entidades<\/div>\n <h1>Quiénes reciben.<\/h1>\n <p class=\"sub\">34 entidades ayudadas. 3 entidades nuevas esperan aprobación esta semana.<\/p>\n <div class=\"two\" style=\"margin-top:0\">\n  <div class=\"plate\"><div class=\"in\"><div class=\"lam\"><span>C1 · Esta semana<\/span><span>Solicitudes<\/span><\/div><h2>Esperando aprobación<\/h2>\n   <ul class=\"alarm\" id=\"sol\"><\/ul><\/div><\/div>\n  <div class=\"plate\"><div class=\"in\"><div class=\"lam\"><span>Calibres<\/span><span>Necesidades abiertas<\/span><\/div><h2>Necesidades<\/h2><div class=\"need\" id=\"need3\"><\/div><\/div><\/div>\n <\/div>\n<\/section>\n\n<!-- RANKINGS -->\n<section class=\"view\" id=\"v-rankings\" hidden>\n <div class=\"rot\">Lámina 13 · Rankings<\/div>\n <h1>Donantes del mes.<\/h1>\n <p class=\"sub\">Ranking de ejemplo, octubre. Las categorías de donante son Colaboradores, Sostenedores y Transformadores.<\/p>\n <div class=\"plate\"><div class=\"in\"><div class=\"lam\"><span>Ranking del mes<\/span><span>Ejemplo<\/span><\/div><ol class=\"rk\"><li>Cooperativa La Huerta<span class=\"tag\">1.º<\/span><\/li><li>Nicolás Pérez<span class=\"tag\">2.º<\/span><\/li><li>Panadería El Molino<span class=\"tag\">3.º<\/span><\/li><\/ol><\/div><\/div>\n<\/section>\n<footer>DonaTrack · administración del depósito · Datos de demostración<\/footer>\n<\/main>\n\n<div class=\"pal\" id=\"pal\" hidden><div role=\"dialog\" aria-modal=\"true\" aria-label=\"Paleta de comandos\"><input id=\"q\" type=\"text\" placeholder=\"Escribí una pantalla o una acción…\" aria-label=\"Buscar pantalla o acción\" autocomplete=\"off\"><ul id=\"res\" role=\"listbox\"><\/ul><\/div><\/div>\n<div class=\"toast\" id=\"toast\" role=\"status\" hidden><\/div>\n\n<script>\n(function(){\n var $=function(i){return document.getElementById(i)};\n var tt,toast=$('toast');\n function say(m){toast.textContent=m;toast.hidden=false;clearTimeout(tt);tt=setTimeout(function(){toast.hidden=true},3200)}\n /* acción asíncrona: Actualizando… y recién después el resultado */\n function act(btn,msg,done){var t=btn.textContent;btn.disabled=true;btn.textContent='Actualizando…';say(msg+' Actualizando…');setTimeout(function(){btn.disabled=false;btn.textContent=t;if(done)done();},1400)}\n var TRUCK='<svg viewBox=\"0 0 36 22\" aria-hidden=\"true\"><path d=\"M1 3h20v14H1zM21 7h9l5 5v5H21z\" fill=\"#EFE5CA\" stroke=\"#2A2822\" stroke-width=\"2\"/><path d=\"M4 8h14M4 12h14\" stroke=\"#C4501B\" stroke-width=\"1.5\"/><circle cx=\"9\" cy=\"19\" r=\"3\" fill=\"#2A2822\"/><circle cx=\"28\" cy=\"19\" r=\"3\" fill=\"#2A2822\"/><\/svg>';\n /* navegación */\n var V=[['inicio','Inicio'],['donantes','Donantes'],['entidades','Entidades'],['donaciones','Donaciones'],['asignaciones','Asignaciones'],['camiones','Camiones'],['rankings','Rankings'] puntos del papel); láminas con 6-8 px de marco exterior y 12-14 px de relleno interior; separación de lámina 22-26 px.", "radios": "0 en láminas, botones y etiquetas; círculo solo en estaciones, válvulas y medallones.", "bordes/sombras": "Bordes de 1,5 px tinta y filete interior de 1 px; esquinas de registro naranja de 2 px; sombras duras 2-3 px sin desenfoque en botones; rayado a 45 grados y trama de puntos como textura."}, "componentes": [{"nombre": "Lámina (.plate)", "uso": "Contenedor de todo bloque: doble marco, esquinas de registro, rótulo Lám. N; variante .dk sobre tinta para esquemas principales."}, {"nombre": "Estación (.sel)", "uso": "Botón de estado con conteo; seleccionada se invierte a papel. Nunca lleva la válvula dentro del mismo selector."}, {"nombre": "Válvula (.valve)", "uso": "Círculo naranja con número en el borde superior de una estación: pendiente que frena el circuito. Es un botón con aria-label."}, {"nombre": "Riel de camión (.stops)", "uso": "Lista ordenada de paradas con marcas cumplidas y camión entre la última cumplida y la siguiente; vertical en móvil."}, {"nombre": "Calibre (.gauge)", "uso": "Cobertura de una necesidad con rayado; naranja si es urgente."}, {"nombre": "Odómetro (.odo)", "uso": "Cifras públicas con dígitos mecánicos que cuentan al entrar en pantalla."}, {"nombre": "Registro de alarmas", "uso": "Códigos A (urgente), B (hoy), C (semana) con un botón de acción por alarma."}, {"nombre": "Tag de estado (.tag)", "uso": "Texto del estado; naranja lleno = más de 5 días o urgente, rayado punteado = pendiente de evento (Actualizando…), tinta llena = Vencida o Asignada tras aprobar."}, {"nombre": "Paleta de comandos", "uso": "Ctrl K: ir a pantallas, ver estaciones y ejecutar acciones."}, {"nombre": "Nota al margen (.marg / .nm)", "uso": "Aclaración en mono con filete naranja; en la landing va en columna lateral, en el dashboard bajo la lámina."}], "patrones": ["Landing: índice lateral fijo con numeración romana y resaltado por scroll; barra horizontal en móvil.", "Dashboard: 7 pantallas conmutables en el mismo archivo (hash o ?vista=), plano de planta en Inicio.", "Toda acción asíncrona: el botón pasa a Actualizando…, y recién después cambia el estado o queda como pendiente; nunca éxito inmediato.", "En móvil las tablas pasan a fichas apiladas y los diagramas se verticalizan."], "tono": "Sobrio, preciso, con un guiño de manual antiguo. Frases cortas, rótulos técnicos, voseo rioplatense.", "copyEjemplos": {"headline": "Una máquina de precisión para que ninguna donación se pierda.", "cta": "Ver la máquina en marcha", "seccion": "Cuatro mecanismos, ningún eslabón suelto.", "dashboard": "Todo el depósito en un solo circuito.", "leyenda": "válvula = pendiente que frena el circuito", "accion": "DT-0398: Asignar. Actualizando…"}, "estados": {"EN_DEPOSITO": "Estación E2 del plano; tag con contorno de tinta, naranja lleno si lleva más de 5 días.", "ASIGNACION_REALIZADA": "Estación E3; tag con contorno; tras aprobar una propuesta pasa a tinta llena.", "LISTA_PARA_ENTREGAR": "Estación E4; tag con contorno.", "EN_TRASLADO": "Estación E5; el camión aparece entre paradas en el riel.", "ENTREGADA": "Estación E6; solo suma cuando la entidad confirma la recepción.", "ENTREGA_FALLIDA": "Desvío punteado naranja que vuelve al depósito; en la tabla de estados con rayado.", "VENCIDA": "Desvío punteado con cruz; tag en tinta llena."}, "accesibilidad": "Foco visible de 3 px naranja (naranja claro sobre tinta); estados siempre con texto; válvulas y estaciones son botones con aria-label; paleta de comandos con role dialog y listbox; contraste de texto sobre papel y sobre tinta por encima de 4,5:1; se anulan animaciones con prefers-reduced-motion; sin scroll horizontal de página.", "paraExtender": "Falta llevarlo al lado del donante (historial de estados como riel de una sola donación, misiones como calibres, insignias como medallones grabados), al de la entidad (necesidades como calibres y botón Confirmar recepción con >DonaTrack es una plataforma de gestión y trazabilidad de donaciones para organizaciones solidarias universitarias. Conecta a quienes donan (personas humanas o jurídicas), a las entidades beneficiarias y a la administración del depósito.<\/p>\n          <p>Es un proyecto académico de la UTN-FRBA. Lo que ves en esta página usa datos de demostración.<\/p><\/div>\n        <div style=\"position:relative\"><svg class=\"sprig\" viewBox=\"0 0 150 90\" aria-hidden=\"true\"><path d=\"M4 84C40 70 84 50 146 14\"/><path d=\"M36 72c-2-14 4-24 14-30 4 12-2 24-14 30ZM66 58c0-14 8-22 20-26 2 12-6 22-20 26ZM100 38c2-12 10-18 22-18-2 12-10 18-22 18Z\"/><\/svg><h3>El problema<\/h3><p>Donar suele ser dejar algo y no saber más. Entre que llega al depósito y llega a quien lo necesita hay registro, asignación, camión, ruta y confirmación. Si nada de eso se anota, nadie sabe dónde está cada cosa ni quién la tuvo.<\/p>\n          <p>DonaTrack lo anota: cada cambio de estado queda con fecha y responsable, y la entidad confirma la recepción.<\/p><\/div>\n      <\/div>\n      <div class=\"thread\" aria-label=\"Recorrido resumido\"><div><b>Depósito<\/b>se registra<\/div><div><b>Asignación<\/b>se propone y se aprueba<\/div><div><b>Camión<\/b>sale por una ruta con paradas<\/div><div><b>Entidad<\/b>confirma la recepción<\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"panel p2\" id=\"p2\" aria-label=\"Crecimiento\">\n    <span class=\"folio\" aria-hidden=\"true\">iii / viii<\/span>\n    <div class=\"in grow\">\n      <div class=\"plant\"><svg viewBox=\"0 0 400 420\" role=\"img\" aria-labelledby=\"pt pd\"><title id=\"pt\">Planta dibujada en línea fina<\/title><desc id=\"pd\">La planta crece en cinco etapas, de semilla a fruto. Dos variantes muestran la poda y la helada.<\/desc>\n        <defs><g id=\"lfa\"><path d=\"M0 0C-22-2-44-14-56-36C-30-37-8-24 0 0Z\"/><path d=\"M0 0C-18-10-34-22-52-34\"/><path d=\"M-16-9-13-20M-29-19-25-30\" /><\/g><\/defs>\n        <path class=\"gnd\" d=\"M14 "translate(201,270) scale(-1,1) rotate(-70)\"><use href=\"#lfa\"/><\/g><g class=\"lf\" transform=\"translate(190,215) rotate(-78) scale(.8)\"><use href=\"#lfa\"/><\/g>\n          <g class=\"star\" transform=\"translate(120,150)\"><path d=\"M0-9V9M-8-4.5 8 4.5M-8 4.5 8-4.5\"/><\/g><g class=\"star\" transform=\"translate(270,200)\"><path d=\"M0-8V8M-7-4 7 4M-7 4 7-4\"/><\/g><g class=\"star\" transform=\"translate(300,120)\"><path d=\"M0-6V6M-5-3 5 3M-5 3 5-3\"/><\/g><g class=\"star\" transform=\"translate(90,260)\"><path d=\"M0-6V6M-5-3 5 3M-5 3 5-3\"/><\/g><g class=\"star\" transform=\"translate(240,90)\"><path d=\"M0-9V9M-8-4.5 8 4.5M-8 4.5 8-4.5\"/><\/g><g class=\"star\" transform=\"translate(150,70)\"><path d=\"M0-5V5M-4.5-2.5 4.5 2.5M-4.5 2.5 4.5-2.5\"/><\/g>\n          <circle cx=\"146\" cy=\"196\" r=\"7\" stroke-dasharray=\"2 3\"/><\/g>\n        <g id=\"prune\" class=\"pruneg fade\" style=\"opacity:0\"><path d=\"M200 340C199 300 202 260 200 218\" stroke=\"#525c2a\" fill=\"none\" stroke-width=\"1.5\"/><g class=\"lf\" transform=\"translate(200,300)\"><use href=\"#lfa\"/><\/g><g class=\"lf\" transform=\"translate(200,262) scale(-1,1)\"><use href=\"#lfa\"/><\/g>\n          <path class=\"cut\" d=\"M192 222L208 212\"/><path class=\"nowt\" d=\"M192 206C198 196 206 196 212 202\"/>\n          <path d=\"M240 330C268 326 304 324 344 326\" stroke=\"#525c2a\" fill=\"none\" stroke-width=\"1.4\"/><g class=\"lf\" transform=\"translate(268,327) scale(-.6,.6) rotate(8)\"><use href=\"#lfa\"/><\/g><g transform=\"translate(346,326)\"><path class=\"petal\" d=\"M0 0C6-8 6-14 0-18C-4-12-4-6 0 0Z\" style=\"stroke-dasharray:2 2\"/><path class=\"petal\" d=\"M0 0C10-4 16-4 20 2C12 6 6 6 0 0Z\" style=\"stroke-dasharray:2 2\"/><\/g>\n          <path d=\"M296 314C290 270 250 238 218 230\" fill=\"none\" stroke=\"#a93f2a\" stroke-width=\"1.2\" stroke-dasharray=\"3 4\"/><path d=\"M226 224L216 230 227 236\" fill=\"none\" stroke=\"#a93f2a\" stroke-width=\"1.2\"/>\n          <path d=\"M200 282C208 274 216 268 220 258\" fill=\"none\" stroke=\"#6b7a58\" stroke-width=\"1.2\" opacity=\"0\"/><\/g>\n      <\/svg><\/div>\n      <div>\n        <p class=\"eyebrow\">Una donación a lo largo del tiempo<\/p>\n        <div class=\"stage-name\" id=\"sn\" aria-live=\"polite\"><\/div>\n        <p class=\"stage-txt\" id=\"st\"><\/p>\n        <div class=\"slid\"><label for=\"rg\">Tiempo: arrastrá o usá las flechas del teclado<\/label><input id=\"rg\" type=\"range\" min=\"0\" max=\"4\" step=\"1\" value=\"0\"><div class=\"ticks\" id=\"ticks\"><\/div><\/div>\n        <div class=\"dev\" role=\"group\" aria-label=\"Cuando algo sale mal\"><span>Cuando algo sale mal:<\/span><button class=\"chip\" type=\"button\" data-dev=\"poda\" aria-pressed=\"false\">Entrega fallida · la poda<\/button><button class=\"chip\" type=\"button\" data-dev=\"helada\" aria-pressed=\"false\">Vencida · la helada<\/button><\/div>\n        <p class=\"note\"><button type=\"button\" class=\"linkb\" id=\"auto\">Reproducir el crecimiento<\/button>&nbsp;· La planta es una ayuda para entender: el nombre real del estado siempre está escrito al lado.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"panel p3\" id=\"p3\" aria-label=\"Quién cuida qué\">\n    <span class=\"folio\" aria-hidden=\"true\">iv / viii<\/span>\n    <div class=\"in\">\n      <p class=\"eyebrow\">Tres actores, un mismo huerto<\/p>\n      <h2>Quién <em>cuida qué.<\/em><\/h2>\n      <div class=\"three\" id=\"actors\">\n        <div data-r=\"0\"><span class=\"you\">Llegaste como donante<\/span><svg class=\"ic\" viewBox=\"0 0 58 58\" aria-hidden=\"true\"><ellipse cx=\"29\" cy=\"38\" rx=\"7\" ry=\"10\"/><path d=\"M29 29c-3 6 3 9 0 18\"/><path d=\"M29 20v-4M24 22l-3-3M34 22l3-3\" stroke-dasharray=\"1 4\"/><\/svg><h3>Quien dona<\/h3><p>Lleva su donación al depósito y la sigue con su historial de estados. Ve las necesidades de las entidades, suma misiones e insignias y recibe notificaciones. Puede ser persona humana o jurídica.<\/p><\/div>\n        <div data-r=\"1\"><span class=\"you\">Llegaste como entidad<\/span><svg class=\"ic\" viewBox=\"0 0 58 58\" aria-hidden=\"true\"><path d=\"M10 28h38c-1 12-7 20-19 20S11 40 10 28Z\"/><circle cx=\"22\" cy=\"22\" r=\"5\"/><circle cx=\"33\" cy=\"20\" r=\"5\"/><circle cx=\"41\" cy=\"24\" r=\"4\"/><path d=\"M26 17c0-4 2-6 5-7\"/><\/svg><h3>Quien recibe<\/h3><p>La entidad beneficiaria publica sus necesidades y ve cuánto está cubierto, por ejemplo 18 de 30 frazadas. Cuando llega lo asignado, confirma la recepción.<\/p><\/div>\n        <div data-r=\"2\"><span class=\"you\">Llegaste como administración<\/span><svg class=\"ic\" viewBox=\"0 0 58 58\" aria-hidden=\"true\"><path d=\"M14 22h22l-2 20a3 3 0 0 1-3 3H19a3 3 0 0 1-3-3Z\"/><path d=\"M36 28l12-8M46 17l3 6\"/><path d=\"M14 26c-5 0-7 3-7 6s2 5 6 5\"/><path d=\"M40 36l2 3M44 33l2 3M45 38l2 3\" stroke-dasharray=\"1 3\"/><\/svg><h3>Quien cuida el depósito<\/h3><p>La administración registra, asigna, revisa propuestas, aprueba o descarta, y carga los camiones. Decide con calma qué atender primero.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"panel p4\" id=\"p4\" aria-label=\"Cosecha\">\n    <span class=\"folio\" aria-hidden=\"true\">v / viii<\/span>\n    <div class=\"in\">\n      <p class=\"eyebrow\">Transparencia pública · Cifras de demostración<\/p>\n      <h2>Lo que ya <em>se cosechó.<\/em><\/h2>\n      <div class=\"harv\"><div class=\"orb\"><b>128<\/b><span>donaciones entregadas<\/span><\/div><div class=\"orb\"><b>34<\/b><span>entidades ayudadas<\/span><\/div><div class=\"orb\"><b>2.448<\/b><span>kg de alimentos distribuidos<\/span><\/div><div class=\"orb\"><b>86<\/b><span>donantes activos<\/span><\/div><\/div>\n      <p class=\"donors\"><span><b>52<\/b>Colaboradores<\/span><i><\/i><span><b>26<\/b>Sostenedores<\/span><i><\/i><span><b>8<\/b>Transformadores<\/span><\/p>\n      <p class=\"demo\">Datos de demostración. Las cifras reales las muestra el sitio en vivo.<\/p>\n    <\/div>\n  <\/section>\n\n  <section class=\"panel p5\" id=\"p5\" aria-label=\"Galería de entregas\">\n    <span class=\"folio\" aria-hidden=\"true\">vi / viii<\/span>\n    <div class=\"in\">\n      <p class=\"eyebrow\">Galería de donaciones entregadas<\/p>\n      <h2>Lo que <em>ya llegó<\/em> a destino.<\/h2>\n      <div class=\"cats\" id=\"cats\" role=\"group\" aria-label=\"Filtrar la galería por categoría\"><\/div>\n      <div class=\"gal\" id=\"gal\"><\/div>\n      <p class=\"demo\">Ejemplos de demostración para mostrar el formato. En el sitio, la galería lista donaciones entregadas de verdad.<\/p>\n    <\/div>\n  <\/section>\n\n  <section class=\"panel p6\" id=\"p6\" aria-label=\"Lo que viene y privacidad\">\n    <span class=\"folio\" aria-hidden=\"true\">vii / viii<\/span>\n    <div class=\"in endg\">\n      <div class=\"soon\"><span class=\"pill\">Próximamente<\/span>\n        <h2 style=\"font-size:clamp(28px,3.4vw,44px);margin:6px 0 12px\">Mapa de <em>impacto<\/em><\/h2>\n        <p>El mapa de impacto todavía no está disponible. Lo que ves es un esquema ilustrativo, sin ubicaciones reales.<\/p>\n        <svg viewBox=\"0 0 300 130\" role=\"img\" aria-label=\"Esquema ilustrativo, no es un mapa real\"><path d=\"M6 100C50 34 110 108 164 66S250 30 294 66\"/><path d=\"M6 118C70 98 130 126 200 108S270 100 294 112\" opacity=\".6\"/><circle cx=\"62\" cy=\"66\" r=\"4\"/><circle cx=\"164\" cy=\"66\" r=\"4\"/><circle cx=\"246\" cy=\"42\" r=\"4\"/><circle cx=\"62\" cy=\"66\" r=\"9\" opacity=\".5\"/><text x=\"150\" y=\"126\" text-anchor=\"middle\">ILUSTRATIVO<\/text><\/svg><\/div>\n      <div class=\"priv\"><p class=\"eyebrow\">Privacidad<\/p><h3 style=\"margin-top:14px\">Lo público es poco, a propósito.<\/h3><p>Sin sesión se ve solo lo público: el inicio, la galería de entregas y las cifras de transparencia. Mis donaciones, las necesidades de cada entidad y el depósito se ven al ingresar con tu rol.<\/p><p style=\"margin-top:12px\"><a href=\"#\" class=\"linkb\" style=\"text-decoration:none\">Leer la página de privacidad<\/a><\/p><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"panel p7\" id=\"p7\" aria-label=\"Plantá la primera\">\n    <svg class=\"field\" viewBox=\"0 0 1440 200\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M0 60C240 30 480 90 760 56S1220 20 1440 50\"/><path d=\"M0 110C300 80 560 140 860 106S1240 80 1440 104\" opacity=\".7\"/><path d=\"M0 160C320 140 640 186 980 156S1300 140 1440 154\" opacity=\".5\"/><\/svg>\n    <span class=\"folio\" aria-hidden=\"true\">viii / viii<\/span>\n    <div class=\"in\">\n      <p class=\"eyebrow\">Para terminar<\/p>\n      <h2>Plantá la primera. <em>Todo va a estar bien.<\/em><\/h2>\n      <p class=\"lead\" id=\"lead7\"><\/p>\n      <div class=\"acts\"><a class=\"btn\" href=\"#\" id=\"cta7\">Registrarme<\/a><a class=\"btn g\" href=\"#\">Ingresar con sesión demo<\/a><\/div>\n      <p class=\"demo\">Podés registrarte como persona humana, jurídica o entidad. La sesión demo te deja elegir un rol.<\/p>\n      <div class=\"foot\"><span>DonaTrack · Proyecto académico UTN-FRBA<\/span><span>Datos de demostración<\/span><a href=\"#\">Privacidad<\/a><a href=\"#\">Ingresar<\/a><\/div>\n    <\/div>\n  <\/section>\n<\/main>\n\n<nav class=\"dock\" aria-label=\"Paneles de la página\">\n  <button class=\"ar\" type=\"button\" id=\"prev\" aria-label=\"Panel anterior\">&larr;<\/button>\n  <ol class=\"vine\" id=\"dots\"><\/ol>\n  <button class=\"ar\" type=\"button\" id=\"next\" aria-label=\"Panel siguiente\">&rarr;<\/button>\n  <p class=\"pnm\" id=\"pnm\" aria-hidden=\"true\"><\/p>\n<\/nav>\n\n<div class=\"pal\" id=\"pal\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Ir a\">\n  <div class=\"box\"><input id=\"pi\" type=\"text\" placeholder=\"¿Adónde querés ir?\" aria-label=\"Buscar destino o acción\" autocomplete=\"off\"><ul id=\"pl\"><\/ul><div class=\"ft\">Flechas para moverte, Enter para elegir, Esc para cerrar<\/div><\/div>\n<\/div>\n\n<script>\n(function(){\n  var reduce=matchMedia >'+tag('ven')+' <b>'+(C.ven?C.ven:'ninguna hoy')+'<\/b> <em>la helada<\/em><\/button><\/div>'}\n  function focusHTML(){\n    var o=open(),n={u:0,h:0,s:0};o.forEach(function(q){n[q.l]++});\n    if(!o.length)return '<div class=\"focus\"><div class=\"calm\">Hoy el huerto está <em>en calma.<\/em><p>Nada más pide tu atención. Descansá.<\/p><\/div><\/div>';\n    if(o.indexOf(Q.filter(function(q){return q.id===idx})[0])<0)idx=o[0].id;\n    var q=Q.filter(function(x){return x.id===idx})[0],pos=o.indexOf(q)+1,pend=q.ph===1&&q.id!=='q1';\n    return '<section class=\"focus\" aria-labelledby=\"ft\"><div class=\"stem\" aria-hidden=\"true\"><\/div><p class=\"eyebrow\" id=\"ft\">Lo primero ahora<\/p><h1><span class=\"lv '+q.l+'\">'+LV[q.l]+'<\/span><br>'+esc(q.t)+'<\/h1><p class=\"why\">'+esc(q.w)+'<\/p>'\n      +'<div class=\"btns\"><button class=\"btn\" type=\"button\" data-a=\"do\"'+(pend?' disabled':'')+'>'+(pend?'Esperando respuesta…':q.b)+'<\/button><button class=\"btn g\" type=\"button\" data-a=\"later\"'+(o.length<2?' disabled':'')+'>Para después<\/button><\/div>'\n      +'<p class=\"sub2\"><button type=\"button\" class=\"lk\" data-a=\"resolve\">'+(armedKey==='r'+q.id?'¿Confirmás? Tocá de nuevo':'Dar por resuelto')+'<\/button><\/p>'\n      +'<div class=\"count\"><span>'+pos+' de '+o.length+' · '+n.u+' urgentes, '+n.h+' para hoy, '+n.s+' esta semana<\/span><\/div><\/section>'\n      +(o.length>1?'<section class=\"later\" aria-labelledby=\"lt\"><h2 class=\"st\" id=\"lt\">Para después<\/h2><p class=\"cap\">Nada se esconde: lo urgente sigue a la vista y vuelve al frente cuando quieras.<\/p><div>'+o.filter(function(x){return x!==q}).map(function(x){return '<div class=\"lrow\"><span class=\"lv '+x.l+'\">'+LV[x.l]+'<\/span><span class=\"t\">'+esc(x.t)+'<\/span><button type=\"button\" class=\"lk\" data-a=\"front\" data-id=\"'+x.id+'\">Pasar al frente<\/button><\/div>'}).join('')+'<\/div><\/section>':'')}\n  function V_inicio(){\n    return '<h1 class=\"sr\">Inicio: el huerto del
