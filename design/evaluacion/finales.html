i{font:400 120px/.7 var(--f-serif);font-style:italic;position:absolute;right:6px;bottom:-4px;opacity:.9}\n.gal .bd{padding:12px 14px 14px;display:grid;gap:6px}\n.gal h3{font-size:22px}.gal .m{font-size:13px;font-weight:700}\n.gal dl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:13px;font-weight:600;border-top:2px dashed var(--ink);padding-top:8px;margin-top:4px}\n.gal dt{font-weight:800;text-transform:uppercase;font-size:10px;letter-spacing:.06em;padding-top:2px}\n.soon{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:36px;align-items:center;margin-top:10px}\n.stamp{display:inline-block;transform:rotate(-4deg);border:5px double var(--tomato);color:var(--tomato-d);font:400 clamp(32px,4vw,56px) var(--f-head);padding:8px 18px;margin:20px 0;letter-spacing:.02em}\n.soon svg{width:100%;height:auto;border:var(--b) solid var(--ink);background:var(--paper2);box-shadow:var(--sh);display:block}\n.cls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:22px}\n.cls a{text-decoration:none;border:var(--b) dashed var(--ink);padding:22px;display:grid;gap:12px;background:#fff;min-height:250px;align-content:space-between;position:relative}\n.cls a:hover{background:var(--mostaza);border-style:solid;box-shadow:var(--sh)}\n.cls .ab{font:800 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase}\n.cls h3{font-size:clamp(28px,3vw,40px)}.cls span.t{font-size:16px;font-weight:600}.cls b{font-weight:800;border-top:2px solid var(--ink);padding-top:10px}\n.ing{margin-top:26px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;border:var(--b) solid var(--ink);padding:16px 18px;background:var(--celeste);box-shadow:var(--sh)}\n.ing h3{font-size:24px}.ing .cta{gap:10px}\n.priv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:22px}\n.priv .box h3{font-size:24px}.priv ul{list-style:none;display:grid;gap:10px;font-weight:600}\n.priv li{padding-left:20px;position:relative}.priv li::before{content:\"§\";position:absolute;left:0;font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:20px;line-height:1.1}\nfooter{margin-top:50px;border-top:8px double var(--ink);padding-top:18px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:24px;font-weight:600;font-size:15px}\nfooter h4{font-size:15px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}\nfooter ul{list-style:none;display:grid;gap:5px}\nfooter button.l{background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-weight:600;padding:0}\nfooter .fb{grid-column:1/-1;border-top:3px solid var(--ink);padding-top:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}\n\n@media(max-width:1100px){.mast{grid-template-columns:1fr}.ear{display:none}}\n@media(max-width:900px){\n.front,.prob,.two,.soon,.endcta,.priv,.sdet{grid-template-columns:1fr}\n.lead{padding:0 0 26px;border:0;border-bottom:var(--b) solid var(--ink)}.side{padding:24px 0 0}\n.cols{column-count:1}.three,.cls{grid-template-columns:1fr}.vs{grid-template-columns:1fr}\n.nums{grid-template-columns:1fr 1fr}.nums div:nth-child(2){border-right:0}.nums div:nth-child(-n+2){border-bottom:var(--b) solid var(--ink)}\n.tabs{display:grid;grid-template-columns:repeat(3,1fr);position:static}.tabs button{border-bottom:var(--b) solid var(--ink);font-size:12px;padding:9px 4px}.tabs button:nth-child(3){border-right:0}\n.lr{grid-template-columns:1fr auto;gap:6px 10px}.lr.h{display:none}.lr>span:nth-child(3){grid-column:1/-1}\n.ing{grid-template-columns:1fr}footer{grid-template-columns:1fr}.paper{padding:12px 14px 30px}\n.train .st{flex:1 1 44%}.sdet .who{max-width:none}\n}\n<\/style><\/head><body>\n<a class=\"skip\" href=\"#main\">Saltar al contenido<\/a>\n<div class=\"paper\">\n<div class=\"meta\"><span>Sábado 31 de octubre · Edición del depósito central<\/span><span class=\"demo\">Datos de demostración<\/span><span><a href=\"#\">Ingresar<\/a> · <a href=\"#\" data-go=\"privacidad\">Privacidad<\/a><\/span><\/div>\n<header class=\"mast\">\n <div class=\"ear l\"><b>Hoy<\/b>Lo que se dona se anota, se verifica y se publica.<\/div>\n <div class=\"c\"><h1>Dona<i>Track<\/i><\/h1><p class=\"d\">El diario de lo que se dona, se asigna y llega a destino.<\/p><\/div>\n <div class=\"ear r\"><b>Con firma<\/b>Cada línea del registro tiene fecha y responsable.<\/div>\n<\/header>\n<nav class=\"tabs\" role=\"tablist\" aria-label=\"Secciones del diario\">\n <button role=\"tab\" aria-selected=\"true\" data-t=\"portada\" id=\"t-portada\" aria-controls=\"portada\"><small>Pág. 1<\/small>Portada<\/button>\n <button role=\"tab\" aria-selected=\"false\" data-t=\"registro\" id=\"t-registro\" aria-controls=\"registro\" tabindex=\"-1\"><small>Pág. 2<\/small>El registro<\/button>\n <button role=\"tab\" aria-selected=\"false\" data-t=\"galeria\" id=\"t-galeria\" aria-controls=\"galeria\" tabindex=\"-1\"><small>Pág. 3<\/small>Entregas<\/button>\n <button role=\"tab\" aria-selected=\"false\" data-t=\"mapa\" id=\"t-mapa\" aria-controls=\"mapa\" tabindex=\"-1\"><small>Pág. 4<\/small>Mapa de impacto<\/button>\n <button role=\"tab\" aria-selected=\"false\" data-t=\"clasificados\" id=\"t-clasificados\" aria-controls=\"clasificados\" tabindex=\"-1\"><small>Pág. 5<\/small>Clasificados<\/button>\n <button role=\"tab\" aria-selected=\"false\" data-t=\"privacidad\" id=\"t-privacidad\" aria-controls=\"privacidad\" tabindex=\"-1\"><small>Pág. 6<\/small>Privacidad<\/button>\n<\/nav>\n<main id=\"main\">\n\n<!-- PÁGINA 1 -->\n<section class=\"panel\" id=\"portada\" role=\"tabpanel\" aria-labelledby=\"t-portada\">\n <div class=\"front\"><div class=\"lead\"><div class=\"kick\">Edición del día · Qué es DonaTrack<\/div>\n  <h2>Lo que se dona <em>se cuenta.<\/em> Y se cuenta bien.<\/h2>\n  <p class=\"sub\">Cada donación queda anotada en un registro público: qué es, quién la trajo, a quién llegó y quién lo confirmó.<\/p>\n  <div class=\"cta\"><a class=\"btn\" href=\"#\" data-go=\"registro\">Leer el registro de una donación<\/a><a class=\"btn w\" href=\"#\" data-go=\"clasificados\">Sumarme al registro<\/a><\/div>\n  <div class=\"what\"><div class=\"kick\">La nota<\/div>\n  <div class=\"cols\"><p>DonaTrack es la plataforma de gestión y trazabilidad de donaciones de las organizaciones solidarias universitarias. Junta a tres actores: quien dona, la entidad que recibe y la administración del depósito. Una donación llega al depósito y alguien la anota: qué es, cuánta hay, cuándo vence y a qué categoría pertenece. Hasta ahí es una caja en un estante.<\/p><p>Lo que la convierte en ayuda es lo que viene después. El sistema propone a qué necesidad concreta de qué entidad va; la administración revisa y aprueba o descarta. Cuando queda lista se carga en un camión que sale por una ruta con paradas.<\/p><p>La historia no termina cuando el camión se va. Termina cuando la entidad confirma la recepción: ahí pasa a Entregada y suma al impacto. Si nadie la recibe, vuelve al depósito y queda anotado como Entrega fallida.<\/p><\/div><\/div>\n  <p class=\"pull\">“Una donación no termina cuando sale el camión. Termina cuando alguien la confirma.”<small>Regla de la casa<\/small><\/p>\n <\/div>\n <aside class=\"side\">\n  <div class=\"box c\"><h3>Dentro de esta edición<\/h3><ul class=\"idx\">\n   <li><button data-go=\"registro\"><span>El registro de una donación<\/span><i>2<\/i><\/button><\/li>\n   <li><button data-go=\"galeria\"><span>Entregas, por categoría<\/span><i>3<\/i><\/button><\/li>\n   <li><button data-go=\"mapa\"><span>Mapa de impacto<\/span><i>4<\/i><\/button><\/li>\n   <li><button data-go=\"clasificados\"><span>Clasificados: sumate<\/span><i>5<\/i><\/button><\/li>\n   <li><button data-go=\"privacidad\"><span>Privacidad<\/span><i>6<\/i><\/button><\/li><\/ul><\/div>\n  <div class=\"box\"><h3>Quiénes donan<\/h3><div class=\"seg\" role=\"img\" aria-label=\"52 Colaboradores, 26 Sostenedores, 8 Transformadores\"><span style=\"flex:52;background:var(--mostaza)\">52<\/span><span style=\"flex:26;background:var(--celeste)\">26<\/span><span style=\"flex:8;background:var(--rosa)\">8<\/span><\/div><div class=\"lg\"><div><span>Colaboradores<\/span><b>52<\/b><\/div><div><span>Sostenedores<\/span><b>26<\/b><\/div><div><span>Transformadores<\/span><b>8<\/b><\/div><\/div><\/div>\n  <div class=\"box r\"><h3>Se busca<\/h3><p style=\"font-weight:700;font-size:15px\">Leche en polvo (6 de 40) para Merendero Norte. Frazadas (18 de 30) para Comedor Los Girasoles.<\/p><\/div>\n <\/aside><\/div>\n\n <div class=\"band\" aria-hidden=\"true\"><div id=\"band\"><\/div><\/div>\n\n <div class=\"prob\"><div><div class=\"kick\">El problema<\/div><h2 class=\"sx\" style=\"margin-top:12px\">Lo que no se anota <em>se sospecha.<\/em><\/h2><p class=\"t\">Cuando una donación sale de las manos de quien la trajo y no vuelve a aparecer en ningún papel, queda la pregunta más vieja de la ayuda: ¿a dónde fue? La respuesta de DonaTrack es un registro que cualquiera puede leer.<\/p><\/div>\n  <div class=\"vs\"><div class=\"box no\"><h3>Sin registro<\/h3><ul><li>Una caja entra al depósito y nadie sabe cuándo vence.<\/li><li>La ayuda sale y no vuelve ninguna confirmación.<\/li><li>Quien donó no se entera de dónde terminó.<\/li><\/ul><\/div>\n  <div class=\"box y\"><h3>Con registro<\/h3><ul><li>Cada cambio de estado queda con fecha y responsable.<\/li><li>La entidad confirma la recepción y recién ahí se cuenta.<\/li><li>Las cifras públicas salen del mismo libro.<\/li><\/ul><\/div><\/div><\/div>\n\n <div class=\"sec\"><div class=\"kick\">Los tres actores<\/div><h2 class=\"sx\" style=\"margin-top:12px\">Tres firmas <em>en cada nota.<\/em><\/h2>\n  <div class=\"three\">\n   <article class=\"firma\"><header class=\"s-dep\"><h3>Donante<\/h3><span class=\"n\">I<\/span><\/header><ul><li>Persona humana o jurídica que lleva la donación al depósito.<\/li><li>Ve el historial de estados de cada una de sus donaciones.<\/li><li>Conoce las entidades beneficiarias y sus necesidades.<\/li><li>Tiene incentivos: categoría de donante, misiones con progreso e insignias, y notificaciones.<\/li><\/ul><p class=\"q\">“Quiero saber a dónde fue.”<\/p><\/article>\n   <article class=\"firma\"><header class=\"s-asig\"><h3>Entidad<\/h3><span class=\"n\">II<\/span><\/header><ul><li>Publica sus necesidades activas y ve la cobertura, por ejemplo 18 de 30 frazadas.<\/li><li>Ve las donaciones que se le asignaron.<\/li><li>Confirma la recepción: ese es el paso que cierra la historia.<\/li><li>Recibe notificaciones.<\/li><\/ul><p class=\"q\">“Llegó. Lo confirmo yo.”<\/p><\/article>\n   <article class=\"firma\"><header class=\"s-lista\"><h3>Administración<\/h3><span class=\"n\">III<\/span><\/header><ul><li>Registra cada donación y revisa la normalización de datos.<\/li><li>Maneja el inventario en depósito y marca las vencidas.<\/li><li>Ejecuta las asignaciones y aprueba o descarta propuestas.<\/li><li>Organiza camiones y rutas, mira rankings e importa donantes por CSV.<\/li><\/ul><p class=\"q\">“Yo anoto y yo respondo.”<\/p><\/article>\n  <\/div><\/div>\n\n <div class=\"sec\"><div class=\"kick\">Transparencia en números<\/div><h2 class=\"sx\" style=\"margin-top:12px\">El balance, <em>a la vista.<\/em><\/h2>\n  <div class=\"nums\"><div><b>128<\/b><span>donaciones entregadas<\/span><\/div><div><b>34<\/b><span>entidades ayudadas<\/span><\/div><div><b>2.448<\/b><span>kg de alimentos distribuidos<\/span><\/div><div><b>86<\/b><span>donantes activos<\/span><\/div><\/div>\n  <p class=\"note\"><span class=\"demo\">Datos de demostración<\/span> &nbsp;Las cifras de esta edición son de ejemplo y se calculan del mismo registro que se ve en la página 2.<\/p><\/div>\n\n <div class=\"endcta\"><div><h2>Sumate al registro. <em>Todo queda anotado.<\/em><\/h2><p>Doná, recibí o administrá: según quién seas, el registro te nombra con tu fecha y tu responsabilidad.<\/p><\/div><div class=\"cta\"><a class=\"btn\" href=\"#\" data-go=\"clasificados\">Ver los clasificados<\/a><a class=\"btn w\" href=\"#\">Ingresar<\/a><\/div><\/div>\n<\/section>\n\n<!-- PÁGINA 2 -->\n<section class=\"panel\" id=\"registro\" role=\"tabpanel\" aria-labelledby=\"t-registro\" hidden>\n <div class=\"kick\" style=\"margin-top:26px\">Pág. 2 · Cómo funciona<\/div>\n <h2 class=\"sx\" style=\"margin-top:12px\">El registro de <em>una donación.<\/em><\/h2>\n <p class=\"lede it\">Siete estados, un solo libro. Tocá un estado para leer qué significa y quién lo cambia.<\/p>\n <div class=\"train\" id=\"train\" role=\"group\" aria-label=\"Estados de una donación\"><\/div>\n <div class=\"detour\" id=\"detour\"><span>Desvíos:<\/span><\/div>\n <div class=\"sdet\" id=\"sdet\" aria-live=\"polite\"><\/div>\n\n <div class=\"sec\"><div class=\"kick\">Un renglón del libro<\/div>\n <h2 class=\"sx\" style=\"margin-top:12px;font-size:clamp(28px,3.6vw,52px)\">DT-0412, <em>línea por línea.<\/em><\/h2>\n <p class=\"lede it\" style=\"font-size:20px\">Arroz 50 kg · Cooperativa La Huerta → Comedor Los Girasoles. Cada línea tiene fecha y responsable.<\/p>\n <div class=\"ctl\" role=\"group\" aria-label=\"Controles del recorrido\"><button class=\"btn sm\" id=\"play\">Reproducir el recorrido<\/button><button class=\"btn sm w\" id=\"step\">Paso siguiente<\/button><button class=\"btn sm w\" id=\"reset\">Volver a hoy<\/button>\n  <span style=\"width:12px\"><\/span><button class=\"chip\" aria-pressed=\"true\" data-v=\"ledger\">Ver como registro<\/button><button class=\"chip\" aria-pressed=\"false\" data-v=\"story\">Ver como relato<\/button><\/div>\n <div class=\"ledger\" id=\"ledger\"><div class=\"lr h\"><span>Fecha<\/span><span>Estado<\/span><span>Qué pasó<\/span><span>Responsable<\/span><\/div><\/div>\n <div class=\"story\" id=\"story\"><\/div>\n <p class=\"note\">Fechas de ejemplo. Si un paso depende de un evento asíncrono, el registro dice <b>Actualizando…<\/b> y no da el éxito por hecho.<\/p><\/div>\n<\/section>\n\n<!-- PÁGINA 3 -->\n<section class=\"panel\" id=\"galeria\" role=\"tabpanel\" aria-labelledby=\"t-galeria\" hidden>\n <div class=\"kick\" style=\"margin-top:26px\">Pág. 3 · Entregas<\/div>\n <h2 class=\"sx\" style=\"margin-top:12px\">Galería de <em>entregas.<\/em><\/h2>\n <p class=\"lede it\">Lo que ya llegó a destino, por categoría. Ejemplos de demostración.<\/p>\n <div class=\"filters\" id=\"filters\" role=\"group\" aria-label=\"Filtrar por categoría\"><\/div>\n <p class=\"note\" id=\"gcount\" role=\"status\"><\/p>\n <div class=\"gal\" id=\"gal\"><\/div>\n<\/section>\n\n<!-- PÁGINA 4 -->\n<section class=\"panel\" id=\"mapa\" role=\"tabpanel\" aria-labelledby=\"t-mapa\" hidden>\n <div class=\"kick\" style=\"margin-top:26px\">Pág. 4 · Mapa de impacto<\/div>\n <div class=\"soon\"><div><h2 class=\"sx\">Mapa de impacto: <em>en preparación.<\/em><\/h2><div class=\"stamp\">Próximamente<\/div><p style=\"font-size:18px;max-width:44ch;font-weight:600\">Todavía no está disponible. El esquema de al lado es una ilustración de cómo podría leerse un recorrido: no tiene ubicaciones reales ni seguimiento en vivo.<\/p><p class=\"note\"><span class=\"demo\">Ilustrativo<\/span><\/p><\/div>\n <svg viewBox=\"0 0 420 280\" role=\"img\" aria-label=\"Esquema ilustrativo, sin ubicaciones reales: un depósito unido por una ruta a tres paradas\"><defs><pattern id=\"g\" width=\"20\" height=\"20\" patternUnits=\"userSpaceOnUse\"><path d=\"M20 0H0V20\" fill=\"none\" stroke=\"#15130F\" stroke-opacity=\".12\" stroke-width=\"1\"/><\/pattern><\/defs><rect width=\"420\" height=\"280\" fill=\"url(#g)\"/><path d=\"M40 220 L150 150 L260 175 L380 70\" stroke=\"#15130F\" stroke-width=\"9\" fill=\"none\" stroke-linejoin=\"round\"/><path d=\"M40 220 L150 150 L260 175 L380 70\" stroke=\"#F4ECD8\" stroke-width=\"3\" stroke-dasharray=\"10 9\" fill=\"none\"/><rect x=\"16\" y=\"196\" width=\"48\" height=\"48\" fill=\"#F2B705\" stroke=\"#15130F\" stroke-width=\"4\"/><text x=\"40\" y=\"226\" text-anchor=\"middle\" font-family=\"Archivo,Arial,sans-serif\" font-weight=\"800\" font-size=\"12\">DEP.<\/text><circle cx=\"150\" cy=\"150\" r=\"17\" fill=\"#7FB2F0\" stroke=\"#15130F\" stroke-width=\"4\"/><circle cx=\"260\" cy=\"175\" r=\"17\" fill=\"#F59BB8\" stroke=\"#15130F\" stroke-width=\"4\"/><circle cx=\"380\" cy=\"70\" r=\"17\" fill=\"#3FA566\" stroke=\"#15130F\" stroke-width=\"4\"/><text x=\"150\" y=\"124\" text-anchor=\"middle\" font-family=\"Archivo,Arial,sans-serif\" font-weight=\"800\" font-size=\"11\">PARADA 1<\/text><text x=\"260\" y=\"213\" text-anchor=\"middle\" font-family=\"Archivo,Arial,sans-serif\" font-weight=\"800\" font-size=\"11\">PARADA 2<\/text><text x=\"380\" y=\"44\" text-anchor=\"middle\" font-family=\"Archivo,Arial,sans-serif\" font-weight=\"800\" font-size=\"11\">PARADA 3<\/text><rect x=\"196\" y=\"250\" width=\"214\" height=\"22\" fill=\"#15130F\"/><text x=\"303\" y=\"265\" text-anchor=\"middle\" font-family=\"Archivo,Arial,sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#F4ECD8\">ILUSTRATIVO · SIN UBICACIONES<\/text><\/svg><\/div>\n<\/section>\n\n<!-- PÁGINA 5 -->\n<section class=\"panel\" id=\"clasificados\" role=\"tabpanel\" aria-labelledby=\"t-clasificados\" hidden>\n <div class=\"kick\" style=\"margin-top:26px\">Pág. 5 · Clasificados<\/div>\n <h2 class=\"sx\" style=\"margin-top:12px\">Clasificados: <em>ofrecemos y buscamos.<\/em><\/h2>\n <p class=\"lede it\">Tres avisos para sumarte: persona humana, persona jurídica o entidad beneficiaria.<\/p>\n <div class=\"cls\"><a href=\"#\"><span class=\"ab\">Aviso Nº 1 · Persona humana<\/span><h3>Ofrezco<\/h3><span class=\"t\">Soy una persona y quiero donar. Mis donaciones quedan en el registro con su historial de estados.<\/span><b>Registrarme como donante →<\/b><\/a>\n <a href=\"#\"><span class=\"ab\">Aviso Nº 2 · Persona jurídica<\/span><h3>Ofrece mi empresa<\/h3><span class=\"t\">Somos una organización y queremos donar con trazabilidad.<\/span><b>Registrar persona jurídica →<\/b><\/a>\n <a href=\"#\"><span class=\"ab\">Aviso Nº 3 · Entidad<\/span><h3>Necesitamos<\/h3><span class=\"t\">Somos una entidad beneficiaria y publicamos lo que falta, con su cobertura.<\/span><b>Registrar mi entidad →<\/b><\/a><\/div>\n <div class=\"ing\"><div><h3>¿Ya tenés cuenta?<\/h3><p style=\"font-weight:600\">Ingresá con la sesión de demostración por rol.<\/p><\/div><div class=\"cta\"><a class=\"btn sm\" href=\"#\">Ingresar como donante<\/a><a class=\"btn sm w\" href=\"#\">Ingresar como entidad<\/a><a class=\"btn sm ink\" href=\"#\">Ingresar como administración<\/a><\/div><\/div>\n<\/section>\n\n<!-- PÁGINA 6 -->\n<section class=\"panel\" id=\"privacidad\" role=\"tabpanel\" aria-labelledby=\"t-privacidad\" hidden>\n <div class=\"kick\" style=\"margin-top:26px\">Pág. 6 · Privacidad<\/div>\n <h2 class=\"sx\" style=\"margin-top:12px\">Lo que se publica, <em>y lo que no.<\/em><\/h2>\n <p class=\"lede it\">Un registro público no tiene por qué ser un registro indiscreto.<\/p>\n <div class=\"priv\"><div class=\"box y\"><h3>Lo que lee cualquiera<\/h3><ul><li>Cifras agregadas de transparencia: entregas, entidades, kilos y donantes activos.<\/li><li>La galería de entregas, por categoría.<\/li><li>Esta portada y el recorrido de ejemplo de una donación.<\/li><\/ul><\/div>\n <div class=\"box\"><h3>Lo que pide sesión<\/h3><ul><li>El historial de cada donación, para quien donó.<\/li><li>Las donaciones asignadas y la confirmación de recepción, para la entidad.<\/li><li>La operación del depósito, para la administración.<\/li><\/ul><\/div><\/div>\n <p class=\"note\"><span class=\"demo\">Maqueta<\/span> &nbsp;Esta página resume la idea de la pantalla Privacidad. El texto legal vigente es el de esa pantalla del producto.<\/p>\n<\/section>\n<\/main>\n\n<footer>\n <div><h4>DonaTrack · La Gaceta<\/h4><p>Plataforma de gestión y trazabilidad de donaciones para organizaciones solidarias universitarias.<\/p><\/div>\n <div><h4>Páginas<\/h4><ul><li><button class=\"l\" data-go=\"portada\">Portada<\/button><\/li><li><button class=\"l\" data-go=\"registro\">El registro<\/button><\/li><li><button class=\"l\" data-go=\"galeria\">Entregas<\/button><\/li><li><button class=\"l\" data-go=\"mapa\">Mapa de impacto<\/button><\/li><\/ul><\/div>\n <div><h4>Participá<\/h4><ul><li><button class=\"l\" data-go=\"clasificados\">Registrarme<\/button><\/li><li><a href=\"#\">Ingresar<\/a><\/li><li><button class=\"l\" data-go=\"privacidad\">Privacidad<\/button><\/li><\/ul><\/div>\n <div class=\"fb\"><span>Proyecto académico UTN-FRBA<\/span><span>Datos de demostración<\/span><\/div>\n<\/footer>\n<\/div>\n<script>\nconst $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];\nconst tabs=$$('[role=tab]'),ids=tabs.map(t=>t.dataset.t);\nfunction go(id,focus){if(!ids.includes(id))id='portada';tabs.forEach(t=>{const on=t.dataset.t===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1});$$('.panel').forEach(p=>p.hidden=p.id!==id);try{history.replaceState(null,'','#'+id)}catch(e){}window.scrollTo({top:0});if(focus)$('#t-'+id).focus()}\ntabs.forEach((t,i)=>{t.addEventListener('click',()=>go(t.dataset.t));t.addEventListener('keydown',e=>{let n=null;if(e.key==='ArrowRight')n=(i+1)%tabs.length;if(e.key==='ArrowLeft')n=(i+tabs.length-1)%tabs.length;if(e.key==='Home')n=0;if(e.key==='End')n=tabs.length-1;if(n!==null){e.preventDefault();go(ids[n],true)}})});\ndocument.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();go(a.dataset.go)}else{const l=e.target.closest('a[href=\"#\"]');if(l)e.preventDefault()}});\nconst SL={dep:\"En depósito\",asig:\"Asignada\",lista:\"Lista para entregar\",trasl:\"En traslado\",ent:\"Entregada\",fall:\"Entrega fallida\",venc:\"Vencida\"};\nconst CL={dep:'#F2B705',asig:'#7FB2F0',lista:'#F59BB8',trasl:'#E8452C',ent:'#3FA566',fall:'#f0b9ae',venc:'#15130F'};\n$('#band').innerHTML=Object.keys(SL).concat(Object.keys(SL)).map(k=>`<span style=\"--c:${CL[k]}\">${SL[k]}<\/span>`).join('');\n/* estados */\nconst SD={dep:[\"EN_DEPOSITO\",\"Llegó al depósito y se registró: qué es, cuánta hay, cuándo vence y su categoría. Espera una asignación.\",\"Cambia: Administración\"],asig:[\"ASIGNACION_REALIZADA\",\"El sistema propuso una necesidad concreta de una entidad y la administración revisó y aprobó.\",\"Cambia: Sistema propone, Administración aprueba\"],lista:[\"LISTA_PARA_ENTREGAR\",\"Está preparada y se suma a un camión que va a salir por una ruta con paradas.\",\"Cambia: Administración\"],trasl:[\"EN_TRASLADO\",\"El camión salió. Algunos cambios dependen de eventos asíncronos: mientras tanto el registro dice Actualizando…\",\"Cambia: Administración\"],ent:[\"ENTREGADA\",\"La entidad confirmó la recepción. Recién ahí la donación suma al impacto y a las cifras públicas.\",\"Cambia: Entidad\"],fall:[\"ENTREGA_FALLIDA\",\"Nadie recibió la donación. Vuelve al depósito y queda anotado, con fecha y responsable.\",\"Cambia: Administración\"],venc:[\"VENCIDA\",\"Pasó su fecha de vencimiento. La administración la marca como vencida desde el inventario.\",\"Cambia: Administración\"]};\nconst main=['dep','asig','lista','trasl','ent'];let cur='trasl';\nconst mk=(k,i)=>`<button class=\"st\" data-k=\"${k}\" aria-pressed=\"false\">${i?`<i>${i}<\/i>`:''}<span class=\"tag s-${k}\">${SL[k]}<\/span><\/button>`;\n$('#train').innerHTML=main.map((k,i)=>mk(k,i+1)).join('');\n$('#detour').insertAdjacentHTML('beforeend',mk('fall')+mk('venc'));\nfunction showS(k){cur=k;$$('.st').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));const d=SD[k];$('#sdet').innerHTML=`<span class=\"tag s-${k}\" style=\"font-size:13px;padding:8px 10px\">${SL[k]}<\/span><div><h3>${SL[k]}<\/h3><p>${d[1]}<\/p><\/div><div><code>${d[0]}<\/code><p class=\"who\" style=\"margin-top:8px\">${d[2]}<\/p><\/div>`}\n$('#train').addEventListener('click',e=>{const b=e.target.closest('.st');if(b){showS(b.dataset.k);if(main.includes(b.dataset.k))setStep(main.indexOf(b.dataset.k),true)}});\n$('#detour').addEventListener('click',e=>{const b=e.target.closest('.st');if(b)showS(b.dataset.k)});\n/* libro */\nconst L=[[\"mié 28/10\",\"dep\",\"Llegó al depósito y se registró: arroz, 50 kg, categoría Alimentos.\",\"Administración\"],[\"jue 29/10\",\"asig\",\"Propuesta del sistema aprobada para Comedor Los Girasoles.\",\"Administración\"],[\"vie 30/10\",\"lista\",\"Quedó lista y se cargó al Camión 2.\",\"Administración\"],[\"sáb 31/10\",\"trasl\",\"Salió en el Camión 2 con 6 donaciones.\",\"Administración\",\"Actualizando…\"],[\"pendiente\",\"ent\",\"Falta la confirmación de recepción de la entidad. Hasta entonces no se cuenta como entregada.\",\"Entidad\"]];\nconst ST=[\"Llegó al depósito el miércoles por la mañana y la administración la anotó.\",\"El sistema la asignó a una necesidad de Comedor Los Girasoles y la administración aprobó.\",\"El viernes quedó lista y se sumó al Camión 2.\",\"Hoy salió con otras cinco donaciones y está En traslado. El estado se está actualizando.\",\"Falta que la entidad confirme. Cuando lo haga, pasa a Entregada y suma al impacto.\"];\nlet step=3,timer=null;\n$('#ledger').insertAdjacentHTML('beforeend',L.map((r,i)=>`<div class=\"lr\" data-i=\"${i}\"><b>${r[0]}<\/b><span><span class=\"tag s-${r[1]}\">${SL[r[1]]}<\/span><\/span><span>${r[2]}${r[4]?`<br><span class=\"async\">${r[4]}<\/span>`:''}<\/span><span>${r[3]}<\/span><\/div>`).join(''));\n$('#story').innerHTML=ST.map((t,i)=>`<p data-i=\"${i}\"><b>${L[i][0]} · ${SL[L[i][1]]}<\/b>${t}<\/p>`).join('');\nfunction setStep(n,keep){step=n;$$('#ledger .lr:not(.h)').forEach(r=>{const i=+r.dataset.i;r.classList.toggle('now',i===n);r.classList.toggle('next',i>n)});$$('#story p').forEach(p=>p.style.opacity=+p.dataset.i>n?.35:1);if(!keep)showS(main[n])}\nfunction stop(){clearInterval(timer);timer=null;$('#play').textContent='Reproducir el recorrido'}\n$('#play').addEventListener('click',()=>{if(timer){stop();return}$('#play').textContent='Pausar';setStep(0);timer=setInterval(()=>{if(step>=4){stop();return}setStep(step+1)},1600)});\n$('#step').addEventListener('clic n>Ir a, filtrar o actuar…<\/span><kbd>Ctrl K<\/kbd><\/button><\/div><\/div>\n<nav class=\"idxn\" id=\"idxn\" role=\"tablist\" aria-label=\"Pantallas de administración\"><\/nav>\n<main id=\"main\">\n\n<!-- INICIO -->\n<section class=\"view\" id=\"v-inicio\" role=\"tabpanel\" aria-labelledby=\"tab-inicio\">\n <h1 class=\"big\">Sábado 31: <em>cinco asuntos<\/em> y un libro por abrir.<\/h1>\n <p class=\"sub\">Depósito central. <span id=\"circtxt\"><\/span><\/p>\n <div class=\"circ\"><div class=\"top\"><span><b id=\"circn\">45<\/b> <strong>donaciones en circulación<\/strong><\/span><span style=\"font-weight:700;font-size:14px\">Tocá un tramo para filtrar el libro<\/span><\/div>\n  <div class=\"seg\" id=\"seg\"><\/div><div class=\"segl\" id=\"segl\"><\/div>\n  <div class=\"alerts\"><span class=\"pend\">4 llevan más de 5 días en depósito<\/span><span class=\"pend\">2 asignadas sin camión<\/span><span class=\"pend\">3 camiones en ruta o cargando<\/span><\/div><\/div>\n\n <h2 class=\"s\">Titulares <em>del día<\/em><\/h2>\n <p class=\"kk\">Ordenados por urgencia. Cada titular tiene su acción; lo que depende de otro actor queda como pendiente hasta que responda.<\/p>\n <div class=\"heads\" id=\"heads\"><\/div>\n\n <h2 class=\"s\">Libro de <em>registro<\/em><\/h2>\n <div class=\"two\"><div style=\"min-width:0\">\n  <p class=\"kk\" style=\"margin:0\">Las donaciones que piden atención. Tocá una fila para abrir su historial.<\/p>\n  <div class=\"filters\" id=\"filters\" role=\"group\" aria-label=\"Filtrar por estado\"><\/div>\n  <div class=\"ledger\" id=\"ledger\"><\/div><\/div>\n <div class=\"col\">\n  <div class=\"box y\"><h3>Parte de ruta<\/h3><div class=\"rt\" id=\"rt\"><\/div><p style=\"margin-top:12px\"><button class=\"btn sm w\" data-v=\"camiones\">Ver camiones y paradas<\/button><\/p><\/div>\n  <div class=\"box\"><h3>Necesidades abiertas<\/h3><div id=\"needs\"><\/div><\/div><\/div><\/div>\n\n <h2 class=\"s\">Crónica <em>de las últimas horas<\/em><\/h2>\n <div class=\"two\"><div class=\"box p\"><ul class=\"ac\">\n  <li><time>12 min<\/time>Los Girasoles confirmó la recepción de DT-0409 (frazadas ×30).<\/li>\n  <li><time>40 min<\/time>El camión 2 salió con 6 donaciones hacia Los Girasoles.<\/li>\n  <li><time>1 h<\/time>El sistema asignó DT-0415 (útiles) a la necesidad de Escuela 12.<\/li>\n  <li><time>2 h<\/time>Recibida DT-0416 (conservas 24 kg, Nicolás Pérez).<\/li>\n  <li><time>3 h<\/time>DT-0411 quedó lista y se sumó al camión 3.<\/li>\n  <li><time>ayer<\/time>Nadie recibió DT-0390 en Merendero Norte: vuelve al depósito (Entrega fallida).<\/li><\/ul><\/div>\n  <div class=\"box\"><h3>Ranking del mes<\/h3><ol class=\"rk\"><li>Cooperativa La Huerta<\/li><li>Nicolás Pérez<\/li><li>Panadería El Molino<\/li><\/ol><p style=\"margin-top:14px\"><button class=\"btn sm w\" data-v=\"rankings\">Ver rankings<\/button> <button class=\"btn sm w\" data-v=\"donantes\">Importar CSV de donantes<\/button><\/p><\/div><\/div>\n\n <h2 class=\"s\">Balance <em>del mes<\/em><\/h2>\n <div class=\"kp\"><div><b>31<\/b><span>recibidas este mes (+8 %)<\/span><\/div><div><b>23<\/b><span>entregadas este mes (+15 %)<\/span><\/div><div><b>2.450 kg<\/b><span>distribuidos a 34 entidades<\/span><\/div><\/div>\n <div class=\"eq\" style=\"margin-top:26px\">\n  <div class=\"box\"><h3>Ocho semanas, S34–S41<\/h3><div class=\"dots\" id=\"dots\" role=\"img\"><\/div><div class=\"wl\" id=\"wl\"><\/div><div class=\"legend\"><span class=\"tag s-dep\">cuadro amarillo: recibida<\/span><span class=\"tag s-ent\">cuadro verde: entregada<\/span><\/div><\/div>\n  <div class=\"box\"><h3>Impacto por categoría<\/h3><div class=\"cat\" id=\"cat\"><\/div><p style=\"font-weight:600;font-size:13px;margin-top:14px\">Acumulado: 2.450 kg distribuidos a 34 entidades.<\/p><\/div><\/div>\n<\/section>\n\n<!-- DONANTES -->\n<section class=\"view\" id=\"v-donantes\" role=\"tabpanel\" aria-labelledby=\"tab-donantes\" hidden>\n <h1 class=\"big\">Donantes: <em>86 firman<\/em> el libro.<\/h1><p class=\"sub\">Vista resumida. Personas humanas y jurídicas que llevan donaciones al depósito.<\/p>\n <div class=\"eq\" style=\"margin-top:26px\">\n  <div class=\"box y\"><h3>Categorías de donante<\/h3><div class=\"seg\" style=\"height:46px\" role=\"img\" aria-label=\"52 Colaboradores, 26 Sostenedores, 8 Transformadores\"><span style=\"flex:52;background:var(--mostaza);display:grid;place-items:center;border-right:3px solid var(--ink);font:400 20px var(--f-head)\">52<\/span><span style=\"flex:26;background:var(--celeste);display:grid;place-items:center;border-right:3px solid var(--ink);font:400 20px var(--f-head)\">26<\/span><span style=\"flex:8;background:var(--rosa);display:grid;place-items:center;font:400 16px var(--f-head)\">8<\/span><\/div>\n  <div class=\"cat\" style=\"margin-top:12px\"><div style=\"grid-template-columns:1fr auto\"><span>Colaboradores<\/span><b>52<\/b><\/div><div style=\"grid-template-columns:1fr auto\"><span>Sostenedores<\/span><b>26<\/b><\/div><div style=\"grid-template-columns:1fr auto\"><span>Transformadores<\/span><b>8<\/b><\/div><\/div><\/div>\n  <div class=\"box\"><h3>Importar CSV de donantes<\/h3><p class=\"kk\">Elegí un archivo .csv. Se lee en tu navegador para contar filas; la carga real queda pendiente de revisión.<\/p>\n   <input type=\"file\" id=\"csv\" accept=\".csv,text/csv\" aria-label=\"Archivo CSV de donantes\" style=\"font:600 14px var(--f-body);max-width:100%\"><p id=\"csvres\" role=\"status\" style=\"margin-top:12px;font-weight:700\"><\/p><\/div><\/div>\n<\/section>\n\n<!-- ENTIDADES -->\n<section class=\"view\" id=\"v-entidades\" role=\"tabpanel\" aria-labelledby=\"tab-entidades\" hidden>\n <h1 class=\"big\">Entidades: <em>34 ayudadas,<\/em> 3 esperando.<\/h1><p class=\"sub\">Vista resumida. Las entidades nuevas se aprueban antes de poder recibir asignaciones.<\/p>\n <h2 class=\"s\">Esperan <em>aprobación<\/em><\/h2>\n <div class=\"tbl ent\" id=\"ents\"><\/div>\n <h2 class=\"s\">Necesidades <em>abiertas<\/em><\/h2><div class=\"box\" style=\"max-width:640px\" id=\"needs2\"><\/div>\n<\/section>\n\n<!-- DONACIONES -->\n<section class=\"view\" id=\"v-donaciones\" role=\"tabpanel\" aria-labelledby=\"tab-donaciones\" hidden>\n <h1 class=\"big\">Donaciones: <em>lo que entra<\/em> y cómo se anota.<\/h1><p class=\"sub\">Registrar, revisar la normalización de los datos y manejar el inventario en depósito.<\/p>\n <div class=\"filters\" id=\"subs\" role=\"group\" aria-label=\"Sección de donaciones\" style=\"margin-top:22px\"><button class=\"chip\" data-sub=\"inventario\" aria-pressed=\"true\">Inventario en depósito<\/button><button class=\"chip\" data-sub=\"registrar\" aria-pressed=\"false\">Registrar donación<\/button><button class=\"chip\" data-sub=\"normalizacion\" aria-pressed=\"false\">Revisión de normalización <b id=\"nn\">3<\/b><\/button><\/div>\n <div id=\"s-inventario\"><p class=\"kk\">Lo que hoy está en el depósito. Muestra 6 de 18 en depósito. “Marcar vencida” responde con Actualizando… antes de cambiar el estado.<\/p><div class=\"tbl inv\" id=\"inv\"><\/div><\/div>\n <div id=\"s-registrar\" hidden><p class=\"kk\">Anotá la donación tal como llegó: qué es, cantidad, vencimiento y categoría.<\/p>\n  <form class=\"reg\" id=\"reg\"><label>Donante<select id=\"f-don\"><option>Cooperativa La Huerta<\/option><option>Nicolás Pérez<\/option><option>Panadería El Molino<\/option><option>Librería Central<\/option><option>Lácteos del Sur<\/option><\/select><\/label>\n   <label>Qué es<input id=\"f-que\" required placeholder=\"Ej.: leche en polvo\"><\/label>\n   <label>Cantidad<input id=\"f-cant\" type=\"number\" min=\"1\" required placeholder=\"Ej.: 20\"><\/label>\n   <label>Unidad<select id=\"f-uni\"><option>u<\/option><option>kg<\/option><option>l<\/option><\/select><\/label>\n   <label>Categoría<select id=\"f-cat\"><option>Alimentos<\/option><option>Bebidas<\/option><option>Vestimenta<\/option><option>Mobiliario<\/option><option>Útiles escolares<\/option><option>Higiene<\/option><\/select><\/label>\n   <label>Vencimiento<input id=\"f-ven\" type=\"date\"><\/label>\n   <div class=\"fw\"><button class=\"btn\" type=\"submit\" id=\"f-ok\">Registrar donación<\/button><span id=\"f-res\" role=\"status\" style=\"font-weight:700\"><\/span><\/div><\/form><\/div>\n <div id=\"s-normalizacion\" hidden><p class=\"kk\">El sistema propone cómo escribir cada dato. Aprobá la sugerencia o dejala para revisar a mano.<\/p><div class=\"tbl nrm\" id=\"nrm\"><\/div><\/div>\n<\/section>\n\n<!-- ASIGNACIONES -->\n<section class=\"view\" id=\"v-asignaciones\" role=\"tabpanel\" aria-labelledby=\"tab-asignaciones\" hidden>\n <h1 class=\"big\">Asignaciones: <em>el sistema propone,<\/em> vos firmás.<\/h1><p class=\"sub\">Revisá cada propuesta: aprobar la deja Asignada, descartar la devuelve al depósito sin asignar.<\/p>\n <div style=\"margin-top:20px\" class=\"act\" ><button class=\"btn\" id=\"runAsig\" data-act=\"asignar\" style=\"margin-right:auto\">Ejecutar asignación<\/button><\/div>\n <h2 class=\"s\">Propuestas <em>para revisar<\/em> <span class=\"tag\" id=\"pcount\" style=\"vertical-align:middle;font-family:var(--f-body)\"><\/span><\/h2>\n <div class=\"tbl prop\" id=\"props\"><\/div>\n <h2 class=\"s\">Asignadas <em>sin camión<\/em><\/h2><p class=\"kk\">Ya tienen entidad, pero todavía no están cargadas en ningún camión.<\/p>\n <div class=\"tbl prop\" id=\"nocam\"><\/div>\n<\/section>\n\n<!-- CAMIONES -->\n<section class=\"view\" id=\"v-camiones\" role=\"tabpanel\" aria-labelledby=\"tab-camiones\" hidden>\n <h1 class=\"big\">Camiones: <em>tres rutas,<\/em> una hoja de ruta.<\/h1><p class=\"sub\">Flota, estado y paradas. Sin seguimiento en vivo: el avance se registra por parada.<\/p>\n <div class=\"trk\" id=\"trk\"><\/div>\n<\/section>\n\n<!-- RANKINGS -->\n<section class=\"view\" id=\"v-rankings\" role=\"tabpanel\" aria-labelledby=\"tab-rankings\" hidden>\n <h1 class=\"big\">Rankings: <em>quiénes<\/em> firmaron más.<\/h1><p class=\"sub\">Vista resumida. Ranking de donantes del mes, de ejemplo.<\/p>\n <div class=\"pod\" style=\"max-width:720px\"><div class=\"b2\"><b>2<\/b>Nicolás Pérez<\/div><div class=\"a\"><b>1<\/b>Cooperativa La Huerta<\/div><div class=\"c3\"><b>3<\/b>Panadería El Molino<\/div><\/div>\n <p style=\"margin-top:18px\"><span class=\"demo\">Ranking de ejemplo<\/span><\/p>\n<\/section>\n<\/main>\n<\/div>\n<div class=\"pal\" id=\"pal\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Paleta de comandos\"><div class=\"in\"><input id=\"q\" type=\"text\" placeholder=\"Escribí: asignar, vencida, camión, entidades…\" aria-label=\"Buscar comando\" autocomplete=\"off\" role=\"combobox\" aria-expanded=\"true\" aria-controls=\"res\"><ul id=\"res\" role=\"listbox\"><\/ul><small>Enter para ejecutar · Esc para cerrar<\/small><\/div><\/div>\n<div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n<script>\nconst $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];\nconst N={dep:\"En depósito\",asig:\"Asignada\",lista:\"Lista para entregar\",trasl:\"En traslado\",ent:\"Entregada\",fall:\"Entrega fallida\",venc:\"Vencida\"};\nconst CL={dep:'var(--mostaza)',asig:'var(--celeste)',lista:'var(--rosa)',trasl:'var(--tomato)'};\nconst tag=k=>`<span class=\"tag s-${k}\">${N[k]}<\/span>`;\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\n/* ---- estado ---- */\nconst C={dep:18,asig:11,lista:7,trasl:9};\nlet D=[\n{id:'DT-0398',w:'Frazadas · 30 u',from:'Cooperativa La Huerta',to:null,st:'dep',age:'En depósito 8 días',v:'—',h:['Recibida hace 8 días','Sin necesidad asignada']},\n{id:'DT-0401',w:'Yogur · 40 kg',from:'Lácteos del Sur',to:null,st:'dep',age:'En depósito 3 días · vence en 48 h',v:'48 h',h:['Recibida hace 3 días','Vence en 48 h','Sin necesidad asignada']},\n{id:'DT-0403',w:'Pan lactal · 60 u',from:'Panadería El Molino',to:'Comedor Los Girasoles',st:'asig',age:'Asignada 2 días · vence en 48 h',v:'48 h',h:['Registrada','Asignada a Comedor Los Girasoles','Vence en 48 h','A [i].s='a';ents();toast(EN[i].n+': alta aprobada.')});\n else if(a==='ebaja')work(b,()=>{EN[i].s='r';ents();toast(EN[i].n+': alta rechazada.')});\n});\n$('#reg').addEventListener('submit',e=>{e.preventDefault();const b=$('#f-ok');work(b,()=>{$('#f-res').textContent='Recibida. Quedó En depósito y la sugerencia de normalización espera tu revisión.';NR.push({o:$('#f-que').value.toLowerCase()+' '+$('#f-cant').value+$('#f-uni').value,s:$('#f-que').value.charAt(0).toUpperCase()+$('#f-que').value.slice(1)+' · '+$('#f-cant').value+' '+$('#f-uni').value,c:$('#f-cat').value,ok:0});nrm();$('#reg').reset();toast('Donación registrada.')},1600)});\n$('#csv').addEventListener('change',e=>{const fl=e.target.files[0],o=$('#csvres');if(!fl)return;o.textContent='Actualizando…';const r=new FileReader();r.onload=()=>{const n=String(r.result).split(/\\r?\\n/).filter(x=>x.trim()).length;setTimeout(()=>{o.textContent=`Leídas ${Math.max(n-1,0)} filas de “${fl.name}”. Pendiente: revisar duplicados antes de cargar.`},1300)};r.onerror=()=>{o.textContent='No se pudo leer el archivo.'};r.readAsText(fl)});\n/* ---- paleta ---- */\nconst Cm=[...V.map(v=>['Ir a '+v[1],'Pantalla',()=>go(v[0])]),['Ir a Donaciones · Registrar','Pantalla',()=>go('donaciones','registrar')],['Ir a Donaciones · Normalización','Pantalla',()=>go('donaciones','normalizacion')],\n['Ejecutar asignación','Acción',()=>{go('asignaciones');$('#runAsig').click()}],['Marcar vencida DT-0401','Acción',()=>{go('donaciones','inventario');const x=$('#inv [data-act=venc][data-id=\"DT-0401\"]');x?x.click():toast('DT-0401 ya no está en el inventario.')}],['Confirmar chofer del Camión 3','Acción',()=>{go('camiones');const x=$('#trk [data-act=chofer]');if(x&&!x.disabled)x.click()}],['Importar CSV de donantes','Acción',()=>{go('donantes');$('#csv').focus()}],\n['Filtrar: En depósito','Filtro',()=>{go('inicio');f='dep';ledger()}],['Filtrar: En traslado','Filtro',()=>{go('inicio');f='trasl';ledger()}],['Filtrar: Vence en 48 h','Filtro',()=>{go('i ick()}\nif(U.get('paleta')){open();q.value=U.get('paleta')==='1'?'':U.get('paleta');rend()}\n<\/script><\/body><\/html>\n", "sistema": {"concepto": "La Gaceta (d1-c2): DonaTrack como diario de barrio. Portada, titulares, libro de registro y clasificados; el dashboard es una columna de lectura con titulares numerados, libro con filas expandibles y paleta de comandos.", "principios": ["Lo que se dona se anota, se verifica y se publica: todo dato lleva fecha y responsable.", "Se lee antes de operar: primero el titular, después la acción.", "Lo asíncrono no se da por hecho: Actualizando… y estado pendiente hasta que responda el otro actor.", "Papel y tinta: mucho papel cálido, bloques de color con borde grueso y sombra dura solo donde hay que mirar.", "Grotesca pesada para lo que se afirma, serif itálica para lo que se cuenta.", "Teclado primero en la administración (Ctrl/Cmd+K)."], "tokens": {"color": {"--paper": "#F4ECD8 fondo", "--paper2": "#EADFC3 fondo secundario", "--paper3": "#FBE6B5 fila abierta / seleccionada", "--ink": "#15130F texto, bordes, sombras", "--mostaza": "#F2B705 En depósito, acento primario", "--celeste": "#7FB2F0 Asignada", "--rosa": "#F59BB8 Lista para entregar", "--tomato": "#E8452C En traslado, énfasis en titulares grandes", "--tomato-d": "#B02A14 énfasis en texto chico", "--verde": "#3FA566 Entregada"}, "tipografia": {"titulares": "Archivo Black (fallback Arial Black, Impact), interletrado -0.02 a -0.05em", "cuerpo": "Archivo 500/700/800 (fallback system-ui)", "editorial": "Instrument Serif itálica para bajadas, énfasis de titulares, números de página, relatos (fallback Georgia)", "escala": "h1 portada clamp(40px,6.4vw,100px); h2 sección clamp(28-32px,3.6-4.6vw,50-68px); cuerpo 15-16px; etiquetas 11px mayúsculas con tracking .05em"}, "espaciado": "Base 4/8 px; columnas de gutter 24-32 px; secciones separadas por 44-46 px; contenedor 1280 px (dashboard) y 1360 px (landing).", "radios": "0 en todo: ángulos rectos como la caja de imprenta.", "bordes/sombras": "Borde 3 px tinta; etiquetas 2 px; sombra dura sin blur 6x6 (bloques), 4x4 (botones), 3x3 (botones chicos); filete doble de 8 px bajo cabeceras; borde punteado para lo no confirmado o sin registro."}, "componentes": [{"nombre": "Cabecera de diario (mast)", "uso": "Marca gigante DonaTrack con orejas, fecha, sello Datos de demostración y filete doble."}, {"nombre": "Pestañas de página (landing) / Índice de pantallas (dashboard)", "uso": "Navegación como páginas del diario: 'Pág. N' + nombre; flechas, Home y End en la landing; badge con cantidad de pendientes."}, {"nombre": "Titular numerado", "uso": "Asunto del día con urgencia, texto en serif itálica, botón de acción y línea de resultado pendiente."}, {"nombre": "Libro de registro", "uso": "Tabla de renglones; cada fila se abre con su historial y acciones contextuales; filtros por estado como chips con conteo."}, {"nombre": "Cinta de circulación", "uso": "Barra segmentada 18/11/7/9 clicable que filtra el libro."}, {"nombre": "Tren de estados", "uso": "Los 7 estados como pestañas numeradas más desvíos (fallida, vencida) con detalle y código del backend."}, {"nombre": "Caja / Ear / Firma", "uso": "Bloques de color con borde y sombra dura para cifras, avisos y los tres actores."}, {"nombre": "Clasificado", "uso": "Aviso con borde punteado que al pasar el mouse se llena y se vuelve sólido: CTA de registro."}, {"nombre": "Hoja de ruta", "uso": "Paradas como cuadrados unidos por línea sólida (hecha) o punteada (por hacer)."}, {"nombre": "Columnas de cuadritos", "uso": "Ocho semanas: cuadro amarillo recibida, verde entregada, en lugar de gráfico de barras."}, {"nombre": "Paleta de comandos", "uso": "Ir a, filtrar o actuar con Ctrl/Cmd+K, flechas, Enter, Esc."}, {"nombre": "Botón en espera", "uso": "Texto Actualizando…, fondo rayado, deshabilitado y aria-busy mientras responde la acción."}, {"nombre": "Sello Próximamente / Ilustrativo", "uso": "Para lo no disponible o esquemático."}], "patrones": ["Una página,
