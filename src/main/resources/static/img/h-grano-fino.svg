<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Variante H: motas sueltas color celadón para dar textura de arena a títulos y superficies. -->
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="1" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.659  0 0 0 0 0.831  0 0 0 0 0.678  1 0 0 0 0"/>
    <feComponentTransfer><feFuncA type="discrete" tableValues="0 0 0 0 0 0 0 0.9"/></feComponentTransfer>
  </filter>
  <rect width="160" height="160" filter="url(#g)"/>
</svg>
