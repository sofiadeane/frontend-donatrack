# Textos de la interfaz. Los códigos del backend nunca se muestran tal cual.

# Servicios (se interpolan en los mensajes de error)
servicio.DONACIONES=el servicio de donaciones
servicio.NOTIFICACIONES=el servicio de notificaciones
servicio.INCENTIVOS=el servicio de incentivos
servicio.LOGISTICA=el servicio de logística

# Errores por tipo de falla ({0} = servicio)
error.tipo.NO_DISPONIBLE=No pudimos conectarnos con {0}. Probá de nuevo en unos minutos.
error.tipo.NO_ENCONTRADO=No encontramos lo que buscabas.
error.tipo.VALIDACION=Hay datos que no son válidos. Revisalos y volvé a intentar.
error.tipo.CONFLICTO=No se pudo hacer ese cambio en este momento.
error.tipo.ERROR=Algo salió mal al consultar {0}.

# Errores por código del backend (campo "code", p. ej. ERR-VAL-410; ver DonaTrack/docs/arquitectura/catalogo-errores.md)
error.codigo.ERR-VAL-101=El nombre es obligatorio.
error.codigo.ERR-VAL-102=El apellido es obligatorio.
error.codigo.ERR-VAL-103=La fecha de nacimiento no puede ser futura.
error.codigo.ERR-VAL-108=La calle es obligatoria si cargás un domicilio.
error.codigo.ERR-VAL-109=La altura debe ser un número mayor a cero.
error.codigo.ERR-VAL-110=Revisá el código postal.
error.codigo.ERR-VAL-111=La localidad es obligatoria si cargás un domicilio.
error.codigo.ERR-VAL-410=Esa donación ya no está en un estado que permita este cambio.

# Estados de una donación independiente (TipoEstadoDonacion)
estado.donacion.EN_DEPOSITO=En depósito
estado.donacion.ASIGNACION_REALIZADA=Asignada
estado.donacion.LISTA_PARA_ENTREGAR=Lista para entregar
estado.donacion.EN_TRASLADO=En traslado
estado.donacion.ENTREGADA=Entregada
estado.donacion.ENTREGA_FALLIDA=Entrega fallida
estado.donacion.VENCIDA=Vencida

# Estado de conservación de un bien (enum Estado)
bien.estado.NUEVO=Nuevo
bien.estado.USADO=Usado
bien.estado.DESGASTADO=Desgastado

# Unidades (enum Unidad de categorías)
unidad.UNIDADES=unidades
unidad.KILOGRAMO=kg
unidad.LITROS=litros
unidad.METRO=m
unidad.METRO_CUADRADO=m²
unidad.METRO_CUBICO=m³
