<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"

<head><title>DonaTrack — Gestión y trazabilidad de donaciones</title></head>
<body>
<th:block th:fragment="contenido">
  <!-- Provisorio (E0). La landing del Figma se construye en la épica E1. -->
  <section class="cabecera hero-provisorio" aria-labelledby="titulo-inicio">
    <span class="eyebrow">Trazabilidad de donaciones con impacto social</span>
    <h1 id="titulo-inicio">DonaTrack</h1>

      <a class="boton boton--primario" th:href="@{/ingresar}">Ingresar</a>

  </section>
</th:block>
