<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/publico :: layout(~{::title}, ~{::contenido})}">
<head><title>Cuenta creada · DonaTrack</title></head>
<body>
<th:block th:fragment="contenido">
  <div class="banda-hero banda-hero--resultado" data-hero aria-hidden="true"></div>
  <section class="resultado" data-fondo-claro aria-labelledby="titulo-listo">
    <span class="resultado__nodo" aria-hidden="true"><span th:replace="~{fragments/iconos :: icono('check', 34)}"></span></span>
    <h1 id="titulo-listo" th:text="'¡Listo, ' + ${exito.nombre} + '!'">¡Listo!</h1>
    <p th:if="${exito.tipo.name() == 'ENTIDAD'}">La cuenta de la entidad beneficiaria quedó creada. Desde su panel van a poder registrar necesidades y confirmar cada entrega.</p>
    <p th:unless="${exito.tipo.name() == 'ENTIDAD'}"
       th:text="'La cuenta de ' + ${exito.tipo.descripcion()} + ' quedó creada. Cuando llegue la primera donación al depósito, vas a poder seguir su recorrido desde el panel.'">Cuenta creada.</p>
    <span class="demo" th:if="${exito.demo}">Modo demostración: no se guardó nada</span>
    <div class="resultado__acciones">
      <a class="boton boton--primario" th:href="@{/ingresar}">Ingresar</a>
      <a class="boton boton--texto" th:href="@{/}">Volver al inicio</a>
    </div>
  </section>
</th:block>
</body>
</html>
