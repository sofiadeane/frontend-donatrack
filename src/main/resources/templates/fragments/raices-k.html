<!--
  Raíces de la variante K (ArbolRaices): la raíz principal baja desde el borde de la tierra (y = 0) hasta el nudo
  de origen; de él, una raíz por categoría, por subcategoría y por entidad.
  Con brote, el árbol del paso 4 asoma sobre el borde y el contenedor (.k-raices--brote) se sube con margen negativo
  para que quede sobre el papel. Sin brote (landing), lo que asoma es el árbol del paso 4 de Cómo funciona.
-->
<div th:fragment="arbol(arbol, etiqueta, brote)" th:class="|k-raices k-anima${brote ? ' k-raices--brote' : ''}|"
     class="k-raices k-anima" th:style="|--ancho: ${arbol.ancho}|">
  <svg th:attr="viewBox=${brote} ? |0 -110 ${arbol.ancho} ${arbol.alto + 110}| : |0 0 ${arbol.ancho} ${arbol.alto}|,aria-label=${etiqueta}"
       viewBox="0 -110 600 440" role="img" focusable="false">
    <!-- El árbol del paso 4 (ilustración de Sofía), cortado en la línea del suelo: el tronco cae sobre la raíz principal. -->
    <svg th:if="${brote}" class="k-raices__brote" th:attr="x=${arbol.ancho / 2 - 65.3}" y="-110" width="130.6" height="110.2"
         viewBox="0 0 213.29 179.9"><use href="#k-como-4" width="213.29" height="251.65"/></svg>
    <path th:each="t : ${arbol.trazos}" th:attr="d=${t.d},pathLength=${t.enCamino} ? null : 1"
          th:class="|k-raiz k-raiz--${t.nivel}${t.enCamino ? ' k-raiz--camino' : ' k-raiz-dibujo'}|"/>
    <circle th:each="n : ${arbol.nudos}" th:attr="cx=${n.cx},cy=${n.cy},r=${n.r}"
            th:class="|k-nudo k-nudo--${n.nivel}${n.hueco ? ' k-nudo--hueco' : ''}|"/>
    <text th:each="r : ${arbol.rotulos}" th:attr="x=${r.x},y=${r.y},text-anchor=${r.ancla}"
          th:class="|k-rotulo k-rotulo--${r.clase}${arbol.hojas > 4 ? ' k-rotulo--chico' : ''}|" th:text="${r.texto}">Comedores</text>
  </svg>
</div>
