<!-- <head> de la variante K. Uso: th:replace="~{fragments/cabeza-k :: cabeza(${titulo})}" -->
<head th:fragment="cabeza(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title th:replace="${titulo}">DonaTrack</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
  <!-- El modo se aplica antes de pintar, para que no parpadee -->
  <script>try { if (localStorage.getItem("k-modo") === "oscuro") document.documentElement.setAttribute("data-modo", "oscuro"); } catch (e) {} document.documentElement.classList.add("js");</script>
  <link rel="preload" th:href="@{/fonts/dm-sans-latin.woff2}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" th:href="@{/css/fuentes.css}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&amp;display=swap">
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/k-huerta.css}">
  <script th:src="@{/js/k.js}" defer></script>
</head>

<!-- Botón de modo claro/oscuro -->
<button th:fragment="modo" type="button" class="k-modo" data-k-modo aria-pressed="false" aria-label="Modo oscuro">
  <svg class="k-modo__luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
  <svg class="k-modo__sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
</button>

<!-- Marca: la hoja de DonaTrack con una abeja chica -->
<a th:fragment="marca(href)" class="k-marca" th:href="@{${href}}" aria-label="DonaTrack, ir al inicio">
  <svg viewBox="0 0 30 34" aria-hidden="true"><use href="#k-p-brote" x="-12" y="-6" width="54" height="60"/><use href="#k-abeja" x="15" y="0" width="14" height="16"/></svg>
  <span>Dona<em>Track</em></span>
</a>
