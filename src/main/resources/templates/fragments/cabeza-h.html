<!-- <head> de la variante H. Uso: th:replace="~{fragments/cabeza-h :: cabeza(${titulo}, 'c-landing')}" -->
<head th:fragment="cabeza(titulo, hoja)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${titulo}">DonaTrack</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
  <link rel="preload" th:href="@{/fonts/dm-sans-latin.woff2}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" th:href="@{/css/fuentes.css}">
  <!-- Títulos en Archivo expandida (prueba de tipografías, opción B elegida) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,700..900&amp;display=swap">
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/c-base.css}">
  <link rel="stylesheet" th:href="@{/css/{hoja}.css(hoja=${hoja})}">
  <link rel="stylesheet" th:href="@{/css/h-theme.css}">
  <link rel="stylesheet" th:href="@{/css/i-theme.css}" th:if="${abejas}">
  <script>document.documentElement.classList.add('js')</script>
  <script th:src="@{/js/b.js}" defer></script>
  <script th:src="@{/js/h.js}" defer></script>
</head>
