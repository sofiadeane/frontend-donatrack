<!--
  Lámina de la variante K, toda con las ilustraciones de Sofía (Documents/SVG). Cada estado tiene su dibujo:
    proceso (en el depósito) → PASO 2: la maceta con el brote y la abeja que llega;
    camino → PASO 3: la planta chica con las abejas que la llevan;
    llego → una planta crecida en su maceta (naranjero, algodon, helecho o monstera), con una abeja que se va;
    corte → Entrega Fallida: la maceta con la flecha circular y la "i".
  Los dibujos ya traen su sombra de suelo; preserveAspectRatio del símbolo los apoya sobre la misma base (y = 282).
-->
<svg th:fragment="dibujo(planta, estado)" viewBox="0 0 200 290" aria-hidden="true" focusable="false"
     th:classappend="'is-' + ${estado}">
  <use th:if="${estado == 'proceso'}" href="#k-como-2" x="22" y="40" width="156" height="242"/>
  <use th:if="${estado == 'camino'}" href="#k-como-3" x="14" y="20" width="172" height="262"/>
  <th:block th:if="${estado == 'llego'}">
    <path class="k-ruta" d="M128 70 C146 50 162 62 178 38"/><use class="k-ab" href="#k-abeja" x="172" y="20" width="24" height="28"/>
    <use th:href="'#k-planta-' + ${planta}" href="#k-planta-naranjero" x="24" y="24" width="152" height="258"/>
  </th:block>
  <use th:if="${estado == 'corte'}" href="#k-reintento" x="30" y="122" width="140" height="160" preserveAspectRatio="xMidYMax meet"/>
</svg>
