<!-- Variante H, tema jardín · se suma a ilustraciones-i (que pone la abeja, la flor y la celda): acá van las plantas,
     protagonistas del tema. Dibujo de afiche como en Raíces: contorno de tinta, rellenos planos y una segunda tinta
     corrida (el fruto lleva su sombra mandarina oscura desplazada, como una impresión de dos pasadas). -->
